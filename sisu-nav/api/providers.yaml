# Sisu Nav dated tile harvest — provider registry (issue #80).
#
# Drives the "Charts -> Download" dropdown in web/src/plugins/harvest and the
# server-side harvester in api/harvest/. Do not add Mapbox/Google/Bing/Apple
# here — no official offline SKU / ToS forbids scraping (see CLAUDE.md
# provider table). USB drop-in tiles stay in tiles/manual/ (#76), not here.
#
# access:
#   free      - no credential needed
#   free-ish  - free but rate/ToS-limited; UI must show the limit before fetch
#   secret    - requires the named secretEnv; harvester refuses to run without it
#
# kind: nautical | satellite | bathymetry  (selects the tiles/<kind>/<id>/ tree)
#   bathymetry (#97) is the depth-relief floor #98/#99/#100 plug providers
#   into — no live bathymetry rows yet, this comment documents the kind only.
# harvester: matches a module in api/harvest/fetchers/<harvester>.mjs
# harvestable: false means "in the dropdown for information, not a harvest target"

providers:
  openseamap:
    label: OpenSeaMap
    kind: nautical
    access: free
    harvestable: false
    notes: >-
      Nautical marks; already served as a live XYZ overlay by the #76 map
      floor. Not a dated-harvest target (no harvester wired) — tiles/manual/
      is the drop-in path for anything offline.

  eox-s2cloudless:
    label: EOX Sentinel-2 cloudless
    kind: satellite
    access: free
    harvestable: true
    default: true
    harvester: eox
    template: "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg"
    format: jpg
    minZoom: 0
    maxZoom: 14
    attribution: "Sentinel-2 cloudless by EOX IT Services GmbH (CC BY-NC-SA 4.0) — contains modified Copernicus Sentinel data 2020"
    sourceUrl: "https://s2maps.eu/"
    # Product identity is the layer year, not the day we downloaded (#83).
    updateCadence: annual
    sourceDate:
      kind: layer
      layerId: s2cloudless-2020
    notes: >-
      Annual composite. This is the default satellite base layer — do not
      re-harvest weekly, it does not change that often.

  nasa-gibs:
    label: NASA GIBS (MODIS/VIIRS)
    kind: satellite
    access: free
    harvestable: true
    harvester: gibs
    layer: MODIS_Terra_CorrectedReflectance_TrueColor
    template: "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/{layer}/default/{time}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpeg"
    format: jpeg
    minZoom: 0
    maxZoom: 9
    attribution: "NASA EOSDIS GIBS — MODIS Terra Corrected Reflectance (True Color)"
    sourceUrl: "https://worldview.earthdata.nasa.gov/"
    updateCadence: daily
    sourceDate:
      kind: gibs-time
    notes: >-
      Near-daily. Harvest when this week's cloud cover / sun glare actually
      matters — pass an ISO date (job.time) to pin a day, otherwise yesterday
      UTC is used as the product day (GIBS "default" is resolved to a real date
      so skip/fill can compare sourceDate).

  noaa-enc:
    label: NOAA ENC → MBTiles
    kind: nautical
    access: free
    harvestable: true
    harvester: noaa-enc
    notes: >-
      USVI ok. BVI coverage check required before trusting this as a
      plotter — NOAA ENC does not reliably chart BVI waters. This harvester
      only checks/reports coverage today; full S-57-to-MBTiles conversion
      needs GDAL and is not implemented (see fetchers/noaa-enc.mjs — no
      gdal-async dependency has been added to sisu-nav-api, matching the
      #78 constraint against adding GDAL to this container).
    sourceUrl: "https://www.charts.noaa.gov/InteractiveCatalog/nrnc.shtml"

  esri-world-imagery:
    label: Esri World Imagery export
    kind: satellite
    access: free-ish
    harvestable: true
    harvester: esri
    template: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
    format: jpg
    minZoom: 0
    maxZoom: 19
    attribution: "Esri, Maxar, Earthstar Geographics, and the GIS community"
    sourceUrl: "https://www.arcgis.com/home/item.html?id=10df2279f9684e4a9f6a7f08febac2a9"
    exportLimitTiles: 4000
    updateCadence: 30d
    sourceDate:
      kind: http-head
    notes: >-
      Public tile endpoint, not an official bulk-export licence. Enforces a
      conservative per-job tile-count ceiling (exportLimitTiles) — the UI
      must show the estimate and refuse to start over the limit rather than
      silently exceeding it. Narrow the bbox/zoom range instead. Source date
      is Last-Modified/ETag of a sample tile, else a 30-day cadence bucket.

  maptiler-satellite:
    label: MapTiler Satellite (offline SKU)
    kind: satellite
    access: secret
    harvestable: true
    harvester: maptiler
    secretEnv: MAPTILER_API_KEY
    notes: >-
      Official offline MBTiles SKU (download, not a tile scrape). Requires
      MAPTILER_API_KEY (homeassistant/secrets.yaml -> maptiler_api_key);
      refuses to run without it.

  maxar:
    label: Maxar
    kind: satellite
    access: secret
    harvestable: true
    harvester: maxar
    secretEnv: MAXAR_API_KEY
    notes: >-
      Official export only. Requires MAXAR_API_KEY
      (homeassistant/secrets.yaml -> maxar_api_key); refuses to run without it.

  planet:
    label: Planet
    kind: satellite
    access: secret
    harvestable: true
    harvester: planet
    secretEnv: PLANET_API_KEY
    notes: >-
      Official export only. Requires PLANET_API_KEY
      (homeassistant/secrets.yaml -> planet_api_key); refuses to run without it.
