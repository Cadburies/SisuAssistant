# Sisu Nav dated tile harvest — provider registry (issue #80).
#
# Drives the "Charts -> Download" dropdown in web/src/plugins/harvest and the
# server-side harvester in api/harvest/. USB drop-in tiles stay in
# tiles/manual/ (#76), not here.
#
# Mapbox/Google/Bing/Apple ARE allowed here (unlike most self-hosted marine
# nav projects) — Sisu Assist is personal, non-commercial, and currently
# private, and the maintainer has knowingly accepted the ToS exposure that
# comes with it: these four providers' terms restrict caching/persisting
# tiles outside their own SDK regardless of commercial status (confirmed
# directly against their docs, not assumed), so treating each as
# `access: secret` behind an official API key is a deliberate, accepted
# risk (API-key revocation, technically a breach of terms), not an
# oversight. Do not silently re-tighten this back to a blanket ban without
# asking — and do not hold this repo's own provider list up as a "here's
# how to violate Google's ToS" example if it ever goes public (public vs.
# private visibility has no bearing on these terms either way; the risk
# accepted here is scoped to this project's own low-volume personal use).
#
# access:
#   free      - no credential needed
#   free-ish  - free but rate/ToS-limited; UI must show the limit before fetch
#   secret    - requires the named secretEnv; harvester refuses to run without it
#
# kind: nautical | satellite | bathymetry  (selects the tiles/<kind>/<id>/ tree)
#   bathymetry (#97) is the depth-relief floor. Live rows: BlueTopo (#98),
#   GEBCO (#99), Seascape DEM+contours (#100).
# harvester: matches a module in api/harvest/fetchers/<harvester>.mjs
# harvestable: false means "in the dropdown for information, not a harvest target"

providers:
  openseamap:
    label: OpenSeaMap
    kind: nautical
    access: free
    harvestable: false
    notes: >-
      Nautical marks (buoys/lights/day-marks) overlay, t1.openseamap.org.
      Despite an earlier version of this note, it is NOT actually wired up
      as a live layer anywhere in web/src/plugins/map/ — confirmed absent
      by grep as of #124's investigation. Listed here for informational/
      dropdown purposes only until someone actually builds it. Not a
      dated-harvest target (no harvester wired) — tiles/manual/ is the
      drop-in path for anything offline.

  eox-s2cloudless:
    label: EOX Sentinel-2 cloudless
    kind: satellite
    access: free
    harvestable: true
    default: true
    harvester: eox
    template: "https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2020_3857/default/g/{z}/{y}/{x}.jpg"
    format: jpg
    minZoom: 0
    maxZoom: 14
    attribution: "Sentinel-2 cloudless by EOX IT Services GmbH (CC BY-NC-SA 4.0) — contains modified Copernicus Sentinel data 2020"
    sourceUrl: "https://s2maps.eu/"
    # Product identity is the layer year, not the day we downloaded (#83).
    updateCadence: annual
    sourceDate:
      kind: layer
      layerId: s2cloudless-2020
    notes: >-
      Annual composite. This is the default satellite base layer — do not
      re-harvest weekly, it does not change that often.

  nasa-gibs:
    label: NASA GIBS (MODIS/VIIRS)
    kind: satellite
    access: free
    harvestable: true
    harvester: gibs
    layer: MODIS_Terra_CorrectedReflectance_TrueColor
    template: "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/{layer}/default/{time}/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpeg"
    format: jpeg
    minZoom: 0
    maxZoom: 9
    attribution: "NASA EOSDIS GIBS — MODIS Terra Corrected Reflectance (True Color)"
    sourceUrl: "https://worldview.earthdata.nasa.gov/"
    updateCadence: daily
    sourceDate:
      kind: gibs-time
    notes: >-
      Near-daily. Harvest when this week's cloud cover / sun glare actually
      matters — pass an ISO date (job.time) to pin a day, otherwise yesterday
      UTC is used as the product day (GIBS "default" is resolved to a real date
      so skip/fill can compare sourceDate).

  noaa-enc:
    label: NOAA ENC → MBTiles
    kind: nautical
    access: free
    harvestable: true
    harvester: noaa-enc
    notes: >-
      USVI ok. BVI coverage check required before trusting this as a
      plotter — NOAA ENC does not reliably chart BVI waters. This harvester
      only checks/reports coverage today; full S-57-to-MBTiles conversion
      needs GDAL and is not implemented (see fetchers/noaa-enc.mjs — no
      gdal-async dependency has been added to sisu-nav-api, matching the
      #78 constraint against adding GDAL to this container).
    sourceUrl: "https://www.charts.noaa.gov/InteractiveCatalog/nrnc.shtml"

  esri-world-imagery:
    label: Esri World Imagery export
    kind: satellite
    access: free-ish
    harvestable: true
    harvester: esri
    template: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
    format: jpg
    minZoom: 0
    maxZoom: 19
    attribution: "Esri, Maxar, Earthstar Geographics, and the GIS community"
    sourceUrl: "https://www.arcgis.com/home/item.html?id=10df2279f9684e4a9f6a7f08febac2a9"
    exportLimitTiles: 4000
    updateCadence: 30d
    sourceDate:
      kind: http-head
    notes: >-
      Public tile endpoint, not an official bulk-export licence. Enforces a
      conservative per-job tile-count ceiling (exportLimitTiles) — the UI
      must show the estimate and refuse to start over the limit rather than
      silently exceeding it. Narrow the bbox/zoom range instead. Source date
      is Last-Modified/ETag of a sample tile, else a 30-day cadence bucket.

  maptiler-satellite:
    label: MapTiler Satellite (offline SKU)
    kind: satellite
    access: secret
    harvestable: true
    harvester: maptiler
    secretEnv: MAPTILER_API_KEY
    notes: >-
      Official offline MBTiles SKU (download, not a tile scrape). Requires
      MAPTILER_API_KEY (homeassistant/secrets.yaml -> maptiler_api_key);
      refuses to run without it.

  maxar:
    label: Maxar
    kind: satellite
    access: secret
    harvestable: true
    harvester: maxar
    secretEnv: MAXAR_API_KEY
    notes: >-
      Official export only. Requires MAXAR_API_KEY
      (homeassistant/secrets.yaml -> maxar_api_key); refuses to run without it.

  planet:
    label: Planet
    kind: satellite
    access: secret
    harvestable: true
    harvester: planet
    secretEnv: PLANET_API_KEY
    notes: >-
      Official export only. Requires PLANET_API_KEY
      (homeassistant/secrets.yaml -> planet_api_key); refuses to run without it.

  mapbox-satellite:
    label: Mapbox Satellite
    kind: satellite
    access: secret
    harvestable: true
    harvester: mapbox
    secretEnv: MAPBOX_ACCESS_TOKEN
    template: "https://api.mapbox.com/v4/mapbox.satellite/{z}/{x}/{y}.jpg90?access_token={token}"
    format: jpg
    minZoom: 0
    maxZoom: 19
    attribution: "© Mapbox © Maxar"
    sourceUrl: "https://docs.mapbox.com/data/tilesets/reference/mapbox-satellite/"
    updateCadence: 30d
    sourceDate:
      kind: http-head
    notes: >-
      Raw Raster Tiles API (v4), not Mapbox's own offline-region SDK
      mechanism — this is the accepted-risk exception documented at the top
      of this file (personal, non-commercial, currently-private project;
      Mapbox is the least ToS-restrictive of the four providers allowed
      there, but still not an official offline-download product). Requires
      MAPBOX_ACCESS_TOKEN (homeassistant/secrets.yaml -> mapbox_access_token)
      — a normal public token (pk....) from
      https://account.mapbox.com/access-tokens/ works, including the
      account's default token; refuses to run without it. Source date is
      Last-Modified/ETag of a sample tile, else a 30-day bucket.

  bluetopo-bathymetry:
    label: NOAA BlueTopo (relief)
    kind: bathymetry
    access: free
    harvestable: true
    harvester: wmts
    layer: bluetopo:bathymetry
    style: nbs_elevation
    template: "https://nowcoast.noaa.gov/geoserver/gwc/service/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER={layer}&STYLE={style}&TILEMATRIXSET=EPSG:3857&TILEMATRIX=EPSG:3857:{z}&TILEROW={y}&TILECOL={x}&FORMAT=image/png8"
    format: png
    tileSize: 512
    minZoom: 6
    maxZoom: 14
    exportLimitTiles: 1000
    updateCadence: 30d
    sourceDate:
      kind: http-head
    coverageBbox: [-138, 17, -54, 59.6]
    outOfCoverageReason: no BlueTopo in this view
    attribution: NOAA OCS BlueTopo (CC0) — not for navigation
    sourceUrl: https://nauticalcharts.noaa.gov/data/bluetopo.html
    notes: >-
      US waters including USVI. BVI coverage is partial — not a BVI plotter.
      Empty open-ocean tiles are not stored. 512px WMTS. Depth relief overlay,
      not a chart.

  bluetopo-hillshade:
    label: NOAA BlueTopo (hillshade)
    kind: bathymetry
    access: free
    harvestable: true
    harvester: wmts
    layer: bluetopo:hillshade
    style: nbs_hillshade
    template: "https://nowcoast.noaa.gov/geoserver/gwc/service/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER={layer}&STYLE={style}&TILEMATRIXSET=EPSG:3857&TILEMATRIX=EPSG:3857:{z}&TILEROW={y}&TILECOL={x}&FORMAT=image/png8"
    format: png
    tileSize: 512
    minZoom: 6
    maxZoom: 14
    exportLimitTiles: 1000
    updateCadence: 30d
    sourceDate:
      kind: http-head
    coverageBbox: [-138, 17, -54, 59.6]
    outOfCoverageReason: no BlueTopo in this view
    attribution: NOAA OCS BlueTopo (CC0) — not for navigation
    sourceUrl: https://nauticalcharts.noaa.gov/data/bluetopo.html
    notes: >-
      Companion hillshade to BlueTopo relief. Same US-waters coverage and
      512px WMTS. Combine with relief in Layers; not for navigation.

  gebco-colour:
    label: GEBCO colour elevation
    kind: bathymetry
    access: free-ish
    harvestable: true
    harvester: wms
    wms: "https://wms.gebco.net/mapserv?"
    layer: GEBCO_LATEST_2
    format: png
    tileSize: 256
    minZoom: 0
    maxZoom: 8
    exportLimitTiles: 400
    updateCadence: annual
    sourceDate:
      kind: layer
      layerId: GEBCO_LATEST_2
    attribution: GEBCO Compilation Group (GEBCO_2026 Grid) — not for navigation
    sourceUrl: https://www.gebco.net/data-products/gebco-web-services/web-map-service
    notes: >-
      Global 15-arc-second colour-shaded elevation. Fallback where BlueTopo
      has no data (BVI, open ocean). Harvesting past z8 is wasted
      interpolation. Shared public WMS — keep jobs small. Not for navigation.

  seascape-dem:
    label: Seascape DEM (Terrarium)
    kind: bathymetry
    access: free-ish
    harvestable: true
    default: true
    harvester: template
    template: "https://tiles.openwaters.io/seascape/{z}/{x}/{y}.webp"
    format: webp
    tileSize: 512
    encoding: terrarium
    minZoom: 0
    maxZoom: 14
    exportLimitTiles: 1500
    updateCadence: 30d
    sourceDate:
      kind: http-head
    attribution: "© Open Waters (CC BY 4.0) — not for navigation"
    sourceUrl: https://github.com/openwatersio/seascape
    notes: >-
      Global Terrarium raster-DEM (hillshade in the client). Default for BVI
      and anywhere BlueTopo does not cover. Community CDN — keep jobs to the
      current view. Depth datum is mixed (LAT/MLLW/MSL). Not for navigation.

  seascape-vector:
    label: Seascape contours
    kind: bathymetry
    access: free-ish
    harvestable: true
    harvester: template
    template: "https://tiles.openwaters.io/seascape/{z}/{x}/{y}.pbf"
    format: pbf
    tileSize: 512
    minZoom: 0
    maxZoom: 15
    exportLimitTiles: 1500
    updateCadence: 30d
    sourceDate:
      kind: http-head
    vectorLayers:
      - contours
      - soundings
      - depare
    attribution: "© Open Waters (CC BY 4.0) — not for navigation"
    sourceUrl: https://github.com/openwatersio/seascape
    notes: >-
      Vector depth areas, contours, and soundings. Harvest the same view as
      the DEM. Toggle Depth contours in Layers independently of hillshade.
      Not for navigation.

  emodnet-world:
    label: EMODnet world baselayer
    kind: bathymetry
    access: free
    harvestable: true
    harvester: template
    template: "https://tiles.emodnet-bathymetry.eu/2020/baselayer/web_mercator/{z}/{x}/{y}.png"
    format: png
    tileSize: 256
    minZoom: 0
    maxZoom: 10
    exportLimitTiles: 1500
    updateCadence: annual
    sourceDate:
      kind: layer
      layerId: EBWBL-2020
    attribution: EMODnet Bathymetry / EU (CC BY 4.0) — not for navigation
    sourceUrl: https://tiles.emodnet-bathymetry.eu/
    notes: >-
      Global EMODnet baselayer (Europe DTM ~115 m, GEBCO elsewhere). BVI is
      GEBCO-class, not Caribbean high-res. Not for navigation.

  gmrt:
    label: GMRT (multibeam where surveyed)
    kind: bathymetry
    access: free-ish
    harvestable: true
    harvester: wms
    wms: "https://www.gmrt.org/services/mapserver/wms_merc"
    layer: GMRT
    format: png
    tileSize: 256
    minZoom: 6
    maxZoom: 12
    exportLimitTiles: 400
    autoHarvest: false
    updateCadence: 30d
    sourceDate:
      kind: layer
      layerId: GMRT
    attribution: GMRT / LDEO / NSF — not for navigation
    sourceUrl: https://www.gmrt.org/services/
    notes: >-
      High-res only where curated multibeam exists; GEBCO elsewhere. Research
      WMS — auto-harvest off, 400-tile cap. Not the default BVI basemap. Not
      for navigation.

  esri-ocean:
    label: Esri World Ocean Base
    kind: bathymetry
    access: free-ish
    harvestable: true
    harvester: esri
    template: "https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}"
    format: jpg
    tileSize: 256
    minZoom: 0
    maxZoom: 10
    exportLimitTiles: 4000
    updateCadence: 30d
    sourceDate:
      kind: http-head
    attribution: Esri, GEBCO, NOAA, CHS — not for navigation
    sourceUrl: https://www.arcgis.com/home/item.html?id=1e126e7520f9466c9ca28b8f28b5e500
    notes: >-
      Styled ocean bathymetry raster (not a DEM). Public ArcGIS Online tiles,
      same free-ish rules as World Imagery. Not the global default (Seascape /
      GEBCO win). Not for navigation.
