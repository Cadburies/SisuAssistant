# =============================================================================
# Vessel board (Lovelace default when lovelace.mode: yaml)
# Path: /lovelace/  or  /lovelace/default_view
#
# HA may ALSO show a separate sidebar "Overview" with house icon =
# core Home ("Welcome Sisu", Favorites, Repairs). That is NOT this file.
# Prefer THIS board as default: profile → Browser settings → Dashboard.
# See OPS.md "Two Overview entries".
# Role dashboards: Engine / Alternators / Power / Water / Helm / Weather Anchor / Sources
#
# Section order (2026-08-11): header/weather, sea & sky (depth/temp/wind/
# tides, all as tile cards -- an entities-list card here left a big empty
# gap next to the tile grids either side of it), live status, then ship
# zones at the bottom -- navigation buttons don't need to be first.
# =============================================================================
title: Sisu
views:
  - title: Sisu
    path: default_view
    icon: mdi:sail-boat
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: |
              ## Sisu
              {{ now().strftime('%a %d %b · %H:%M') }}
              · House **{{ states('sensor.sisu_house_bank') }}**
              · {{ states('sensor.sisu_alternators_charge_summary') }}
            grid_options:
              columns: 9
          - type: weather-forecast
            entity: weather.forecast_home
            show_forecast: true
            forecast_type: hourly
            grid_options:
              columns: 3

      # Depth + air/water temp — issue #32
      - type: grid
        title: Sea & sky
        cards:
          - type: tile
            entity: sensor.nmea_depth
            name: Depth
            icon: mdi:waves
          - type: tile
            entity: sensor.sisu_air_temp
            name: Air temp
            icon: mdi:thermometer
          - type: tile
            entity: sensor.sisu_water_temp
            name: Water temp
            icon: mdi:coolant-temperature
          - type: tile
            entity: sensor.nmea_tws
            name: True wind speed
            icon: mdi:windsock
          - type: tile
            entity: sensor.true_wind_speed_max_6h
            name: TWS max (6h)
            icon: mdi:windsock
          - type: tile
            entity: sensor.sisu_tide_station
            name: Nearest tide station
            icon: mdi:map-marker-distance
          - type: tile
            entity: sensor.sisu_tide_next_high
            name: Next high tide
            icon: mdi:wave-arrow-up
          - type: tile
            entity: sensor.sisu_tide_next_low
            name: Next low tide
            icon: mdi:wave-arrow-down

      - type: grid
        title: Sources
        cards:
          - type: tile
            entity: binary_sensor.source_ydwg
            name: YDWG
            color: green
          - type: tile
            entity: binary_sensor.source_datahub
            name: DataHub
            color: green
          - type: tile
            entity: binary_sensor.source_victron
            name: Victron
            color: green
          - type: tile
            entity: binary_sensor.source_spectra
            name: Spectra
            color: green
          - type: tile
            entity: binary_sensor.source_alternators
            name: Alternators
            color: green
          - type: tile
            entity: binary_sensor.source_levels
            name: Levels
            color: green
          - type: tile
            entity: binary_sensor.source_freezer
            name: Freezer
            color: green
          - type: tile
            entity: binary_sensor.source_noaa_tides
            name: NOAA
            color: green
          - type: tile
            entity: sensor.source_wind_active
            name: Wind path
            icon: mdi:windsock
          - type: button
            name: All sources
            icon: mdi:access-point-network
            icon_height: 36px
            tap_action:
              action: navigate
              navigation_path: /lovelace-sources

      - type: grid
        title: Live status
        cards:
          - type: tile
            entity: sensor.sisu_house_bank
            name: House bank
            icon: mdi:car-battery
          - type: tile
            entity: binary_sensor.sisu_charging_active
            name: Charging
            color: green
          - type: tile
            entity: sensor.sisu_alternators_combined_current
            name: Alternator A
          - type: tile
            entity: binary_sensor.sisu_alternatorport_online
            name: Alt Port board
            icon: mdi:chip
          - type: tile
            entity: binary_sensor.sisu_alternatorstarboard_online
            name: Alt Stbd board
            icon: mdi:chip
          - type: tile
            entity: sensor.victron_solar_power
            name: Solar
            icon: mdi:solar-power
          - type: tile
            entity: binary_sensor.sisu_watermaker_running
            name: Watermaker
            icon: mdi:water-pump
            color: cyan
          - type: tile
            entity: sensor.sisu_freshwater_level
            name: Fresh water
            icon: mdi:cup-water
          - type: tile
            entity: sensor.sisu_blackwater_level
            name: Black water
            icon: mdi:toilet
          - type: tile
            entity: sensor.sisu_fuel_level
            name: Fuel
            icon: mdi:gas-station
          - type: tile
            entity: binary_sensor.sisu_genset_running
            name: Genset
            icon: mdi:engine-outline
          - type: tile
            entity: binary_sensor.sisu_anchor_alarm
            name: Anchor
            icon: mdi:anchor
            color: red

      # Aft Camera — SV3C SV-B01-1080P-POE (issue #33 follow-up). Renamed
      # 2026-08-13 from "Dinghy camera" to match physical role. Replaces
      # the LilyGo T-Camera after a confirmed camera-bus hardware fault
      # (see issue #33's history for the diagnosis trail). Forward
      # Camera added same day, IP .34 -- same Off/On/Sentry mode system,
      # see packages/sv3c_forward_camera.yaml.
      #
      # Off/On/Sentry mode (packages/sv3c_aft_camera.yaml has the full
      # spec): Off shows only the mode tile; On adds the live view;
      # Sentry adds motion status + the last snapshot (motion-triggered
      # or periodic) with its timestamp, instead of the live view --
      # deliberately lighter-weight than continuous streaming.
      #
      # Both cameras share one section, side by side via an explicit
      # horizontal-stack (rather than two separate grid sections) so
      # they're guaranteed to sit next to each other regardless of how
      # the sections view's own masonry auto-flow would otherwise pack
      # them relative to Live status/Ship zones' differing heights.
      - type: grid
        title: Cameras
        cards:
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: tile
                    entity: input_select.aft_camera_mode
                    name: Aft Camera Mode
                    icon: mdi:cctv
                    features:
                      - type: select-options
                  - type: conditional
                    conditions:
                      - entity: input_select.aft_camera_mode
                        state: "On"
                    card:
                      type: picture-entity
                      entity: camera.aft_camera_mainstream
                      name: Aft
                      show_state: false
                      camera_view: auto
                  - type: conditional
                    conditions:
                      - entity: input_select.aft_camera_mode
                        state: "Sentry"
                    card:
                      type: tile
                      entity: input_boolean.aft_camera_motion_active
                      name: Aft motion
                      icon: mdi:motion-sensor
                  - type: conditional
                    conditions:
                      - entity: input_select.aft_camera_mode
                        state: "Sentry"
                    card:
                      type: picture-entity
                      entity: camera.aft_camera_latest_snapshot
                      name: Aft last snapshot
                      show_state: false
                      camera_view: auto
                  - type: conditional
                    conditions:
                      - entity: input_select.aft_camera_mode
                        state: "Sentry"
                    card:
                      type: tile
                      entity: sensor.aft_camera_last_snapshot_summary
                      name: Aft last snapshot info
                      icon: mdi:camera-image
              - type: vertical-stack
                cards:
                  - type: tile
                    entity: input_select.forward_camera_mode
                    name: Forward Camera Mode
                    icon: mdi:cctv
                    features:
                      - type: select-options
                  - type: conditional
                    conditions:
                      - entity: input_select.forward_camera_mode
                        state: "On"
                    card:
                      type: picture-entity
                      entity: camera.forward_camera_mainstream
                      name: Forward
                      show_state: false
                      camera_view: auto
                  - type: conditional
                    conditions:
                      - entity: input_select.forward_camera_mode
                        state: "Sentry"
                    card:
                      type: tile
                      entity: input_boolean.forward_camera_motion_active
                      name: Forward motion
                      icon: mdi:motion-sensor
                  - type: conditional
                    conditions:
                      - entity: input_select.forward_camera_mode
                        state: "Sentry"
                    card:
                      type: picture-entity
                      entity: camera.forward_camera_latest_snapshot
                      name: Forward last snapshot
                      show_state: false
                      camera_view: auto
                  - type: conditional
                    conditions:
                      - entity: input_select.forward_camera_mode
                        state: "Sentry"
                    card:
                      type: tile
                      entity: sensor.forward_camera_last_snapshot_summary
                      name: Forward last snapshot info
                      icon: mdi:camera-image

      - type: grid
        title: Ship zones
        cards:
          - type: button
            name: Engine
            icon: mdi:engine
            icon_height: 36px
            show_state: false
            tap_action:
              action: navigate
              navigation_path: /lovelace-engine
          - type: button
            name: Alternators
            icon: mdi:sine-wave
            icon_height: 36px
            tap_action:
              action: navigate
              navigation_path: /lovelace-alternators
          - type: button
            name: Power
            icon: mdi:solar-power
            icon_height: 36px
            tap_action:
              action: navigate
              navigation_path: /lovelace-power
          - type: button
            name: Water
            icon: mdi:water
            icon_height: 36px
            tap_action:
              action: navigate
              navigation_path: /lovelace-water
          - type: button
            name: Helm
            icon: mdi:sail-boat
            icon_height: 36px
            tap_action:
              action: navigate
              navigation_path: /lovelace-helm
          - type: button
            name: Weather Anchor
            icon: mdi:compass-rose
            icon_height: 36px
            tap_action:
              action: navigate
              navigation_path: /lovelace-weather-anchor
          - type: button
            name: Sources
            icon: mdi:access-point-network
            icon_height: 36px
            tap_action:
              action: navigate
              navigation_path: /lovelace-sources
          - type: button
            name: Saloon
            icon: mdi:sofa
            icon_height: 36px
            tap_action:
              action: navigate
              navigation_path: /lovelace-water

  # Dedicated cameras screen (issue #33, added 2026-08-13). Two toggles act
  # as "top row checkboxes" (packages/camera_views.yaml) -- neither one
  # checked shows a hint; exactly one checked shows that camera full
  # screen; both checked shows them split side by side. Independent of
  # each camera's own Off/On/Sentry mode -- this is just about which
  # live view(s) this screen displays, always uses the live stream
  # regardless of mode.
  #
  # panel: true (2026-08-13, owner request: "as much camera as
  # possible") -- a panel view drops Lovelace's normal max-width and
  # card-gutter constraints and renders its single root card edge to
  # edge, full viewport width, instead of confined to a masonry column.
  # Panel mode only renders one card, so everything (toggles + all four
  # conditional layouts) has to live inside one outer vertical-stack --
  # can't use separate top-level cards like the rest of this file does.
  # This is as large as core Lovelace cards get without a custom card
  # (e.g. card-mod for exact-pixel-height CSS), which this project
  # doesn't otherwise use, so not introduced here either.
  - title: Cameras
    path: cameras
    icon: mdi:cctv
    panel: true
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: tile
                entity: input_boolean.camera_view_forward
                name: Forward
                icon: mdi:camera
              - type: tile
                entity: input_boolean.camera_view_aft
                name: Aft
                icon: mdi:camera
          - type: conditional
            conditions:
              - entity: input_boolean.camera_view_aft
                state: "off"
              - entity: input_boolean.camera_view_forward
                state: "off"
            card:
              type: markdown
              content: "Select Forward and/or Aft above to view."
          - type: conditional
            conditions:
              - entity: input_boolean.camera_view_aft
                state: "on"
              - entity: input_boolean.camera_view_forward
                state: "off"
            card:
              type: picture-entity
              entity: camera.forward_camera_mainstream
              name: Forward Camera
              show_state: false
              camera_view: live
          - type: conditional
            conditions:
              - entity: input_boolean.camera_view_forward
                state: "on"
              - entity: input_boolean.camera_view_aft
                state: "off"
            card:
              type: picture-entity
              entity: camera.aft_camera_mainstream
              name: Aft Camera
              show_state: false
              camera_view: live
          - type: conditional
            conditions:
              - entity: input_boolean.camera_view_aft
                state: "on"
              - entity: input_boolean.camera_view_forward
                state: "on"
            card:
              type: horizontal-stack
              cards:
                - type: picture-entity
                  entity: camera.forward_camera_mainstream
                  name: Forward
                  show_state: false
                  camera_view: live
                - type: picture-entity
                  entity: camera.aft_camera_mainstream
                  name: Aft
                  show_state: false
                  camera_view: live
