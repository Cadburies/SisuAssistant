# Lovelace dashboard — dual alternator SIMULATOR (bench-alts-sim)
# Add via: Settings → Dashboards → Add dashboard → paste / use YAML mode
# Or: UI → raw configuration editor
#
# Entity IDs assume device name bench-alts-sim (ESPHome default slug).
# After adopt, verify IDs under Settings → Devices → Bench Alts Sim.

title: Alternators (Sim)
views:
  - title: Port / Starboard
    path: alts-sim
    icon: mdi:engine
    type: sections
    max_columns: 3
    sections:
      - type: grid
        title: Simulator control
        cards:
          - type: entities
            title: Scenario
            entities:
              - entity: select.bench_alts_sim_sim_scenario
                name: Scenario
              - entity: sensor.bench_alts_sim_sim_mode_label
                name: Active mode
              - entity: button.bench_alts_sim_sim_force_rebulk
                name: Force rebulk
              - entity: button.bench_alts_sim_sim_reset_cruise
                name: Reset cruise
              - entity: button.bench_alts_sim_restart_simulator
                name: Restart board
          - type: entities
            title: Hard ceilings (production values)
            entities:
              - entity: sensor.bench_alts_sim_ceiling_house_voltage
                name: HOUSE_V_CEIL
              - entity: sensor.bench_alts_sim_ceiling_alternator_current
                name: ALT_I_CEIL
              - entity: sensor.bench_alts_sim_ceiling_alternator_temperature
                name: ALT_T_CEIL

      - type: grid
        title: Port alternator
        cards:
          - type: gauge
            entity: sensor.bench_alts_sim_alternator_current_port
            name: Current · Port
            min: 0
            max: 250
            severity:
              green: 0
              yellow: 180
              red: 230
          - type: gauge
            entity: sensor.bench_alts_sim_house_voltage_engine_port
            name: House V · Port
            min: 12
            max: 14.5
            severity:
              green: 12.8
              yellow: 14.2
              red: 14.35
          - type: gauge
            entity: sensor.bench_alts_sim_alternator_temperature_port
            name: Temp · Port
            min: 30
            max: 110
            severity:
              green: 30
              yellow: 90
              red: 100
          - type: entities
            entities:
              - entity: switch.bench_alts_sim_alternator_enable_port
                name: Enable
              - entity: sensor.bench_alts_sim_alternator_charge_stage_port
                name: Charge stage
              - entity: sensor.bench_alts_sim_alternator_field_duty_port
                name: Field duty
              - entity: sensor.bench_alts_sim_alternator_status_port
                name: Status
              - entity: binary_sensor.bench_alts_sim_alarm_active_port
                name: Alarm
              - entity: binary_sensor.bench_alts_sim_warning_active_port
                name: Warning
              - entity: number.bench_alts_sim_alternator_current_setpoint_port
                name: Current SP
              - entity: number.bench_alts_sim_house_float_voltage_port
                name: Float V
              - entity: number.bench_alts_sim_house_absorption_voltage_port
                name: Absorption V
              - entity: number.bench_alts_sim_alternator_temperature_setpoint_port
                name: Temp SP

      - type: grid
        title: Starboard alternator
        cards:
          - type: gauge
            entity: sensor.bench_alts_sim_alternator_current_starboard
            name: Current · Starboard
            min: 0
            max: 250
            severity:
              green: 0
              yellow: 180
              red: 230
          - type: gauge
            entity: sensor.bench_alts_sim_house_voltage_engine_starboard
            name: House V · Starboard
            min: 12
            max: 14.5
            severity:
              green: 12.8
              yellow: 14.2
              red: 14.35
          - type: gauge
            entity: sensor.bench_alts_sim_alternator_temperature_starboard
            name: Temp · Starboard
            min: 30
            max: 110
            severity:
              green: 30
              yellow: 90
              red: 100
          - type: entities
            entities:
              - entity: switch.bench_alts_sim_alternator_enable_starboard
                name: Enable
              - entity: sensor.bench_alts_sim_alternator_charge_stage_starboard
                name: Charge stage
              - entity: sensor.bench_alts_sim_alternator_field_duty_starboard
                name: Field duty
              - entity: sensor.bench_alts_sim_alternator_status_starboard
                name: Status
              - entity: binary_sensor.bench_alts_sim_alarm_active_starboard
                name: Alarm
              - entity: binary_sensor.bench_alts_sim_warning_active_starboard
                name: Warning
              - entity: number.bench_alts_sim_alternator_current_setpoint_starboard
                name: Current SP
              - entity: number.bench_alts_sim_house_float_voltage_starboard
                name: Float V
              - entity: number.bench_alts_sim_house_absorption_voltage_starboard
                name: Absorption V
              - entity: number.bench_alts_sim_alternator_temperature_setpoint_starboard
                name: Temp SP

      - type: grid
        title: Trends
        cards:
          - type: history-graph
            hours_to_show: 1
            entities:
              - entity: sensor.bench_alts_sim_alternator_current_port
                name: I Port
              - entity: sensor.bench_alts_sim_alternator_current_starboard
                name: I Stbd
              - entity: sensor.bench_alts_sim_house_voltage_engine_port
                name: V Port
              - entity: sensor.bench_alts_sim_house_voltage_engine_starboard
                name: V Stbd
          - type: history-graph
            hours_to_show: 1
            entities:
              - entity: sensor.bench_alts_sim_alternator_temperature_port
                name: T Port
              - entity: sensor.bench_alts_sim_alternator_temperature_starboard
                name: T Stbd
              - entity: sensor.bench_alts_sim_alternator_field_duty_port
                name: Field Port
              - entity: sensor.bench_alts_sim_alternator_field_duty_starboard
                name: Field Stbd
