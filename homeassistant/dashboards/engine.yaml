# Engine room — alts + genset (future marine board)
# Deep-link for tablet/MFD: /lovelace-engine
title: Engine room
views:
  - title: Engine room
    path: main
    icon: mdi:engine
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              ## Engine room
              Alternators · genset · machinery
          - type: button
            name: Full alternator detail
            icon: mdi:gauge
            tap_action:
              action: navigate
              navigation_path: /lovelace-alternators
          - type: markdown
            content: |
              {% if is_state('binary_sensor.sisu_alternatorport_online', 'on')
                 or is_state('binary_sensor.sisu_alternatorstarboard_online', 'on') %}
              {{ states('sensor.sisu_alternators_charge_summary') }}
              {% else %}
              Both Marine Boards offline — Alternators gauges stay Unavailable
              until `alternatorport`/`alternatorstarboard` are on Sisu-IoT (#11).
              {% endif %}

      - type: grid
        title: Alternators
        cards:
          - type: tile
            entity: binary_sensor.sisu_alternatorport_online
            name: Port board
            icon: mdi:chip
          - type: tile
            entity: binary_sensor.sisu_alternatorstarboard_online
            name: Starboard board
            icon: mdi:chip
          - type: gauge
            entity: sensor.alternatorport_alternator_current_port
            name: Port A
            min: 0
            max: 250
            needle: true
            severity:
              green: 0
              yellow: 180
              red: 230
          - type: gauge
            entity: sensor.alternatorstarboard_alternator_current_starboard
            name: Starboard A
            min: 0
            max: 250
            needle: true
            severity:
              green: 0
              yellow: 180
              red: 230
          - type: gauge
            entity: sensor.alternatorport_house_voltage_engine_port
            name: House V
            min: 12
            max: 14.5
            needle: true
          - type: entities
            entities:
              - entity: sensor.alternatorport_alternator_charge_stage_port
                name: Port stage
              - entity: sensor.alternatorstarboard_alternator_charge_stage_starboard
                name: Stbd stage
              - entity: sensor.alternatorport_alternator_temperature_port
                name: Port temp
              - entity: sensor.alternatorstarboard_alternator_temperature_starboard
                name: Stbd temp
              - entity: binary_sensor.alternatorport_alternator_fault_latched_port
                name: Port fault
              - entity: binary_sensor.alternatorstarboard_alternator_fault_latched_starboard
                name: Stbd fault

      - type: grid
        title: Firmware diagnostics
        cards:
          - type: entities
            title: Port
            show_header_toggle: false
            entities:
              - entity: select.alternatorport_debug_level
                name: Debug level (0 none … 3 info)
              - entity: text_sensor.alternatorport_reset_reason
                name: Reset reason
              - entity: sensor.alternatorport_loop_time
                name: Loop time
          - type: entities
            title: Starboard
            show_header_toggle: false
            entities:
              - entity: select.alternatorstarboard_debug_level
                name: Debug level (0 none … 3 info)
              - entity: text_sensor.alternatorstarboard_reset_reason
                name: Reset reason
              - entity: sensor.alternatorstarboard_loop_time
                name: Loop time

      - type: grid
        title: Port Engine
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.sisu_engine_port_alarm_active
                name: Alarm active
              - entity: sensor.sisu_engine_port_alarms
                name: Alarm detail
              - entity: sensor.sisu_engine_port_rpm
                name: RPM
              - entity: sensor.sisu_engine_port_coolant
                name: Coolant
              - entity: sensor.sisu_engine_port_oil_pressure
                name: Oil pressure
              - entity: sensor.sisu_engine_port_alternator_voltage
                name: Alternator V (engine)
              - entity: sensor.sisu_engine_port_starter_voltage
                name: Starter battery V
              - entity: sensor.sisu_engine_port_load
                name: Load
              - entity: sensor.sisu_engine_port_fuel_rate
                name: Fuel rate
              - entity: sensor.sisu_engine_port_boost
                name: Boost pressure
              - entity: sensor.sisu_engine_port_hours
                name: Engine hours

      - type: grid
        title: Starboard Engine
        cards:
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.sisu_engine_starboard_alarm_active
                name: Alarm active
              - entity: sensor.sisu_engine_starboard_alarms
                name: Alarm detail
              - entity: sensor.sisu_engine_starboard_rpm
                name: RPM
              - entity: sensor.sisu_engine_starboard_coolant
                name: Coolant
              - entity: sensor.sisu_engine_starboard_oil_pressure
                name: Oil pressure
              - entity: sensor.sisu_engine_starboard_alternator_voltage
                name: Alternator V (engine)
              - entity: sensor.sisu_engine_starboard_starter_voltage
                name: Starter battery V
              - entity: sensor.sisu_engine_starboard_load
                name: Load
              - entity: sensor.sisu_engine_starboard_fuel_rate
                name: Fuel rate
              - entity: sensor.sisu_engine_starboard_boost
                name: Boost pressure
              - entity: sensor.sisu_engine_starboard_hours
                name: Engine hours

      - type: grid
        title: House Bank (BMS)
        cards:
          - type: gauge
            entity: sensor.victron_battery_soc
            name: SoC
            min: 0
            max: 100
            needle: true
            severity:
              red: 0
              yellow: 20
              green: 50
          - type: entities
            show_header_toggle: false
            entities:
              - entity: binary_sensor.victron_bms_alarm
                name: Alarm active
              - entity: sensor.victron_bms_alarm_detail
                name: Alarm detail
              - entity: sensor.victron_battery_voltage
                name: Voltage
              - entity: sensor.victron_battery_current
                name: Current (+ = charging)
              - entity: sensor.victron_battery_power
                name: Power
              - entity: sensor.victron_bms_state
                name: BMS state
              - entity: sensor.victron_battery_time_to_go
                name: Time to go
              - entity: sensor.victron_battery_consumed_ah
                name: Consumed Ah
              - entity: sensor.victron_solar_power
                name: Solar power
              - entity: sensor.victron_solar_state
                name: Solar MPPT state
              - entity: sensor.victron_inverter_power
                name: Inverter power
              - entity: sensor.victron_grid_power
                name: Shore power
              - entity: sensor.victron_ac_loads
                name: AC loads
              - entity: sensor.victron_dc_loads
                name: DC loads

      - type: grid
        title: Genset (marine board — future)
        cards:
          - type: entities
            entities:
              - entity: binary_sensor.sisu_genset_running
                name: Running
              - entity: sensor.sisu_genset_status
                name: Status
              - entity: sensor.sisu_genset_oil_pressure
                name: Oil pressure
              - entity: sensor.sisu_genset_coolant_temp
                name: Coolant
              - entity: sensor.sisu_genset_hours
                name: Hours
              - entity: switch.sisu_genset_start
                name: Start
              - entity: switch.sisu_genset_stop
                name: Stop
              - entity: switch.sisu_genset_preheat
                name: Preheat
