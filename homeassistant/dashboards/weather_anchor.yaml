# Weather TWD — at-anchor true-wind watch (mirrors Grafana WeatherTWD)
# Deep-link: /lovelace-weather-anchor (unchanged — cosmetic title rename only, no bookmark break)
# Roses stay in Grafana (ECharts); this board is native HA for the tablet/phone.
title: Weather TWD
views:
  - title: Weather TWD
    path: main
    icon: mdi:compass-rose
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: |
              ## Weather TWD
              True wind at anchor · TWD is compass-north (MWD), not AWA-at-the-bow.
              Roses: [Grafana WeatherTWD](http://192.168.0.151:3001/d/sisu-weather-twd)
              (interim Mac stack; F8 will be `192.168.0.21:3001`).
            grid_options:
              columns: 8
          - type: weather-forecast
            entity: weather.forecast_home
            show_forecast: true
            forecast_type: hourly
            grid_options:
              columns: 4

      - type: grid
        title: Right now
        cards:
          - type: tile
            entity: sensor.nmea_aws
            name: Apparent wind speed
            icon: mdi:windsock
          - type: tile
            entity: sensor.nmea_tws
            name: True wind speed
            icon: mdi:windsock
          - type: tile
            entity: sensor.true_wind_speed_max_6h
            name: TWS max (6h)
            icon: mdi:weather-windy
          - type: tile
            entity: sensor.nmea_twd
            name: True wind direction
            icon: mdi:compass-rose
          # North-up compass. picture-elements is the *outer* card so the
          # ring SVG is not rebuilt on every 1 Hz TWD tick (wrapping the
          # whole card in config-template-card remounts it and reflows
          # every section below). Only the needle element is templated.
          - type: picture-elements
            image: /local/twd_compass.svg?v=3
            grid_options:
              columns: 6
              rows: 6
            elements:
              - type: custom:config-template-card
                entities:
                  - sensor.nmea_twd
                variables:
                  deg: "(() => { const n = parseFloat(states['sensor.nmea_twd'] && states['sensor.nmea_twd'].state); return Number.isFinite(n) ? ((n % 360) + 360) % 360 : 0; })()"
                style:
                  top: 50%
                  left: 50%
                  width: 100%
                  height: 100%
                  background: none
                  border: none
                  transform: "${'translate(-50%, -50%) rotate(' + vars.deg + 'deg)'}"
                element:
                  type: image
                  image: /local/twd_needle.svg
                  style:
                    top: 50%
                    left: 50%
                    width: 100%
                    transform: translate(-50%, -50%)
              - type: state-label
                entity: sensor.nmea_twd
                prefix: "FROM "
                style:
                  top: 61%
                  left: 50%
                  transform: translate(-50%, -50%)
                  font-size: 13px
                  font-weight: 600
                  color: "#1565c0"
                  pointer-events: none

      - type: grid
        title: Last 5 minutes
        cards:
          # Same canonical sensors as the tiles (no _live twin).
          - type: history-graph
            hours_to_show: 0.1
            entities:
              - entity: sensor.nmea_aws
                name: AWS
              - entity: sensor.nmea_tws
                name: TWS
          - type: history-graph
            hours_to_show: 0.1
            entities:
              - entity: sensor.nmea_twd
                name: TWD

      - type: grid
        title: Last hour
        cards:
          - type: history-graph
            hours_to_show: 1
            entities:
              - entity: sensor.nmea_aws
                name: AWS
              - entity: sensor.nmea_tws
                name: TWS
          - type: history-graph
            hours_to_show: 1
            entities:
              - entity: sensor.nmea_twd
                name: TWD

      - type: grid
        title: Last 24 hours
        cards:
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.nmea_aws
                name: AWS
              - entity: sensor.nmea_tws
                name: TWS
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.nmea_twd
                name: TWD

      - type: grid
        title: Last 7 days
        cards:
          - type: history-graph
            hours_to_show: 168
            entities:
              - entity: sensor.nmea_aws
                name: AWS
              - entity: sensor.nmea_tws
                name: TWS
          - type: history-graph
            hours_to_show: 168
            entities:
              - entity: sensor.nmea_twd
                name: TWD

      - type: grid
        title: Atmosphere
        cards:
          - type: tile
            entity: sensor.sisu_air_temp
            name: Air temp
            icon: mdi:thermometer
          - type: tile
            entity: sensor.sisu_water_temp
            name: Water temp
            icon: mdi:coolant-temperature
          - type: tile
            entity: sensor.sisu_barometric_pressure
            name: Pressure
            icon: mdi:gauge
          - type: tile
            entity: sensor.sisu_humidity
            name: Humidity
            icon: mdi:water-percent
          - type: history-graph
            hours_to_show: 3
            entities:
              - entity: sensor.sisu_barometric_pressure
                name: Pressure (3h)
