# Helm — anchor, nav-related HA, links to N2K MFDs / Signal K
# Deep-link: /lovelace-helm  (tablet or future MFD browser pane)
title: Helm
views:
  - title: Helm
    path: main
    icon: mdi:sail-boat
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              ## Helm
              Anchor · alarms · NMEA from **YDWG** (primary) / **DataHub** (failover).
              Veratron OL43 / chartplotter stay on **N2K** for primary nav.
              HA here is for automation & status, not a full ECDIS replacement.
          - type: tile
            entity: sensor.source_wind_active
            name: NMEA source
            icon: mdi:lan-connect
          - type: tile
            entity: binary_sensor.source_ydwg
            name: YDWG
            color: green
          - type: tile
            entity: binary_sensor.source_datahub
            name: DataHub
            color: green
          - type: tile
            entity: binary_sensor.sisu_anchor_alarm
            name: Anchor alarm
            icon: mdi:anchor
            color: red
          - type: tile
            entity: binary_sensor.sisu_anchor_gps_lost
            name: Anchor GPS lost
            icon: mdi:crosshairs-gps
            color: red
          - type: tile
            entity: sensor.sisu_anchor_distance
            name: Distance from drop
            icon: mdi:map-marker-distance
          - type: tile
            entity: sensor.alternatorport_house_voltage_engine_port
            name: House V
          - type: tile
            entity: binary_sensor.sisu_charging_active
            name: Charging

      - type: grid
        title: NMEA instruments (YDWG → DataHub)
        cards:
          - type: entities
            entities:
              - entity: sensor.source_wind_active
                name: Active gateway
              - entity: sensor.nmea_sog
                name: SOG
              - entity: sensor.nmea_cog
                name: COG
              - entity: sensor.nmea_depth
                name: Depth
              - entity: sensor.nmea_aws
                name: AWS
              - entity: sensor.nmea_awa
                name: AWA
              - entity: sensor.nmea_heading_magnetic
                name: Heading (mag)
              - entity: sensor.nmea_latitude
                name: Latitude
              - entity: sensor.nmea_longitude
                name: Longitude
              - entity: binary_sensor.nmea_gateway_has_fix
                name: GPS fix

      - type: grid
        title: Anchor
        cards:
          - type: entities
            entities:
              - entity: binary_sensor.sisu_anchor_alarm
                name: Alarm active
              - entity: binary_sensor.sisu_anchor_gps_lost
                name: GPS lost while armed
              - entity: sensor.sisu_anchor_distance
                name: Distance (m)
              - entity: sensor.sisu_anchor_bearing
                name: Bearing
              - entity: number.sisu_anchor_radius
                name: Alarm radius (m)
              - entity: sensor.sisu_anchor_suggested_radius
                name: Suggested radius (Dx5, m)
              - entity: button.sisu_anchor_apply_suggested_radius
                name: Apply suggested radius
              - entity: number.sisu_anchor_breach_delay
                name: Breach delay (s)
              - entity: switch.sisu_anchor_alarm_enable
                name: Enable alarm
              - entity: button.sisu_anchor_set_here
                name: Set drop here
          # Native map-card GPS-accuracy circle on the drop tracker doubles
          # as the swing-radius visual (#72) -- only rendered once a drop is
          # set (device_tracker.sisu_anchor_drop's availability gates on
          # input_boolean.sisu_anchor_drop_set).
          - type: map
            entities:
              - entity: device_tracker.sisu_boat_position
              - entity: device_tracker.sisu_anchor_drop
            default_zoom: 16

      - type: grid
        title: Links
        cards:
          - type: markdown
            content: |
              ### Onboard systems
              - **Signal K / KIP:** `http://192.168.0.21:3000` (when F8 stack is up)
              - **Alternators:** [open](/lovelace-alternators)
              - **Power:** [open](/lovelace-power)
              - **Water:** [open](/lovelace-water)
              - **Weather TWD:** [open](/lovelace-weather-anchor)
              - **Engine room:** [open](/lovelace-engine)
