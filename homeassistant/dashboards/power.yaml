# Power — Victron-style electrical (3× MPPT + bank + alts)
title: Power
views:
  - title: System
    path: system
    icon: mdi:solar-power
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              ## Electrical
              Victron-style overview · house bank · solar · alternators
              House **{{ states('sensor.sisu_house_bank') }}**
              · Alts **{{ states('sensor.sisu_alternators_combined_current') | float(0) | round(1) }} A**
          - type: gauge
            entity: sensor.victron_battery_soc
            name: Battery SoC
            min: 0
            max: 100
            needle: true
            severity:
              green: 50
              yellow: 30
              red: 0
          - type: gauge
            entity: sensor.victron_battery_voltage
            name: Battery voltage
            min: 11.5
            max: 14.6
            needle: true
          - type: gauge
            entity: sensor.victron_battery_current
            name: Battery current
            min: -200
            max: 200
            needle: true

      - type: grid
        title: Solar (3× MPPT)
        cards:
          - type: entities
            entities:
              - entity: sensor.victron_solar_roof_fwd_power
                name: Roof fwd
              - entity: sensor.victron_solar_roof_mid_power
                name: Roof mid
              - entity: sensor.victron_solar_aft_power
                name: Aft
              - entity: sensor.victron_solar_power
                name: Total PV
              - entity: sensor.victron_solar_yield_today
                name: Yield today
              - entity: sensor.victron_solar_state
                name: MPPT state

      - type: grid
        title: Alternators & loads
        cards:
          - type: entities
            title: Alternators
            entities:
              - entity: sensor.sisu_alternators_combined_power
                name: Combined power
              - entity: sensor.sisu_alternators_combined_current
                name: Combined current
              - entity: sensor.sisu_alternators_charge_summary
                name: Summary
          - type: entities
            title: AC / DC (Victron / N2K)
            entities:
              - entity: sensor.victron_grid_power
                name: Shore
              - entity: sensor.victron_inverter_power
                name: Inverter
              - entity: sensor.victron_ac_loads
                name: AC loads
              - entity: sensor.victron_dc_loads
                name: DC loads
          - type: entities
            title: BMS
            entities:
              - entity: sensor.victron_bms_state
                name: State
              - entity: binary_sensor.victron_bms_alarm
                name: Alarm
              - entity: sensor.victron_bms_alarm_detail
                name: Alarm Detail
              - entity: sensor.victron_cell_min_voltage
                name: Cell min
              - entity: sensor.victron_cell_max_voltage
                name: Cell max

  - title: Flows
    path: flows
    icon: mdi:transmission-tower
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              ### Power flow
              ```
                 [3× Solar MPPT]     [Port/Stbd Alts]     [Shore]
                        \                  |                /
                         \                 |               /
                          v                v              v
                           [ House battery + BMS / Lynx ]
                              /         |          \
                             v          v           v
                       [DC loads]  [Inverter]  [Watermaker]
              ```
              Built-in HA **Energy** menu: Settings → Energy, add kWh sensors
              (`sensor.victron_energy_*`) when the gateway provides daily totals.
          - type: history-graph
            hours_to_show: 24
            entities:
              - entity: sensor.alternatorport_house_voltage_engine_port
                name: House V
              - entity: sensor.sisu_alternators_combined_current
                name: Alt I
