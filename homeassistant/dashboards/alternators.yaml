# Alternators — gauges with 3-layer limits + setpoint under each reading
#
# Authoritative numbers: homeassistant/docs/ALTERNATOR_LIMITS.md
# Vessel Overview/History: production ESPHome boards (alternatorport / starboard).
#
# Layers (high side):
#   green  → below user setpoint
#   orange → from user setpoint (live number entity)
#   red    → from hard ceiling → scale max
#
# Current : SP default 150 A · hard 250 A · scale 320 A (rated)
# House V : abs SP 14.3 V · hard 14.4 V · scale 14.7 V  (min 10 V)
# Temp    : SP default 95 °C · hard 125 °C · scale 150 °C
#
# Orange tracks live setpoints via config-template-card.
title: Alternators
views:
  - title: Overview
    path: overview
    icon: mdi:engine
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: |
              ## Dual alternators
              {% set port = is_state('binary_sensor.sisu_alternatorport_online', 'on') %}
              {% set stbd = is_state('binary_sensor.sisu_alternatorstarboard_online', 'on') %}
              {% if not port and not stbd %}
              **Both Marine Boards offline** — values stay unavailable until
              `alternatorport` (.41) and `alternatorstarboard` (.42) are on Sisu-IoT.
              Lab sim is on the **Lab** tab only.
              {% else %}
              Combined **{{ states('sensor.sisu_alternators_combined_current') | float(0) | round(1) }} A**
              · **{{ states('sensor.sisu_alternators_combined_power') | float(0) | round(0) }} W**
              · ΔV **{{ states('sensor.sisu_house_voltage_delta_port_stbd') | float(0) | round(3) }} V**
              {% if is_state('binary_sensor.sisu_charging_active', 'on') %}· ⚡ Charging{% else %}· ⏸ Idle{% endif %}
              · {{ states('sensor.sisu_alternators_charge_summary') }}
              {% endif %}
            grid_options:
              columns: full
          - type: tile
            entity: binary_sensor.sisu_alternatorport_online
            name: Port board
            icon: mdi:chip
          - type: tile
            entity: binary_sensor.sisu_alternatorstarboard_online
            name: Starboard board
            icon: mdi:chip
          - type: tile
            entity: sensor.alternatorport_house_voltage_engine_port
            name: House V · Port
            icon: mdi:flash
          - type: tile
            entity: sensor.alternatorstarboard_house_voltage_engine_starboard
            name: House V · Stbd
            icon: mdi:flash-outline
          - type: tile
            entity: binary_sensor.sisu_charging_active
            name: Charging
            color: green
          - type: markdown
            content: |
              **Bands:** green &lt; **setpoint (orange)** &lt; **hard (red)** &lt; **scale max**.
              Current hard **250 A** / scale **320 A** · V hard **14.4** / scale **14.7** · T hard **125 °C** / scale **150 °C**.
              Change the number under a gauge — orange moves with it. Full policy: `docs/ALTERNATOR_LIMITS.md`.
            grid_options:
              columns: full

      # ─── BMS / PACK CONTEXT (issue #18) ────────────────────────────────
      - type: grid
        title: BMS / Pack (Victron — remains charge authority)
        column_span: 2
        cards:
          - type: tile
            entity: sensor.victron_bms_state
            name: BMS State
            icon: mdi:chip
          - type: tile
            entity: sensor.victron_battery_soc
            name: Battery SoC
            icon: mdi:battery
          - type: tile
            entity: binary_sensor.victron_bms_alarm
            name: BMS Alarm
            icon: mdi:alert-circle
          - type: tile
            entity: sensor.victron_bms_alarm_detail
            name: Alarm Detail
            icon: mdi:alert-circle-outline

      # ─── PORT ───────────────────────────────────────────────────────────
      - type: grid
        title: Port
        cards:
          - type: custom:config-template-card
            entities:
              - number.alternatorport_alternator_current_setpoint_port
              - sensor.alternatorport_alternator_current_port
            variables:
              sp: "Math.min(250, Math.max(0, parseFloat(states['number.alternatorport_alternator_current_setpoint_port'].state) || 150))"
            card:
              type: gauge
              entity: sensor.alternatorport_alternator_current_port
              name: "Current · Port  (hard 250 A · max 320 A)"
              min: 0
              max: 320
              needle: true
              severity:
                green: 0
                yellow: "${vars.sp}"
                red: 250
          - type: entities
            show_header_toggle: false
            entities:
              - entity: number.alternatorport_alternator_current_setpoint_port
                name: Current setpoint (orange · default 150 A)

          - type: custom:config-template-card
            entities:
              - number.alternatorport_house_absorption_voltage_port
              - sensor.alternatorport_house_voltage_engine_port
            variables:
              sp: "Math.min(14.4, Math.max(12, parseFloat(states['number.alternatorport_house_absorption_voltage_port'].state) || 14.3))"
            card:
              type: gauge
              entity: sensor.alternatorport_house_voltage_engine_port
              name: "House V · Port  (hard 14.4 V · max 14.7 V)"
              min: 10
              max: 14.7
              needle: true
              severity:
                green: 12.0
                yellow: "${vars.sp}"
                red: 14.4
          - type: entities
            show_header_toggle: false
            entities:
              - entity: number.alternatorport_house_absorption_voltage_port
                name: Absorption V (orange · default 14.3)
              - entity: number.alternatorport_house_float_voltage_port
                name: Float V (default 14.1)
          - type: custom:config-template-card
            entities:
              - sensor.alternatorport_house_voltage_engine_port
            variables:
              v: "parseFloat(states['sensor.alternatorport_house_voltage_engine_port'].state)"
              sev: "isNaN(vars.v) ? 'grey' : (vars.v <= 11.0 ? 'red' : (vars.v <= 12.0 ? 'orange' : 'green'))"
            card:
              type: tile
              entity: sensor.alternatorport_house_voltage_engine_port
              name: "House V low band · Port"
              icon: mdi:battery-alert
              color: "${vars.sev}"

          - type: custom:config-template-card
            entities:
              - number.alternatorport_alternator_temperature_setpoint_port
              - sensor.alternatorport_alternator_temperature_port
            variables:
              sp: "Math.min(125, Math.max(20, parseFloat(states['number.alternatorport_alternator_temperature_setpoint_port'].state) || 95))"
            card:
              type: gauge
              entity: sensor.alternatorport_alternator_temperature_port
              name: "Temp · Port  (hard 125 °C · max 150 °C)"
              min: 20
              max: 150
              needle: true
              severity:
                green: 20
                yellow: "${vars.sp}"
                red: 125
          - type: entities
            show_header_toggle: false
            entities:
              - entity: number.alternatorport_alternator_temperature_setpoint_port
                name: Temp setpoint (orange · default 95 °C)

          - type: entities
            title: Port detail
            show_header_toggle: false
            entities:
              - entity: binary_sensor.alternatorport_alternator_enable_port
                name: Enable (ENBL)
              - entity: sensor.alternatorport_alternator_charge_stage_port
                name: Stage
              - entity: sensor.alternatorport_alternator_field_duty_port
                name: Field duty
              - entity: sensor.alternatorport_alternator_power_port
                name: Power
              - entity: sensor.alternatorport_alternator_status_port
                name: Status
              - entity: binary_sensor.alternatorport_alternator_fault_latched_port
                name: Fault latched
              - entity: sensor.alternatorport_alternator_temp_limit_active_port
                name: Temp limit

      # ─── STARBOARD ─────────────────────────────────────────────────────
      - type: grid
        title: Starboard
        cards:
          - type: custom:config-template-card
            entities:
              - number.alternatorstarboard_alternator_current_setpoint_starboard
              - sensor.alternatorstarboard_alternator_current_starboard
            variables:
              sp: "Math.min(250, Math.max(0, parseFloat(states['number.alternatorstarboard_alternator_current_setpoint_starboard'].state) || 150))"
            card:
              type: gauge
              entity: sensor.alternatorstarboard_alternator_current_starboard
              name: "Current · Stbd  (hard 250 A · max 320 A)"
              min: 0
              max: 320
              needle: true
              severity:
                green: 0
                yellow: "${vars.sp}"
                red: 250
          - type: entities
            show_header_toggle: false
            entities:
              - entity: number.alternatorstarboard_alternator_current_setpoint_starboard
                name: Current setpoint (orange · default 150 A)

          - type: custom:config-template-card
            entities:
              - number.alternatorstarboard_house_absorption_voltage_starboard
              - sensor.alternatorstarboard_house_voltage_engine_starboard
            variables:
              sp: "Math.min(14.4, Math.max(12, parseFloat(states['number.alternatorstarboard_house_absorption_voltage_starboard'].state) || 14.3))"
            card:
              type: gauge
              entity: sensor.alternatorstarboard_house_voltage_engine_starboard
              name: "House V · Stbd  (hard 14.4 V · max 14.7 V)"
              min: 10
              max: 14.7
              needle: true
              severity:
                green: 12.0
                yellow: "${vars.sp}"
                red: 14.4
          - type: entities
            show_header_toggle: false
            entities:
              - entity: number.alternatorstarboard_house_absorption_voltage_starboard
                name: Absorption V (orange · default 14.3)
              - entity: number.alternatorstarboard_house_float_voltage_starboard
                name: Float V (default 14.1)
          - type: custom:config-template-card
            entities:
              - sensor.alternatorstarboard_house_voltage_engine_starboard
            variables:
              v: "parseFloat(states['sensor.alternatorstarboard_house_voltage_engine_starboard'].state)"
              sev: "isNaN(vars.v) ? 'grey' : (vars.v <= 11.0 ? 'red' : (vars.v <= 12.0 ? 'orange' : 'green'))"
            card:
              type: tile
              entity: sensor.alternatorstarboard_house_voltage_engine_starboard
              name: "House V low band · Starboard"
              icon: mdi:battery-alert
              color: "${vars.sev}"

          - type: custom:config-template-card
            entities:
              - number.alternatorstarboard_alternator_temperature_setpoint_starboard
              - sensor.alternatorstarboard_alternator_temperature_starboard
            variables:
              sp: "Math.min(125, Math.max(20, parseFloat(states['number.alternatorstarboard_alternator_temperature_setpoint_starboard'].state) || 95))"
            card:
              type: gauge
              entity: sensor.alternatorstarboard_alternator_temperature_starboard
              name: "Temp · Stbd  (hard 125 °C · max 150 °C)"
              min: 20
              max: 150
              needle: true
              severity:
                green: 20
                yellow: "${vars.sp}"
                red: 125
          - type: entities
            show_header_toggle: false
            entities:
              - entity: number.alternatorstarboard_alternator_temperature_setpoint_starboard
                name: Temp setpoint (orange · default 95 °C)

          - type: entities
            title: Starboard detail
            show_header_toggle: false
            entities:
              - entity: binary_sensor.alternatorstarboard_alternator_enable_starboard
                name: Enable (ENBL)
              - entity: sensor.alternatorstarboard_alternator_charge_stage_starboard
                name: Stage
              - entity: sensor.alternatorstarboard_alternator_field_duty_starboard
                name: Field duty
              - entity: sensor.alternatorstarboard_alternator_power_starboard
                name: Power
              - entity: sensor.alternatorstarboard_alternator_status_starboard
                name: Status
              - entity: binary_sensor.alternatorstarboard_alternator_fault_latched_starboard
                name: Fault latched
              - entity: sensor.alternatorstarboard_alternator_temp_limit_active_starboard
                name: Temp limit

  - title: History
    path: history
    icon: mdi:chart-line
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: history-graph
            title: Current & voltage (1 h)
            hours_to_show: 1
            entities:
              - entity: sensor.alternatorport_alternator_current_port
                name: I Port
              - entity: sensor.alternatorstarboard_alternator_current_starboard
                name: I Stbd
              - entity: sensor.alternatorport_house_voltage_engine_port
                name: V Port
              - entity: sensor.alternatorstarboard_house_voltage_engine_starboard
                name: V Stbd
          - type: history-graph
            title: Temperature & field (1 h)
            hours_to_show: 1
            entities:
              - entity: sensor.alternatorport_alternator_temperature_port
                name: T Port
              - entity: sensor.alternatorstarboard_alternator_temperature_starboard
                name: T Stbd
              - entity: sensor.alternatorport_alternator_field_duty_port
                name: Field Port
              - entity: sensor.alternatorstarboard_alternator_field_duty_starboard
                name: Field Stbd
