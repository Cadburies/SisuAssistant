# MQTT → Signal K bridge for alternators (naming.md §10–11)
# Entity ids: device_name + slug of ESPHome name (after first adopt).
# Device: alternatorport / alternatorstarboard

- id: 'sisu_mqtt_alt_port'
  alias: "Sisu · Alternator Port → MQTT/Signal K"
  description: Publishes Port alternator metrics (SK-friendly JSON keys)
  trigger:
    - platform: state
      entity_id:
        # Names include "· Port" — HA entity_id slugs may vary slightly; re-check after adopt
        - sensor.alternatorport_alternator_current_port
        - sensor.alternatorport_house_voltage_engine_port
        - sensor.alternatorport_alternator_temperature_port
        - sensor.alternatorport_alternator_field_duty_port
        - sensor.alternatorport_alternator_temp_limit_active_port
        - sensor.alternatorport_alternator_status_port
        - sensor.alternatorport_alternator_charge_stage_port
        - number.alternatorport_alternator_current_setpoint_port
        - number.alternatorport_alternator_temperature_setpoint_port
  condition: []
  action:
    - service: mqtt.publish
      data:
        topic: signalk/electrical/alternators/port
        payload: >
          {
            "current": {{ states('sensor.alternatorport_alternator_current_port') | float(0) }},
            "voltage": {{ states('sensor.alternatorport_house_voltage_engine_port') | float(0) }},
            "temperature": {{ states('sensor.alternatorport_alternator_temperature_port') | float(0) + 273.15 }},
            "pwmRatio": {{ (states('sensor.alternatorport_alternator_field_duty_port') | float(0)) / 100 }},
            "tempLimit": {{ states('sensor.alternatorport_alternator_temp_limit_active_port') | float(0) }},
            "status": {{ states('sensor.alternatorport_alternator_status_port') | tojson }},
            "chargeStage": {{ states('sensor.alternatorport_alternator_charge_stage_port') | tojson }},
            "currentSetpoint": {{ states('number.alternatorport_alternator_current_setpoint_port') | float(0) }},
            "temperatureSetpoint": {{ states('number.alternatorport_alternator_temperature_setpoint_port') | float(0) + 273.15 }},
            "location": "port"
          }
        retain: false
  mode: single

