# Optional: publish house voltage from levels node for multi-point map
- id: 'sisu_mqtt_house_v_saloon'
  alias: "Sisu · House Voltage Saloon → MQTT/Signal K"
  description: Saloon node house bank VBus for drop diagnostics
  trigger:
    - platform: state
      entity_id:
        - sensor.waterlevels_house_voltage_saloon
  condition: []
  action:
    - service: mqtt.publish
      data:
        topic: signalk/electrical/batteries/house/voltage/saloon
        payload: >
          {
            "voltage": {{ states('sensor.waterlevels_house_voltage_saloon') | float(0) }},
            "location": "saloon"
          }
        retain: false
  mode: single

# Saloon display Wind page sparkline feed (#66). sensor.nmea_aws already has
# state_class: measurement so HA's 5-minute long-term stats already exist —
# pull the last hour (12 buckets) and publish as a compact CSV. Padded to
# exactly 12 values (oldest first) so the ESP32 side never has to
# special-case a short buffer early after boot/ingest restart, and so its
# Max(1h) header stays computed from the exact same data it plots.
- id: 'sisu_wind_trend_aws_1h'
  alias: "Sisu · AWS 1h Trend → MQTT (saloon display sparkline)"
  description: Last 12x 5-minute AWS means as CSV, for saloon_display.yaml page_wind
  trigger:
    - platform: time_pattern
      minutes: "/5"
  condition: []
  action:
    - service: recorder.get_statistics
      data:
        start_time: "{{ (now() - timedelta(hours=1)).isoformat() }}"
        end_time: "{{ now().isoformat() }}"
        statistic_ids:
          - sensor.nmea_aws
        period: 5minute
        types:
          - mean
      response_variable: aws_stats
    - service: mqtt.publish
      data:
        topic: sisu/v1/wind/aws_trend
        payload: >
          {% set means = aws_stats.statistics.get('sensor.nmea_aws', []) | map(attribute='mean') | list %}
          {% set padded = (([0.0] * (12 - means | length)) + means)[-12:] %}
          {"value": "{{ padded | map('round', 2) | join(',') }}"}
        retain: true
  mode: single

# Ingest-down safety net (#64) — the watchdog: true fix on the add-on
# (addons/sisu_nmea_ingest/config.yaml) should self-heal a crash within
# ~1-2 min. This is the fallback for anything watchdog doesn't catch (e.g.
# a hang that never exits) so an outage can't silently sit for hours again
# like it did before this issue. Two triggers (one per entity) covers
# either flipping off first; the condition re-checks both are off right
# now before actually alerting.
- id: 'sisu_nmea_ingest_dead_alert'
  alias: "Sisu · NMEA Ingest Both Sources Down Alert"
  description: Persistent notification if source_ydwg AND source_datahub are both off 5+ min
  trigger:
    - platform: state
      entity_id: binary_sensor.source_ydwg
      to: "off"
      for:
        minutes: 5
    - platform: state
      entity_id: binary_sensor.source_datahub
      to: "off"
      for:
        minutes: 5
  condition:
    - condition: state
      entity_id: binary_sensor.source_ydwg
      state: "off"
    - condition: state
      entity_id: binary_sensor.source_datahub
      state: "off"
  action:
    - service: persistent_notification.create
      data:
        title: "Sisu NMEA ingest down"
        message: >
          binary_sensor.source_ydwg and source_datahub have both been off
          for 5+ minutes — the Sisu NMEA ingest add-on is likely dead.
          Check: ./scripts/ha-cli.sh addons info local_sisu_nmea_ingest
          and ./scripts/ha-cli.sh addons logs local_sisu_nmea_ingest (#64)
        notification_id: sisu_nmea_ingest_dead
  mode: single

- id: 'sisu_nmea_ingest_recovered_clear_alert'
  alias: "Sisu · NMEA Ingest Recovered — Clear Alert"
  description: Dismiss the ingest-down notification once both sources are back
  trigger:
    - platform: state
      entity_id: binary_sensor.source_ydwg
      to: "on"
    - platform: state
      entity_id: binary_sensor.source_datahub
      to: "on"
  condition:
    - condition: state
      entity_id: binary_sensor.source_ydwg
      state: "on"
    - condition: state
      entity_id: binary_sensor.source_datahub
      state: "on"
  action:
    - service: persistent_notification.dismiss
      data:
        notification_id: sisu_nmea_ingest_dead
  mode: single
