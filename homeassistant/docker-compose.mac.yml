# Interim local stack — Mosquitto + Signal K + Grafana + InfluxDB + MQTT
# Explorer on this Mac (Docker Desktop), not HA Green. See OPS.md §7 /
# issue #24: Green stays HA + ESPHome only, no exceptions.
#
# Reuses the same config trees as the F8-target homeassistant/docker-compose.yml
# (mosquitto/, signalk/ — signalk/ is the authoritative Signal K config per
# .ai_context/INDEX.md) but with Mac-appropriate networking: Docker Desktop
# doesn't do Linux host networking, so ports are published explicitly and
# grafana/influxdb/mqtt-explorer get non-3000 host ports since Signal K
# already owns 3000.
#
# KIP is NOT a separate service — it ships bundled inside signalk-server,
# at http://<this-mac-lan-ip>:3000/@mxtommy/kip/ (confirmed HTTP 200).
#
# signalk uses network_mode: service:mosquitto (shares its netns) instead of
# its own network — this lets the committed signalk-mqtt-sensors.json keep
# its production-shaped "mqtt://127.0.0.1:1883" unchanged (same assumption
# as network_mode: host on F8), so nothing in plugin-config-data/ (a
# single-owner hotspot) needs editing for this local networking quirk.
services:
  mosquitto:
    container_name: mosquitto-mac
    image: "eclipse-mosquitto:latest"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "3000:3000" # signalk, via network_mode: service:mosquitto below
  signalk:
    container_name: signalk-server-mac
    image: "signalk/signalk-server:latest"
    volumes:
      - ./signalk:/home/node/.signalk
    restart: unless-stopped
    network_mode: "service:mosquitto"
    depends_on:
      - mosquitto
    environment:
      - TZ=America/Tortola
  influxdb:
    container_name: influxdb-mac
    image: "influxdb:2"
    volumes:
      - ./influxdb:/var/lib/influxdb2
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - TZ=America/Tortola
      # First-run auto-setup only — a no-op once the volume already has an
      # org/bucket/token (true today, done via the UI wizard already).
      # Values from homeassistant/.env (gitignored — generate with
      # scripts/gen-docker-env.sh from secrets.yaml).
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
  grafana:
    container_name: grafana-mac
    image: "grafana/grafana:latest"
    volumes:
      - ./grafana:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    ports:
      - "3001:3000" # signalk already owns host :3000
    environment:
      - TZ=America/Tortola
      # First-run admin bootstrap only — a no-op once grafana.db already has
      # an admin account (true today, password already changed from admin/admin).
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # InfluxDB datasource provisioning (grafana-provisioning/datasources/influxdb.yaml)
      # reads these via Grafana's native $VAR env interpolation. Host is the
      # Compose service name (Docker's built-in DNS on the default bridge
      # network this stack shares) since Docker Desktop can't do Linux host
      # networking — see docker-compose.yml for the host-networking equivalent.
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
    depends_on:
      - influxdb
  mqtt-explorer:
    container_name: mqtt-explorer-mac
    image: "smeagolworms4/mqtt-explorer"
    volumes:
      - ./mqtt-explorer/config:/mqtt-explorer/config
      - ./mqtt-explorer/data:/mqtt-explorer/data
      - ./mqtt-explorer/log:/mqtt-explorer/log
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      - mosquitto
