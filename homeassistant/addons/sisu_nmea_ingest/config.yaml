name: Sisu NMEA ingest
version: "1.0.0"
slug: sisu_nmea_ingest
description: >
  Dual-listen YDWG + DataHub kernel ingest. Publishes sisu/v1 JSON
  {value, source, stale_s, value_si} for HA and Signal K.
url: https://github.com/Cadburies/SisuAssistant/issues/57
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
# #64: without this, Supervisor never auto-restarts the add-on after an
# unexpected exit — boot: auto only governs start-on-Supervisor-boot, not
# restart-on-crash (found: sat in Supervisor state "error" for ~12h until
# manually restarted). Confirmed live against this Supervisor's own
# apps/validate.py that the manifest field must be an active
# tcp://[HOST]:port probe string, not a plain true/false flag — the
# daemon has no listening port of its own (pure outbound MQTT/gateway
# client), so nmea_wind_daemon.py now runs a trivial accept-and-close
# listener on SUPERVISOR_WATCHDOG_PORT (default 8765) purely for this
# probe to poll. host_network: true below means no ports: mapping needed.
watchdog: tcp://[HOST]:8765
host_network: true
map:
  - type: homeassistant_config
    read_only: true
    path: /homeassistant
options:
  ydwg_host: "192.168.10.30"
  ydwg_port: 1456
  datahub_host: "192.168.10.31"
  datahub_port: 11102
  mqtt_host: "127.0.0.1"
  mqtt_port: 1883
  mqtt_username: "sisu"
  mqtt_password: ""
  mqtt_kernel_prefix: "sisu/v1"
schema:
  ydwg_host: str
  ydwg_port: port
  datahub_host: str
  datahub_port: port
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  mqtt_kernel_prefix: str
