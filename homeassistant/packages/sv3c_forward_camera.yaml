# Forward Camera — SV3C SV-B01-1080P-POE, second unit (issue #33,
# added 2026-08-13). Was called "dinghy2" briefly during setup; kept
# "Forward Camera" as its name throughout since that's what it's
# actually for -- see sv3c_aft_camera.yaml for the sibling unit and the
# shared background (T-Camera retirement, protocol dead ends, etc).
#
# Credentials: homeassistant/secrets.yaml (sv3c_forward_user/_pass,
# ip_sv3c_forward) -- mirrored to secrets.yaml.example.
#
# Off/On/Sentry mode (input_select.forward_camera_mode) -- same spec as
# Aft Camera, see that file's header for the full behavior breakdown.
# Reinit (script.forward_camera_reinit) is the same power-cycle
# recovery: reload ONVIF, then set the clock. See the aft package.
#
# 2026-10-04 (#193): roles swapped. This Forward role is now the unit
# at 192.168.0.33, MAC F0:00:00:40:4E:96 (the one whose motion sensor
# latches). The debounce below still covers it.
# Motion detection (binary_sensor.forward_camera_cell_motion_detection)
# appeared on its own once the owner enabled Motion Detect in the
# camera's Event settings -- unlike Aft Camera, no confirmed case yet of
# it latching "on" and failing to clear, but the same debounce wrapper
# is applied anyway for consistency and because it's cheap insurance
# against the same firmware family having the same bug.

input_select:
  forward_camera_mode:
    name: Forward Camera Mode
    options:
      - "Off"
      - "On"
      - "Sentry"
    initial: "On"
    icon: mdi:cctv

input_boolean:
  forward_camera_motion_active:
    name: Forward Camera Motion (debounced)
    icon: mdi:motion-sensor

input_datetime:
  forward_camera_last_snapshot:
    name: Forward Camera Last Snapshot Time
    has_date: true
    has_time: true
  # Cooldown for the automatic ONVIF reload. See the aft package (#235).
  forward_camera_last_auto_reinit:
    name: Forward Camera Last Auto Reinit
    has_date: true
    has_time: true

input_text:
  forward_camera_last_snapshot_reason:
    name: Forward Camera Last Snapshot Reason
    initial: "No snapshot yet"

template:
  - sensor:
      - name: Forward Camera Last Snapshot Summary
        icon: mdi:camera-image
        state: >-
          {% if states('input_text.forward_camera_last_snapshot_reason') == 'No snapshot yet' %}
            No snapshot yet
          {% else %}
            {{ states('input_text.forward_camera_last_snapshot_reason') }} · {{ as_timestamp(states('input_datetime.forward_camera_last_snapshot')) | timestamp_custom('%Y-%m-%d %H:%M:%S') }}
          {% endif %}

# camera.forward_camera_latest_snapshot (local_file platform, pointing at
# /config/www/forward_camera_latest.jpg) is set up via the config_entries
# API, not YAML -- see sv3c_aft_camera.yaml's note on why.
#
# #235: same empty-frame hole as the aft camera. script.forward_camera_note_frame
# records a snapshot only when the JPEG is larger than 1000 bytes.

shell_command:
  forward_camera_frame_bytes: "wc -c < /config/www/forward_camera_latest.jpg 2>/dev/null || echo 0"

automation:
  - id: forward_camera_motion_debounce
    alias: "Forward Camera: debounce ONVIF motion sensor"
    description: >
      Same self-clearing wrapper as Aft Camera -- see that file's KNOWN
      ISSUE note. Runs regardless of mode; the photo-burst automation
      below is what actually gates on Sentry.
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.forward_camera_cell_motion_detection
        to: "on"
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.forward_camera_motion_active
      - delay:
          seconds: 30
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.forward_camera_motion_active

  - id: sv3c_forward_camera_motion_photo_burst
    alias: "Forward Camera: motion trigger → photo burst"
    description: >
      Sentry mode only. 8 snapshots ~600ms apart (~5s total) on
      real motion, saved to /config/www/forward_snapshots/ (served at
      /local/forward_snapshots/ by HA). Also copies the last frame to
      the fixed forward_camera_latest.jpg path and updates the
      last-snapshot time/reason for the Sentry-mode dashboard tile.
      Triggers off the RAW sensor, not the debounced
      input_boolean -- see sv3c_aft_camera.yaml's equivalent automation
      for why (the debounced boolean only flips "on" once per continuous
      motion session, which would silently swallow snapshots for
      genuine repeat pulses during an active window). mode: single here
      just means a retrigger *while a burst is actively running* (~5s)
      is dropped, not queued.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.forward_camera_cell_motion_detection
        to: "on"
    condition:
      - condition: state
        entity_id: input_select.forward_camera_mode
        state: "Sentry"
      # #167: HA silently skips camera.snapshot on an unavailable camera, so
      # without this the last-snapshot time/reason moved with no image taken.
      - condition: template
        value_template: "{{ states('camera.forward_camera_mainstream') not in ['unavailable', 'unknown'] }}"
    action:
      - repeat:
          count: 8
          sequence:
            - action: camera.snapshot
              target:
                entity_id: camera.forward_camera_mainstream
              data:
                filename: >-
                  /config/www/forward_snapshots/{{ now().strftime('%Y%m%d_%H%M%S_%f') }}.jpg
            - delay:
                milliseconds: 600
      - action: camera.snapshot
        target:
          entity_id: camera.forward_camera_mainstream
        data:
          filename: /config/www/forward_camera_latest.jpg
      - action: script.forward_camera_note_frame
        data:
          reason: Motion

  - id: sv3c_forward_camera_timed_snapshot
    alias: "Forward Camera: periodic snapshot (Sentry mode)"
    description: >
      Sentry mode only. Every 5 minutes, so there's always a reasonably
      fresh frame even during quiet periods, not just after motion.
    mode: single
    trigger:
      - platform: time_pattern
        minutes: "/5"
    condition:
      - condition: state
        entity_id: input_select.forward_camera_mode
        state: "Sentry"
      # #167: HA silently skips camera.snapshot on an unavailable camera, so
      # without this the last-snapshot time/reason moved with no image taken.
      - condition: template
        value_template: "{{ states('camera.forward_camera_mainstream') not in ['unavailable', 'unknown'] }}"
    action:
      - action: camera.snapshot
        target:
          entity_id: camera.forward_camera_mainstream
        data:
          filename: /config/www/forward_camera_latest.jpg
      - action: script.forward_camera_note_frame
        data:
          reason: Timed

  - id: forward_camera_offline_watch
    alias: "Forward Camera: offline watch"
    description: >
      #235. Same as the aft offline watch: one notification, and a single
      ONVIF reload at most every 30 minutes while mode is On or Sentry.
    mode: single
    trigger:
      - platform: state
        entity_id: camera.forward_camera_mainstream
        to: "unavailable"
        for: "00:10:00"
      - platform: time_pattern
        minutes: "/30"
    condition:
      - condition: template
        value_template: "{{ states('input_select.forward_camera_mode') in ['On', 'Sentry'] }}"
      - condition: template
        value_template: "{{ states('camera.forward_camera_mainstream') in ['unavailable', 'unknown'] }}"
    action:
      - action: persistent_notification.create
        data:
          notification_id: forward_camera_down
          title: "Forward camera is down"
          message: >-
            192.168.0.33 (F0:00:00:40:4E:96) is not answering on the LAN.
            Check PoE and the cable. Press Reinit forward once it is back.
            Home Assistant reloads ONVIF at most every 30 minutes until then.
      - if:
          - condition: template
            value_template: >-
              {% set t = as_timestamp(states('input_datetime.forward_camera_last_auto_reinit'), 0) %}
              {{ t < now().timestamp() - 1800 }}
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.forward_camera_last_auto_reinit
            data:
              timestamp: "{{ now().timestamp() }}"
          - action: homeassistant.reload_config_entry
            target:
              entity_id: camera.forward_camera_mainstream

  - id: forward_camera_down_clear
    alias: "Forward Camera: clear down notification"
    description: >
      Drop the alert when the camera is switched Off, or when mode is On
      and the stream is back. Sentry waits for a real JPEG.
    mode: single
    trigger:
      - platform: state
        entity_id:
          - input_select.forward_camera_mode
          - camera.forward_camera_mainstream
    condition:
      - condition: template
        value_template: >-
          {{ states('input_select.forward_camera_mode') == 'Off'
             or (states('input_select.forward_camera_mode') == 'On'
                 and states('camera.forward_camera_mainstream') not in ['unavailable', 'unknown']) }}
    action:
      - action: persistent_notification.dismiss
        data:
          notification_id: forward_camera_down

script:
  forward_camera_note_frame:
    alias: "Forward Camera: note frame"
    mode: queued
    max: 5
    fields:
      reason:
        description: Motion or Timed
        default: Timed
    sequence:
      - action: shell_command.forward_camera_frame_bytes
        response_variable: frame
      - variables:
          nbytes: "{{ frame.stdout | default('0') | trim | int(0) }}"
      - if:
          - condition: template
            value_template: "{{ nbytes > 1000 }}"
        then:
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.forward_camera_last_snapshot
            data:
              timestamp: "{{ now().timestamp() }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.forward_camera_last_snapshot_reason
            data:
              value: "{{ reason }}"
          - action: persistent_notification.dismiss
            data:
              notification_id: forward_camera_down
        else:
          - action: persistent_notification.create
            data:
              notification_id: forward_camera_down
              title: "Forward camera picture is empty"
              message: >-
                The stream looks up, but forward_camera_latest.jpg is {{ nbytes }} bytes.
                A real frame is about 47 KB. Check the camera, then press Reinit forward.
          - if:
              - condition: template
                value_template: >-
                  {% set t = as_timestamp(states('input_datetime.forward_camera_last_auto_reinit'), 0) %}
                  {{ t < now().timestamp() - 1800 }}
            then:
              - action: input_datetime.set_datetime
                target:
                  entity_id: input_datetime.forward_camera_last_auto_reinit
                data:
                  timestamp: "{{ now().timestamp() }}"
              - action: homeassistant.reload_config_entry
                target:
                  entity_id: camera.forward_camera_mainstream

  forward_camera_reinit:
    alias: "Forward Camera: reinit"
    icon: mdi:restart
    mode: restart
    description: >
      Use after the camera is switched off and back on. Reloads the
      ONVIF integration until camera.forward_camera_mainstream is back,
      then sets the camera clock. Always reloads: HA can keep the
      stream entity idle after the camera has lost power.
    sequence:
      # last_changed must move. HA can leave the stream idle after the
      # camera has already lost power, so a stale idle state is not success.
      - variables:
          started: "{{ now().timestamp() }}"
      - repeat:
          count: 8
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {{ states('camera.forward_camera_mainstream') not in ['unavailable', 'unknown']
                       and as_timestamp(states.camera.forward_camera_mainstream.last_changed) > (started | float) }}
              then:
                - action: button.press
                  target:
                    entity_id: button.forward_camera_set_system_date_and_time
                - stop: "Forward camera is back and the clock was set"
            - action: homeassistant.reload_config_entry
              target:
                entity_id: camera.forward_camera_mainstream
            - wait_template: >-
                {{ states('camera.forward_camera_mainstream') not in ['unavailable', 'unknown']
                   and as_timestamp(states.camera.forward_camera_mainstream.last_changed) > (started | float) }}
              timeout:
                seconds: 12
              continue_on_timeout: true
