# =============================================================================
# Victron / NMEA 2000 electrical — Power dashboard entities.
#
# Battery/BMS, solar, inverter/AC fields: real, filled from
# sensor.victron_gx_json (packages/victron_gx.yaml, direct MQTT to the
# GX device — issue #27). Still genuinely unavailable (left as stubs,
# not fabricated): cell min/max voltage (this BMV-702 has no per-cell
# reporting). Solar yield today is GX History/Daily/0/Yield summed across
# the 3 MPPTs (#54). Battery→loads daily kWh still has no GX field.
#
# HA Energy can use sensor.victron_solar_yield_today /
# sensor.victron_energy_solar_to_battery_daily (same GX daily kWh).
# =============================================================================

template:
  - sensor:
      # ---- Battery / BMS (Cerbo / SmartShunt / Lynx style) ----
      - default_entity_id: sensor.victron_battery_soc
        name: "Battery SoC"
        unique_id: victron_battery_soc
        unit_of_measurement: "%"
        device_class: battery
        icon: mdi:battery
        state: "{{ state_attr('sensor.victron_gx_json', 'battery_soc') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'battery_soc') is not none }}"

      - default_entity_id: sensor.victron_battery_voltage
        name: "Battery Voltage"
        unique_id: victron_battery_voltage
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        state: "{{ state_attr('sensor.victron_gx_json', 'battery_voltage') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'battery_voltage') is not none }}"

      # Combined "13.43 V (92%)" display for the main Sisu board's "House
      # bank" tile/header -- was pointing at the alternator sim's local
      # sense point (unavailable when the sim isn't running -> showed 0V),
      # this is the actual house bank as monitored by the Victron BMS.
      - default_entity_id: sensor.sisu_house_bank
        name: "House Bank"
        unique_id: sisu_house_bank
        icon: mdi:car-battery
        state: >-
          {% set v = states('sensor.victron_battery_voltage') %}
          {% set s = states('sensor.victron_battery_soc') %}
          {% if v not in ['unknown', 'unavailable', none] %}
            {{ v | float | round(2) }} V{{ ' (' ~ (s | float | round(0) | int | string) ~ '%)' if s not in ['unknown', 'unavailable', none] else '' }}
          {% else %}
            unknown
          {% endif %}
        availability: "{{ states('sensor.victron_battery_voltage') not in ['unknown', 'unavailable'] }}"

      - default_entity_id: sensor.victron_battery_current
        name: "Battery Current"
        unique_id: victron_battery_current
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        # BMV-702 whole-bank shunt (battery/256), not system/0/Dc/Battery --
        # issue #27, the two don't reconcile (different measurement points).
        # Positive = charging into the bank.
        state: "{{ state_attr('sensor.victron_gx_json', 'battery_current') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'battery_current') is not none }}"

      - default_entity_id: sensor.victron_battery_power
        name: "Battery Power"
        unique_id: victron_battery_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ state_attr('sensor.victron_gx_json', 'battery_power') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'battery_power') is not none }}"

      - default_entity_id: sensor.victron_battery_consumed_ah
        name: "Battery Consumed Ah"
        unique_id: victron_battery_consumed_ah
        unit_of_measurement: Ah
        icon: mdi:battery-minus
        state: "{{ state_attr('sensor.victron_gx_json', 'battery_consumed_ah') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'battery_consumed_ah') is not none }}"

      - default_entity_id: sensor.victron_battery_time_to_go
        name: "Battery Time to Go"
        unique_id: victron_battery_time_to_go
        unit_of_measurement: h
        icon: mdi:timer-outline
        # Victron only reports this while net discharging -- null (shows
        # unavailable) while charging or idle, by design, not a bug.
        state: "{{ state_attr('sensor.victron_gx_json', 'battery_time_to_go_h') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'battery_time_to_go_h') is not none }}"

      - default_entity_id: sensor.victron_bms_state
        name: "BMS State"
        unique_id: victron_bms_state
        icon: mdi:chip
        # Derived from battery_current sign (charging/discharging/idle), not
        # a literal state the BMV reports -- it doesn't have one to report.
        state: "{{ state_attr('sensor.victron_gx_json', 'bms_state') | default('awaiting GX data') }}"
        availability: "{{ true }}"

      - default_entity_id: sensor.victron_bms_alarm_detail
        name: "BMS Alarm Detail"
        unique_id: victron_bms_alarm_detail
        icon: mdi:alert-circle-outline
        state: "{{ state_attr('sensor.victron_gx_json', 'bms_alarm_names') | default('unknown') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'bms_alarm_active') is not none }}"

      - default_entity_id: sensor.victron_cell_min_voltage
        name: "Cell Min Voltage"
        unique_id: victron_cell_min_v
        unit_of_measurement: V
        device_class: voltage
        state: "unknown"
        availability: "{{ false }}"

      - default_entity_id: sensor.victron_cell_max_voltage
        name: "Cell Max Voltage"
        unique_id: victron_cell_max_v
        unit_of_measurement: V
        device_class: voltage
        state: "unknown"
        availability: "{{ false }}"

      # ---- Solar MPPT (3×: Roof Fwd 288 / Roof Mid 290 / Aft 291 — #27/#54) ----
      - default_entity_id: sensor.victron_solar_power
        name: "Solar Power"
        unique_id: victron_solar_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:solar-power
        state: "{{ state_attr('sensor.victron_gx_json', 'solar_power_w') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'solar_power_w') is not none }}"

      - default_entity_id: sensor.victron_solar_roof_fwd_power
        name: "Solar Roof Fwd"
        unique_id: victron_solar_roof_fwd
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:solar-panel
        state: "{{ state_attr('sensor.victron_gx_json', 'solar_roof_fwd_power_w') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'solar_roof_fwd_power_w') is not none }}"
        attributes:
          yield_today_kwh: "{{ state_attr('sensor.victron_gx_json', 'solar_roof_fwd_yield_today_kwh') }}"
          pv_voltage: "{{ state_attr('sensor.victron_gx_json', 'solar_roof_fwd_pv_v') }}"
          mppt_state: "{{ state_attr('sensor.victron_gx_json', 'solar_roof_fwd_state') }}"

      - default_entity_id: sensor.victron_solar_roof_mid_power
        name: "Solar Roof Mid"
        unique_id: victron_solar_roof_mid
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:solar-panel
        state: "{{ state_attr('sensor.victron_gx_json', 'solar_roof_mid_power_w') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'solar_roof_mid_power_w') is not none }}"
        attributes:
          yield_today_kwh: "{{ state_attr('sensor.victron_gx_json', 'solar_roof_mid_yield_today_kwh') }}"
          pv_voltage: "{{ state_attr('sensor.victron_gx_json', 'solar_roof_mid_pv_v') }}"
          mppt_state: "{{ state_attr('sensor.victron_gx_json', 'solar_roof_mid_state') }}"

      - default_entity_id: sensor.victron_solar_aft_power
        name: "Solar Aft"
        unique_id: victron_solar_aft
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        icon: mdi:solar-panel
        state: "{{ state_attr('sensor.victron_gx_json', 'solar_aft_power_w') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'solar_aft_power_w') is not none }}"
        attributes:
          yield_today_kwh: "{{ state_attr('sensor.victron_gx_json', 'solar_aft_yield_today_kwh') }}"
          pv_voltage: "{{ state_attr('sensor.victron_gx_json', 'solar_aft_pv_v') }}"
          mppt_state: "{{ state_attr('sensor.victron_gx_json', 'solar_aft_state') }}"

      - default_entity_id: sensor.victron_solar_voltage
        name: "Solar Voltage"
        unique_id: victron_solar_voltage
        unit_of_measurement: V
        device_class: voltage
        # No single meaningful "solar voltage" across 3 independently
        # tracked MPPT strings at different panel voltages -- left
        # unavailable rather than showing a misleading single number.
        # Per-string Pv/V is on each victron_solar_*_power as pv_voltage.
        state: "unknown"
        availability: "{{ false }}"

      - default_entity_id: sensor.victron_solar_yield_today
        name: "Solar Yield Today"
        unique_id: victron_solar_yield_today
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        icon: mdi:solar-power-variant
        state: "{{ state_attr('sensor.victron_gx_json', 'solar_yield_today_kwh') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'solar_yield_today_kwh') is not none }}"

      - default_entity_id: sensor.victron_solar_state
        name: "Solar MPPT State"
        unique_id: victron_solar_state
        icon: mdi:solar-panel
        state: "{{ state_attr('sensor.victron_gx_json', 'solar_state') | default('awaiting GX data') }}"
        availability: "{{ true }}"

      # ---- AC / shore / inverter ----
      - default_entity_id: sensor.victron_grid_power
        name: "Shore Power"
        unique_id: victron_grid_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ state_attr('sensor.victron_gx_json', 'grid_power_w') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'grid_power_w') is not none }}"

      - default_entity_id: sensor.victron_inverter_power
        name: "Inverter Power"
        unique_id: victron_inverter_power
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ state_attr('sensor.victron_gx_json', 'inverter_power_w') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'inverter_power_w') is not none }}"

      - default_entity_id: sensor.victron_ac_loads
        name: "AC Loads"
        unique_id: victron_ac_loads
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ state_attr('sensor.victron_gx_json', 'ac_loads_w') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'ac_loads_w') is not none }}"

      - default_entity_id: sensor.victron_dc_loads
        name: "DC Loads"
        unique_id: victron_dc_loads
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: "{{ state_attr('sensor.victron_gx_json', 'dc_loads_w') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'dc_loads_w') is not none }}"

      # ---- kWh for Settings → Energy (fill when gateway has totals) ----
      - default_entity_id: sensor.victron_energy_solar_to_battery_daily
        name: "Energy Solar to Battery Daily"
        unique_id: victron_e_sol_bat
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        # Same GX daily yield as sensor.victron_solar_yield_today (HA Energy).
        state: "{{ state_attr('sensor.victron_gx_json', 'solar_yield_today_kwh') }}"
        availability: "{{ state_attr('sensor.victron_gx_json', 'solar_yield_today_kwh') is not none }}"

      - default_entity_id: sensor.victron_energy_battery_to_loads_daily
        name: "Energy Battery to Loads Daily"
        unique_id: victron_e_bat_load
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
        state: "unknown"
        availability: "{{ false }}"

  - binary_sensor:
      - default_entity_id: binary_sensor.victron_bms_alarm
        name: "BMS Alarm"
        unique_id: victron_bms_alarm
        device_class: problem
        state: "{{ state_attr('sensor.victron_gx_json', 'bms_alarm_active') | default(false) }}"
        availability: "{{ true }}"
