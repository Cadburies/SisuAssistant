# Dinghy security camera — SV3C SV-B01-1080P-POE (issue #33 follow-up).
# Replaces the LilyGo T-Camera after a confirmed hardware fault on its
# camera SCCB bus (see issue #33's history for the full diagnosis trail).
# Wired PoE, ONVIF/RTSP, added via HA's ONVIF
# integration (Settings > Devices & Services) rather than ESPHome —
# there's no YAML device config for this one, it's a real IP camera.
#
# Motion detection: uses the camera's own onboard ONVIF motion event
# (binary_sensor.dinghy_camera_cell_motion_detection, ONVIF Profile S
# "CellMotionDetector") -- confirmed live-triggering. Two other
# candidate protocols were tried and abandoned first: the classic
# XMEye/DVRIP binary protocol (port 34567) replies with an
# undocumented compact binary ACK instead of JSON that neither of the
# two main open-source reference implementations (OpenIPC/python-dvr,
# alexshpilkin/dvrip) handle; the "HIK" port (8000) accepts a TCP
# connection but returns nothing to a plain HTTP request, i.e. it's
# also a raw binary SDK protocol, not REST-style ISAPI. Standard ONVIF
# events turned out to be all that was needed once Motion Detect was
# enabled in the camera's own Event settings.
#
# Credentials: homeassistant/secrets.yaml (sv3c_dinghy1_user/_pass,
# ip_sv3c_dinghy1) -- mirrored to secrets.yaml.example.
#
# KNOWN ISSUE (2026-08-13): binary_sensor.dinghy_camera_cell_motion_detection
# latches "on" and never clears back to "off" -- owner confirmed it was
# stuck showing motion detected even before the camera was physically
# disconnected, so it's not a connectivity artifact. This is a documented
# quirk with some ONVIF camera firmwares/HA's ONVIF integration (camera
# sends a motion-start event but HA's PullPoint subscription never sees
# a matching stop, or the camera never sends one) -- e.g.
# https://ipcamtalk.com/threads/camera-onvif-motion-binary-sensor-doesnt-clear.56150/.
# Nothing on the HA side can force the raw ONVIF entity to clear, so it's
# wrapped below in a self-clearing input_boolean instead: turns on
# immediately on a raw "on" pulse, auto-clears 30s after the *last* pulse
# regardless of what the raw sensor itself ever reports. Both the
# dashboard tile and the photo-burst trigger use the debounced boolean,
# not the raw entity.

input_boolean:
  dinghy_camera_motion_active:
    name: Dinghy Camera Motion (debounced)
    icon: mdi:motion-sensor

automation:
  - id: dinghy_camera_motion_debounce
    alias: "Dinghy camera: debounce flaky ONVIF motion sensor"
    description: >
      See KNOWN ISSUE above. mode: restart means a fresh raw "on" pulse
      during an active window just restarts the 30s countdown rather
      than queuing a second one.
    mode: restart
    trigger:
      - platform: state
        entity_id: binary_sensor.dinghy_camera_cell_motion_detection
        to: "on"
    action:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.dinghy_camera_motion_active
      - delay:
          seconds: 30
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.dinghy_camera_motion_active

  - id: sv3c_dinghy_camera_motion_photo_burst
    alias: "Dinghy camera (SV3C): motion trigger → photo burst"
    description: >
      8 snapshots ~600ms apart (~5s total) on debounced motion (see
      input_boolean.dinghy_camera_motion_active above -- triggering off
      that instead of the raw ONVIF sensor directly also means this
      only re-fires once the debounce window has actually closed, not
      on every flaky retrigger). Saved to /config/www/dinghy_snapshots/
      (served at /local/dinghy_snapshots/ by HA) -- same directory the
      T-Camera used, so any existing gallery/history view doesn't need
      to care which physical camera took a given shot. mode: single
      means a retrigger mid-burst is dropped, not queued.
    mode: single
    trigger:
      - platform: state
        entity_id: input_boolean.dinghy_camera_motion_active
        to: "on"
    action:
      - repeat:
          count: 8
          sequence:
            - action: camera.snapshot
              target:
                entity_id: camera.dinghy_camera_mainstream
              data:
                filename: >-
                  /config/www/dinghy_snapshots/{{ now().strftime('%Y%m%d_%H%M%S_%f') }}.jpg
            - delay:
                milliseconds: 600
