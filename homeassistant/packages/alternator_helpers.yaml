# =============================================================================
# Alternator vessel helpers — production Marine Board entity_ids only (#58).
#
# Combined / charging / board-online are derived from
#   alternatorport / alternatorstarboard
# (ESPHome). They do NOT shadow those IDs and do NOT read bench-alts-sim.
# `sisu_alternator{port,starboard}_online` is also the peer-liveness input
# for the firmware shared-current budget (issue #16) — do not rename.
#
# Lab T8 dual-alt sim stays on lab_bench_alts_sim_* (Alternators → Lab tab).
# When boards are offline, these helpers are unavailable and the dashboard
# board-status chips explain why.
# =============================================================================

template:
  - binary_sensor:
      - default_entity_id: binary_sensor.sisu_alternatorport_online
        name: Alternator Port board
        unique_id: sisu_alternatorport_online
        device_class: connectivity
        icon: mdi:chip
        # Native ESPHome status: after marine_board_base.yaml is flashed.
        # Until then, any live Port house-V / current means the API is up.
        state: >
          {{ is_state('binary_sensor.alternatorport_status', 'on')
             or states('sensor.alternatorport_house_voltage_engine_port') not in ['unavailable', 'unknown']
             or states('sensor.alternatorport_alternator_current_port') not in ['unavailable', 'unknown'] }}

      - default_entity_id: binary_sensor.sisu_alternatorstarboard_online
        name: Alternator Starboard board
        unique_id: sisu_alternatorstarboard_online
        device_class: connectivity
        icon: mdi:chip
        state: >
          {{ is_state('binary_sensor.alternatorstarboard_status', 'on')
             or states('sensor.alternatorstarboard_house_voltage_engine_starboard') not in ['unavailable', 'unknown']
             or states('sensor.alternatorstarboard_alternator_current_starboard') not in ['unavailable', 'unknown'] }}

      - default_entity_id: binary_sensor.sisu_charging_active
        name: Charging Active
        unique_id: sisu_alias_charging
        device_class: battery_charging
        state: >
          {% set p = states('sensor.alternatorport_alternator_current_port') %}
          {% set s = states('sensor.alternatorstarboard_alternator_current_starboard') %}
          {{ (p not in ['unavailable', 'unknown'] and p | float(0) > 1)
             or (s not in ['unavailable', 'unknown'] and s | float(0) > 1) }}
        availability: >
          {{ is_state('binary_sensor.sisu_alternatorport_online', 'on')
             or is_state('binary_sensor.sisu_alternatorstarboard_online', 'on') }}

  - sensor:
      - default_entity_id: sensor.sisu_alternators_combined_current
        name: Alternators Combined Current
        unique_id: sisu_alias_combined_i
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        state: >
          {% set p = states('sensor.alternatorport_alternator_current_port') %}
          {% set s = states('sensor.alternatorstarboard_alternator_current_starboard') %}
          {% set pv = p | float(none) if p not in ['unavailable', 'unknown'] else none %}
          {% set sv = s | float(none) if s not in ['unavailable', 'unknown'] else none %}
          {% if pv is not none and sv is not none %}{{ (pv + sv) | round(1) }}
          {% elif pv is not none %}{{ pv | round(1) }}
          {% elif sv is not none %}{{ sv | round(1) }}
          {% endif %}
        availability: >
          {{ is_state('binary_sensor.sisu_alternatorport_online', 'on')
             or is_state('binary_sensor.sisu_alternatorstarboard_online', 'on') }}

      - default_entity_id: sensor.sisu_alternators_combined_power
        name: Alternators Combined Power
        unique_id: sisu_alias_combined_p
        unit_of_measurement: W
        device_class: power
        state_class: measurement
        state: >
          {% set p = states('sensor.alternatorport_alternator_power_port') %}
          {% set s = states('sensor.alternatorstarboard_alternator_power_starboard') %}
          {% set pv = p | float(none) if p not in ['unavailable', 'unknown'] else none %}
          {% set sv = s | float(none) if s not in ['unavailable', 'unknown'] else none %}
          {% if pv is not none and sv is not none %}{{ (pv + sv) | round(0) }}
          {% elif pv is not none %}{{ pv | round(0) }}
          {% elif sv is not none %}{{ sv | round(0) }}
          {% endif %}
        availability: >
          {{ is_state('binary_sensor.sisu_alternatorport_online', 'on')
             or is_state('binary_sensor.sisu_alternatorstarboard_online', 'on') }}

      - default_entity_id: sensor.sisu_house_voltage_delta_port_stbd
        name: House Voltage Delta · Port−Stbd
        unique_id: sisu_alias_house_v_delta
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        icon: mdi:delta
        state: >
          {% set p = states('sensor.alternatorport_house_voltage_engine_port') | float(none) %}
          {% set s = states('sensor.alternatorstarboard_house_voltage_engine_starboard') | float(none) %}
          {% if p is not none and s is not none %}{{ (p - s) | round(3) }}{% endif %}
        availability: >
          {{ states('sensor.alternatorport_house_voltage_engine_port') not in ['unavailable', 'unknown']
             and states('sensor.alternatorstarboard_house_voltage_engine_starboard') not in ['unavailable', 'unknown'] }}

      - default_entity_id: sensor.sisu_alternators_charge_summary
        name: Alternators Charge Summary
        unique_id: sisu_alternators_charge_summary
        icon: mdi:battery-charging
        state: >
          {% set p = states('sensor.alternatorport_alternator_charge_stage_port') %}
          {% set s = states('sensor.alternatorstarboard_alternator_charge_stage_starboard') %}
          Port {{ p if p not in ['unavailable', 'unknown'] else 'offline' }}
          · Stbd {{ s if s not in ['unavailable', 'unknown'] else 'offline' }}
        availability: "{{ true }}"
