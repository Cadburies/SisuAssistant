# Dinghy camera trigger response — issue #33. On PIR or loud-sound
# trigger: a burst of photos over ~5s (HA-side, since esp32_camera has no
# device-side "request_image" action — confirmed from the component
# docs) and a ~5s audio clip (device-side, uploaded in ~0.5s chunks via
# webhook — see esphome/tcamera.yaml for the capture_audio_clip script).
# Entity_ids reference the HA-adopted device
# (aft_cockpit_sisu_dinghy_camera_*) — see .ai_context/data_flow.md.

shell_command:
  # clip_id/seq/final/data come from the webhook automation's service-call
  # data below, templated in from trigger.json (the device's JSON body).
  tcamera_audio_chunk: >-
    python3 /config/python_scripts/tcamera_audio_receiver.py
    {{ clip_id }} {{ seq }} {{ final }} {{ data }}

automation:
  - id: tcamera_audio_chunk_webhook
    alias: "Dinghy camera: audio chunk received"
    description: >
      Receives one base64 PCM chunk per POST from tcamera's
      capture_audio_clip script (esphome/tcamera.yaml), appends it via
      tcamera_audio_receiver.py, which wraps the clip as a .wav once the
      chunk marked final:true arrives.
    mode: parallel
    max: 10
    trigger:
      - platform: webhook
        webhook_id: tcamera_audio_dinghy
        local_only: true
        allowed_methods:
          - POST
    action:
      - action: shell_command.tcamera_audio_chunk
        data:
          clip_id: "{{ trigger.json.clip_id }}"
          seq: "{{ trigger.json.seq }}"
          final: "{{ trigger.json.final }}"
          data: "{{ trigger.json.data }}"

  - id: dinghy_camera_trigger_photo_burst
    alias: "Dinghy camera: PIR/sound trigger → photo burst"
    description: >
      8 snapshots ~600ms apart (~5s total) on PIR or loud-sound trigger,
      saved to /config/www/dinghy_snapshots/ (served at
      /local/dinghy_snapshots/ by HA). mode: single means a retrigger
      mid-burst is dropped, not queued — same debounce as the device-side
      capture_audio_clip script.
    mode: single
    trigger:
      - platform: state
        entity_id: binary_sensor.aft_cockpit_sisu_dinghy_camera_dinghy_camera_pir
        to: "on"
      - platform: state
        entity_id: binary_sensor.aft_cockpit_sisu_dinghy_camera_dinghy_camera_loud_sound
        to: "on"
    action:
      - repeat:
          count: 8
          sequence:
            - action: camera.snapshot
              target:
                entity_id: camera.aft_cockpit_sisu_dinghy_camera_dinghy_camera
              data:
                filename: >-
                  /config/www/dinghy_snapshots/{{ now().strftime('%Y%m%d_%H%M%S_%f') }}.jpg
            - delay:
                milliseconds: 600
