# Placeholder entities for vessel systems not yet instrumented.
# Replace states with real ESPHome / N2K / Spectra integrations later.
# Entity_ids are stable so dashboards do not need rewriting.

template:
  - sensor:
      - default_entity_id: sensor.sisu_freshwater_level
        name: "Fresh Water Level"
        unique_id: sisu_freshwater_level
        unit_of_measurement: "%"
        icon: mdi:cup-water
        state: "unknown"
        availability: "{{ false }}"

      - default_entity_id: sensor.sisu_freshwater_volume
        name: "Fresh Water Volume"
        unique_id: sisu_freshwater_volume
        unit_of_measurement: L
        device_class: volume
        state: "unknown"
        availability: "{{ false }}"

      - default_entity_id: sensor.sisu_blackwater_level
        name: "Black Water Level"
        unique_id: sisu_blackwater_level
        unit_of_measurement: "%"
        icon: mdi:toilet
        state: "unknown"
        availability: "{{ false }}"

      - default_entity_id: sensor.sisu_greywater_level
        name: "Grey Water Level"
        unique_id: sisu_greywater_level
        unit_of_measurement: "%"
        icon: mdi:water-opacity
        state: "unknown"
        availability: "{{ false }}"

      - default_entity_id: sensor.sisu_fuel_level
        name: "Fuel Level"
        unique_id: sisu_fuel_level
        unit_of_measurement: "%"
        icon: mdi:gas-station
        state: "unknown"
        availability: "{{ false }}"

      - default_entity_id: sensor.sisu_fuel_volume
        name: "Fuel Volume"
        unique_id: sisu_fuel_volume
        unit_of_measurement: L
        device_class: volume
        state: "unknown"
        availability: "{{ false }}"

      - default_entity_id: sensor.sisu_genset_status
        name: "Genset Status"
        unique_id: sisu_genset_status
        icon: mdi:engine-outline
        state: "awaiting marine board"
        availability: "{{ true }}"

      - default_entity_id: sensor.sisu_genset_oil_pressure
        name: "Genset Oil Pressure"
        unique_id: sisu_genset_oil
        unit_of_measurement: bar
        device_class: pressure
        state: "unknown"
        availability: "{{ false }}"

      - default_entity_id: sensor.sisu_genset_coolant_temp
        name: "Genset Coolant Temp"
        unique_id: sisu_genset_coolant
        unit_of_measurement: "°C"
        device_class: temperature
        state: "unknown"
        availability: "{{ false }}"

      - default_entity_id: sensor.sisu_genset_hours
        name: "Genset Hours"
        unique_id: sisu_genset_hours
        unit_of_measurement: h
        state: "unknown"
        availability: "{{ false }}"

      # Watermaker: packages/spectra_newport.yaml (live WS @ 192.168.0.25)
      # Anchor watch (distance/bearing/alarm/radius/enable/set-here): real
      # implementation moved to packages/anchor_watch.yaml (issue #53) --
      # same entity_ids reused, kept here would be duplicate unique_ids.

      # Solar MPPT tiles live in energy_victron_stubs.yaml (#54):
      # victron_solar_roof_fwd_power / roof_mid / aft (GX instances 288/290/291).

  - binary_sensor:
      - default_entity_id: binary_sensor.sisu_genset_running
        name: "Genset Running"
        unique_id: sisu_genset_running
        device_class: running
        state: "{{ false }}"
        availability: "{{ true }}"

  - switch:
      - default_entity_id: switch.sisu_genset_start
        name: "Genset Start"
        unique_id: sisu_genset_start
        state: "{{ false }}"
        turn_on:
          - action: logbook.log
            data:
              name: Genset
              message: "START requested (no hardware yet)"
        turn_off:
          - action: logbook.log
            data:
              name: Genset
              message: "start switch off"
        availability: "{{ true }}"

      - default_entity_id: switch.sisu_genset_stop
        name: "Genset Stop"
        unique_id: sisu_genset_stop
        state: "{{ false }}"
        turn_on:
          - action: logbook.log
            data:
              name: Genset
              message: "STOP requested (no hardware yet)"
        turn_off:
          - action: logbook.log
            data:
              name: Genset
              message: "stop switch off"
        availability: "{{ true }}"

      - default_entity_id: switch.sisu_genset_preheat
        name: "Genset Preheat"
        unique_id: sisu_genset_preheat
        state: "{{ false }}"
        turn_on:
          - action: logbook.log
            data:
              name: Genset
              message: "PREHEAT on (placeholder)"
        turn_off:
          - action: logbook.log
            data:
              name: Genset
              message: "PREHEAT off"
        availability: "{{ true }}"

