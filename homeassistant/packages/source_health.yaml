# Source liveness — issue #50.
# NMEA YDWG/DataHub: real sentence flow from nmea_wind_daemon (#45/#49),
# not TCP-open (binary_sensor.ydwg_online is still the old SYN-ACK check).
# Other boat/internet sources: existing HA sensors that already mean "data arrived".
# Names are source_* — not quantity twins (#46).

mqtt:
  binary_sensor:
    - name: "Source YDWG"
      unique_id: source_ydwg
      state_topic: "sisu/v1/meta/ydwg/live"
      payload_on: "true"
      payload_off: "false"
      expire_after: 30
      device_class: connectivity
      icon: mdi:access-point-network

    - name: "Source DataHub"
      unique_id: source_datahub
      state_topic: "sisu/v1/meta/datahub/live"
      payload_on: "true"
      payload_off: "false"
      expire_after: 30
      device_class: connectivity
      icon: mdi:satellite-uplink

  sensor:
    - name: "Source YDWG Age"
      unique_id: source_ydwg_age
      state_topic: "sisu/v1/meta/ydwg/age_s"
      unit_of_measurement: "s"
      state_class: measurement
      expire_after: 30
      icon: mdi:timer-outline

    - name: "Source DataHub Age"
      unique_id: source_datahub_age
      state_topic: "sisu/v1/meta/datahub/age_s"
      unit_of_measurement: "s"
      state_class: measurement
      expire_after: 30
      icon: mdi:timer-outline

    - name: "Source YDWG Error"
      unique_id: source_ydwg_error
      state_topic: "sisu/v1/meta/ydwg/error"
      expire_after: 30
      icon: mdi:alert-circle-outline

    - name: "Source DataHub Error"
      unique_id: source_datahub_error
      state_topic: "sisu/v1/meta/datahub/error"
      expire_after: 30
      icon: mdi:alert-circle-outline

    - name: "Source Wind Active"
      unique_id: source_wind_active
      state_topic: "sisu/nmea/wind/gateway_active"
      expire_after: 30
      icon: mdi:windsock

    # Canonical NMEA quantities (#46) — same mqtt: block as the liveness
    # sensors. A separate nmea_kernel.yaml package did not register.
    - name: "NMEA AWS"
      unique_id: nmea_aws
      state_topic: "sisu/v1/wind/aws"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "kn"
      state_class: measurement
      expire_after: 30
      icon: mdi:windsock
    - name: "NMEA AWS Gust"
      unique_id: nmea_aws_gust
      state_topic: "sisu/v1/wind/aws_gust"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "kn"
      state_class: measurement
      expire_after: 30
      icon: mdi:weather-windy
    # 12-point CSV, oldest->newest, last hour of sensor.nmea_aws 5-minute
    # long-term stats — feeds the saloon display's Wind page sparkline
    # (#66). Not a numeric measurement itself (no unit/state_class),
    # published every 5 min by automations.yaml's sisu_wind_trend_aws_1h.
    - name: "NMEA AWS Trend 1h"
      unique_id: nmea_aws_trend_1h
      state_topic: "sisu/v1/wind/aws_trend"
      value_template: "{{ value_json.value }}"
      expire_after: 600
      icon: mdi:chart-line
    - name: "NMEA TWS"
      unique_id: nmea_tws
      state_topic: "sisu/v1/wind/tws"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "kn"
      state_class: measurement
      expire_after: 30
      icon: mdi:windsock
    - name: "NMEA TWS Gust"
      unique_id: nmea_tws_gust
      state_topic: "sisu/v1/wind/tws_gust"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "kn"
      state_class: measurement
      expire_after: 30
      icon: mdi:weather-windy
    - name: "NMEA AWA"
      unique_id: nmea_awa
      state_topic: "sisu/v1/wind/awa"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "°"
      state_class: measurement
      expire_after: 30
      icon: mdi:angle-acute
    - name: "NMEA TWA"
      unique_id: nmea_twa
      state_topic: "sisu/v1/wind/twa"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "°"
      state_class: measurement
      expire_after: 30
      icon: mdi:angle-acute
    - name: "NMEA TWD"
      unique_id: nmea_twd
      state_topic: "sisu/v1/wind/twd"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "°"
      state_class: measurement
      expire_after: 30
      icon: mdi:compass-rose
    - name: "NMEA SOG"
      unique_id: nmea_sog
      state_topic: "sisu/v1/nav/sog"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: kn
      device_class: speed
      state_class: measurement
      expire_after: 30
      icon: mdi:speedometer
    - name: "NMEA COG"
      unique_id: nmea_cog
      state_topic: "sisu/v1/nav/cog"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "°"
      state_class: measurement
      expire_after: 30
      icon: mdi:compass
    - name: "NMEA Heading Magnetic"
      unique_id: nmea_heading_magnetic
      state_topic: "sisu/v1/nav/heading_mag"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "°"
      state_class: measurement
      expire_after: 30
      icon: mdi:compass-rose
    - name: "NMEA Heading True"
      unique_id: nmea_heading_true
      state_topic: "sisu/v1/nav/heading_true"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "°"
      state_class: measurement
      expire_after: 30
      icon: mdi:compass-rose
    - name: "NMEA Depth"
      unique_id: nmea_depth
      state_topic: "sisu/v1/nav/depth"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: m
      device_class: distance
      state_class: measurement
      expire_after: 30
      icon: mdi:waves
    - name: "NMEA Latitude"
      unique_id: nmea_latitude
      state_topic: "sisu/v1/nav/lat"
      value_template: "{{ value_json.value }}"
      expire_after: 30
      icon: mdi:latitude
    - name: "NMEA Longitude"
      unique_id: nmea_longitude
      state_topic: "sisu/v1/nav/lon"
      value_template: "{{ value_json.value }}"
      expire_after: 30
      icon: mdi:longitude
    - name: "NMEA Air Temperature"
      unique_id: nmea_air_temperature
      state_topic: "sisu/v1/env/air_temp"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      expire_after: 30
      icon: mdi:thermometer
    - name: "NMEA Water Temperature"
      unique_id: nmea_water_temperature
      state_topic: "sisu/v1/env/water_temp"
      value_template: "{{ value_json.value }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      expire_after: 30
      icon: mdi:coolant-temperature

template:
  - binary_sensor:
      - default_entity_id: binary_sensor.source_victron
        name: "Source Victron"
        unique_id: source_victron
        device_class: connectivity
        icon: mdi:battery-charging
        state: "{{ is_state('sensor.victron_gx_json', 'online') }}"

      - default_entity_id: binary_sensor.source_spectra
        name: "Source Spectra"
        unique_id: source_spectra
        device_class: connectivity
        icon: mdi:water-pump
        state: "{{ states('sensor.spectra_status_json') not in ['unavailable', 'unknown'] }}"

      - default_entity_id: binary_sensor.source_alternators
        name: "Source Alternators"
        unique_id: source_alternators
        device_class: connectivity
        icon: mdi:sine-wave
        state: >-
          {{ states('sensor.alternatorport_house_voltage_engine_port') not in ['unavailable', 'unknown']
             or states('sensor.alternatorstarboard_house_voltage_engine_starboard') not in ['unavailable', 'unknown'] }}

      - default_entity_id: binary_sensor.source_levels
        name: "Source Levels"
        unique_id: source_levels
        device_class: connectivity
        icon: mdi:cup-water
        state: >-
          {{ states('sensor.sisu_freshwater_fwd_level') not in ['unavailable', 'unknown']
             or states('sensor.sisu_freshwater_level') not in ['unavailable', 'unknown'] }}

      - default_entity_id: binary_sensor.source_freezer
        name: "Source Freezer"
        unique_id: source_freezer
        device_class: connectivity
        icon: mdi:snowflake
        # True ESPHome liveness, not "does the probe have a valid reading" —
        # a switch/climate entity can only be on/off/unavailable, so this
        # can't be fooled by a connected device with no DS18B20 wired (that
        # shows up as source_freezer_error below instead, not "disconnected").
        state: >-
          {{ states('switch.freezer_compressor') not in ['unavailable']
             or states('switch.aft_cockpit_sisu_freezer_freezer_compressor') not in ['unavailable'] }}

      - default_entity_id: binary_sensor.source_freezer_error
        name: "Source Freezer Error"
        unique_id: source_freezer_error
        device_class: problem
        icon: mdi:snowflake-alert
        # Connected but something's actually wrong: no valid temp probe
        # reading, or the local battery ADC reads low.
        state: >-
          {{ is_state('binary_sensor.aft_cockpit_sisu_freezer_ds18b20_status', 'on')
             or is_state('binary_sensor.aft_cockpit_sisu_freezer_battery_low', 'on') }}

      - default_entity_id: binary_sensor.source_noaa_tides
        name: "Source NOAA Tides"
        unique_id: source_noaa
        device_class: connectivity
        icon: mdi:waves
        state: "{{ is_state('sensor.tides_noaa_json', 'online') }}"

      - default_entity_id: binary_sensor.source_met_no
        name: "Source Met.no"
        unique_id: source_metno
        device_class: connectivity
        icon: mdi:weather-partly-cloudy
        state: "{{ states('weather.forecast_home') not in ['unavailable', 'unknown'] }}"

      - default_entity_id: binary_sensor.source_open_meteo
        name: "Source Open-Meteo"
        unique_id: source_openmeteo
        device_class: connectivity
        icon: mdi:weather-cloudy-clock
        state: "{{ is_state('sensor.weather_open_meteo_json', 'online') }}"
