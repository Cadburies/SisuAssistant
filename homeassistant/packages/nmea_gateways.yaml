# NMEA stats + GPS-fix template (#46). Quantity sensors: source_health.yaml.

template:
  - binary_sensor:
      - name: "NMEA GPS Fix"
        unique_id: nmea_gateway_has_fix
        device_class: connectivity
        icon: mdi:crosshairs-gps
        state: "{{ states('sensor.nmea_latitude') not in ['unavailable', 'unknown'] }}"

sensor:
  - platform: statistics
    name: "True Wind Speed Max 6h"
    unique_id: nmea_tws_max_6h
    entity_id: sensor.nmea_tws
    state_characteristic: value_max
    max_age:
      hours: 6

  - platform: statistics
    name: "Apparent Wind Speed Max 10m"
    unique_id: nmea_aws_max_10m
    entity_id: sensor.nmea_aws
    state_characteristic: value_max
    max_age:
      minutes: 10

  - platform: statistics
    name: "Apparent Wind Speed Max 6h"
    unique_id: nmea_aws_max_6h
    entity_id: sensor.nmea_aws
    state_characteristic: value_max
    max_age:
      hours: 6
