# NMEA 2000 instruments via Wi‑Fi gateways (NMEA 0183 over TCP)
#
# Primary:  Yacht Devices YDWG-02     (secrets: YDWG_URL, default TCP 1456)
# Failover: PredictWind DataHub      (secrets: PREDICTWIND_HUB_LOCAL_URL, default TCP 11102)
#
# Script: /config/python_scripts/nmea_gateways.py
# Policy: prefer YDWG when TCP is up; else DataHub; else unavailable.
#
# Web UI credentials (YDWG_USERNAME/PASSWORD, PREDICTWIND_HUB_*) are for device
# admin only — not required for the NMEA TCP stream.
#
# Hosts are typically on Sisu-IoT (.10); HA Green must route .20 → .10 (NETWORK.md).

command_line:
  - sensor:
      name: NMEA Gateway Health JSON
      unique_id: nmea_gateway_health_json
      command: "python3 /config/python_scripts/nmea_gateways.py health"
      scan_interval: 30
      value_template: "{{ value_json.active | default('none') }}"
      json_attributes:
        - gateways
        - active
        - active_host
        - active_port
        - policy
      icon: mdi:lan-connect

  - sensor:
      name: NMEA Gateway Status JSON
      unique_id: nmea_gateway_status_json
      command: "python3 /config/python_scripts/nmea_gateways.py status"
      scan_interval: 15
      value_template: >-
        {% if value_json.ok %}
          {{ value_json.active }}
        {% else %}
          offline
        {% endif %}
      json_attributes:
        - ok
        - active
        - active_host
        - active_port
        - gateways
        - policy
        - parsed
        - sentence_count
        - sample_talkers
        - warning
        - error
      icon: mdi:sail-boat

template:
  - binary_sensor:
      - name: YDWG Online
        unique_id: ydwg_online
        device_class: connectivity
        state: >-
          {% set g = state_attr('sensor.nmea_gateway_health_json', 'gateways') %}
          {% if g is iterable %}
            {{ (g | selectattr('id', 'eq', 'ydwg') | map(attribute='online') | first) | default(false) }}
          {% else %}
            false
          {% endif %}
        icon: mdi:access-point-network

      - name: DataHub Online
        unique_id: datahub_online
        device_class: connectivity
        state: >-
          {% set g = state_attr('sensor.nmea_gateway_health_json', 'gateways') %}
          {% if g is iterable %}
            {{ (g | selectattr('id', 'eq', 'datahub') | map(attribute='online') | first) | default(false) }}
          {% else %}
            false
          {% endif %}
        icon: mdi:satellite-uplink

      - name: NMEA Gateway Has Fix
        unique_id: nmea_gateway_has_fix
        device_class: connectivity
        state: >-
          {{ state_attr('sensor.nmea_gateway_status_json', 'parsed').gps_fix | default(false) }}
        icon: mdi:crosshairs-gps

  - sensor:
      - name: NMEA Active Source
        unique_id: nmea_active_source
        state: "{{ states('sensor.nmea_gateway_status_json') }}"
        icon: mdi:swap-horizontal
        attributes:
          host: "{{ state_attr('sensor.nmea_gateway_status_json', 'active_host') }}"
          port: "{{ state_attr('sensor.nmea_gateway_status_json', 'active_port') }}"
          policy: "ydwg_first_then_datahub"

      - name: NMEA SOG
        unique_id: nmea_sog_kn
        unit_of_measurement: kn
        device_class: speed
        state_class: measurement
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.sog_kn if p and p.sog_kn is defined else 'unknown' }}
        icon: mdi:speedometer

      - name: NMEA COG
        unique_id: nmea_cog_deg
        unit_of_measurement: "°"
        state_class: measurement
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.cog_deg if p and p.cog_deg is defined else 'unknown' }}
        icon: mdi:compass

      - name: NMEA Depth
        unique_id: nmea_depth_m
        unit_of_measurement: m
        device_class: distance
        state_class: measurement
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.depth_m if p and p.depth_m is defined else 'unknown' }}
        icon: mdi:waves

      - name: NMEA Latitude
        unique_id: nmea_latitude
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.latitude if p and p.latitude is defined else 'unknown' }}
        icon: mdi:latitude

      - name: NMEA Longitude
        unique_id: nmea_longitude
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.longitude if p and p.longitude is defined else 'unknown' }}
        icon: mdi:longitude

      - name: NMEA AWS
        unique_id: nmea_aws_kn
        unit_of_measurement: kn
        device_class: wind_speed
        state_class: measurement
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.aws_kn if p and p.aws_kn is defined else 'unknown' }}
        icon: mdi:windsock

      - name: NMEA AWA
        unique_id: nmea_awa_deg
        unit_of_measurement: "°"
        state_class: measurement
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.awa_deg if p and p.awa_deg is defined else 'unknown' }}
        icon: mdi:angle-acute

      # True wind speed -- computed by the boat's own instruments (MWV
      # sentence with reference "T"), not derived here from AWS+SOG+heading.
      # 'unknown' if the instrument only ever sends apparent ("R") MWV.
      - name: NMEA TWS
        unique_id: nmea_tws_kn
        unit_of_measurement: kn
        device_class: wind_speed
        state_class: measurement
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.tws_kn if p and p.tws_kn is defined else 'unknown' }}
        icon: mdi:windsock

      - name: NMEA Heading Magnetic
        unique_id: nmea_heading_mag_deg
        unit_of_measurement: "°"
        state_class: measurement
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.heading_mag_deg if p and p.heading_mag_deg is defined else 'unknown' }}
        icon: mdi:compass-rose

      # heading_true_deg was already being parsed (HDT sentence) but never
      # exposed as an entity until now -- the instrument's own true heading,
      # not a magnetic+variation computation done here.
      - name: NMEA Heading True
        unique_id: nmea_heading_true_deg
        unit_of_measurement: "°"
        state_class: measurement
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.heading_true_deg if p and p.heading_true_deg is defined else 'unknown' }}
        icon: mdi:compass-rose

      # True wind ANGLE (relative to the bow, motion-corrected) -- MWV
      # reference "T", already parsed alongside TWS above but never exposed.
      # The true-wind equivalent of AWA.
      - name: NMEA TWA
        unique_id: nmea_twa_deg
        unit_of_measurement: "°"
        state_class: measurement
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.twa_deg if p and p.twa_deg is defined else 'unknown' }}
        icon: mdi:angle-acute

      # True wind DIRECTION -- absolute compass bearing (0=true north), MWD
      # sentence, computed by the instrument (heading_true + TWA, confirmed
      # matching live 2026-08-15). This is the real sensor reading the
      # WeatherTWD Grafana dashboard's direction panels use -- not a
      # heading+AWA approximation computed at the dashboard layer.
      - name: NMEA TWD
        unique_id: nmea_twd_deg
        unit_of_measurement: "°"
        state_class: measurement
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.twd_true_deg if p and p.twd_true_deg is defined else 'unknown' }}
        icon: mdi:compass-rose

      - name: NMEA Sentences
        unique_id: nmea_sentence_count
        state: >-
          {{ state_attr('sensor.nmea_gateway_status_json', 'sentence_count') | default(0) }}
        icon: mdi:code-json
        unit_of_measurement: sentences

      # Air/water temp (MTA/MTW, issue #32) -- only populate if the boat's
      # N2K bus actually has these sensors fitted; 'unknown' otherwise is
      # honest, not a bug. See packages/marine_environment.yaml for the
      # Open-Meteo fallback shown when these are unavailable.
      - name: NMEA Air Temperature
        unique_id: nmea_air_temp_c
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.air_temp_c if p and p.air_temp_c is defined else 'unknown' }}
        icon: mdi:thermometer

      - name: NMEA Water Temperature
        unique_id: nmea_water_temp_c
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        state: >-
          {% set p = state_attr('sensor.nmea_gateway_status_json', 'parsed') %}
          {{ p.water_temp_c if p and p.water_temp_c is defined else 'unknown' }}
        icon: mdi:coolant-temperature

# 6h rolling max of true wind speed -- HA's built-in statistics platform,
# same value_max/6h algorithm as always, but reseeded 2026-08-15 (#40) to
# read sensor.nmea_tws_live's recorder history instead of the old
# 15s-polled sensor.nmea_tws -- same computation, a far more complete input
# (the persistent daemon's ~1Hz feed vs the old pipeline's ~15-17s, lossy
# even within its own sample window -- see data_flow.md). Rolling window
# means this needs ~6h of sensor.nmea_tws_live history to fully populate
# after the reseed; short-lived dip in max accuracy while that backfills,
# not a bug.
sensor:
  - platform: statistics
    name: "True Wind Speed Max 6h"
    unique_id: nmea_tws_max_6h
    entity_id: sensor.nmea_tws_live
    state_characteristic: value_max
    max_age:
      hours: 6

  # Short-window gust indicator for the anchor-watch dashboard (WeatherTWD).
  # Reseeded 2026-08-15 (#40) to sensor.nmea_aws_live, same reasoning as
  # above -- AWS is still the raw instrument reading (vs TWS, the
  # instrument's own AWS+SOG+heading correction), just now sourced from the
  # ~1Hz live feed instead of the old 15s poll.
  - platform: statistics
    name: "Apparent Wind Speed Max 10m"
    unique_id: nmea_aws_max_10m
    entity_id: sensor.nmea_aws_live
    state_characteristic: value_max
    max_age:
      minutes: 10
