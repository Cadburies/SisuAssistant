# =============================================================================
# LAB ONLY — map dual-alt simulator → production entity_ids
#
# Goal: Dashboards / automations use the SAME entity_ids as real Marine Boards
#   alternatorport / alternatorstarboard
# while the T8-S3 runs bench-alts-sim.
#
# When real boards are online:
#   1. Delete this file include (or empty this file)
#   2. Restart HA
#   3. Adopt real ESPHome devices (entity_ids match production names)
#   4. Dashboards need NO changes
#
# Source device: bench-alts-sim (ESPHome). If entity_ids differ after adopt,
# fix the `entity_id:` strings below via Developer Tools → States.
# =============================================================================

template:
  # ---- Port sensors ----
  - sensor:
      - default_entity_id: sensor.alternatorport_house_voltage_engine_port
        name: House Voltage · Engine Port
        unique_id: sisu_alias_port_house_v
        unit_of_measurement: V
        device_class: voltage
        state_class: measurement
        state: "{{ states('sensor.lab_bench_alts_sim_house_voltage_engine_port') }}"
        availability: "{{ states('sensor.lab_bench_alts_sim_house_voltage_engine_port') not in ['unavailable','unknown'] }}"

      - default_entity_id: sensor.alternatorport_alternator_current_port
        name: Alternator Current · Port
        unique_id: sisu_alias_port_alt_i
        unit_of_measurement: A
        device_class: current
        state_class: measurement
        state: "{{ states('sensor.lab_bench_alts_sim_alternator_current_port') }}"
        availability: "{{ states('sensor.lab_bench_alts_sim_alternator_current_port') not in ['unavailable','unknown'] }}"

      - default_entity_id: sensor.alternatorport_alternator_power_port
