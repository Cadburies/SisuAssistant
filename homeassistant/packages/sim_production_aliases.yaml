        name: House Float Voltage · Port
        unique_id: sisu_alias_port_float
        unit_of_measurement: V
        min: 12
        max: 14.4
        step: 0.05
        state: "{{ states('number.lab_bench_alts_sim_house_float_voltage_port') }}"
        set_value:
          - action: number.set_value
            target:
              entity_id: number.lab_bench_alts_sim_house_float_voltage_port
            data:
              value: "{{ value }}"
        availability: "{{ states('number.lab_bench_alts_sim_house_float_voltage_port') not in ['unavailable','unknown'] }}"

