<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Compass, north up">
  <circle cx="100" cy="100" r="88" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#8a8a8a" stroke-width="0.75" opacity="0.5"/>
  <!-- 10° ticks -->
  <g stroke="#8a8a8a" stroke-width="1">
    <g id="ticks">
      <line x1="100" y1="14" x2="100" y2="22"/>
      <line x1="100" y1="14" x2="100" y2="20" transform="rotate(10 100 100)"/>
      <line x1="100" y1="14" x2="100" y2="20" transform="rotate(20 100 100)"/>
      <line x1="100" y1="14" x2="100" y2="20" transform="rotate(30 100 100)"/>
      <line x1="100" y1="14" x2="100" y2="20" transform="rotate(40 100 100)"/>
      <line x1="100" y1="14" x2="100" y2="22" transform="rotate(50 100 100)"/>
      <line x1="100" y1="14" x2="100" y2="20" transform="rotate(60 100 100)"/>
      <line x1="100" y1="14" x2="100" y2="20" transform="rotate(70 100 100)"/>
      <line x1="100" y1="14" x2="100" y2="20" transform="rotate(80 100 100)"/>
    </g>
    <use href="#ticks" transform="rotate(90 100 100)"/>
    <use href="#ticks" transform="rotate(180 100 100)"/>
    <use href="#ticks" transform="rotate(270 100 100)"/>
  </g>
  <text x="100" y="12" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#c62828">N</text>
  <text x="188" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#8a8a8a">E</text>
  <text x="100" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#8a8a8a">S</text>
  <text x="12" y="104" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#8a8a8a">W</text>
</svg>
