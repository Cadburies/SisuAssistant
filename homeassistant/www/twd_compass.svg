<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Compass, north up">
  <circle cx="120" cy="120" r="72" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="120" cy="120" r="56" fill="none" stroke="#8a8a8a" stroke-width="0.7" opacity="0.45"/>
  <g stroke="#8a8a8a" stroke-width="1.2">
    <g id="t10">
      <line x1="120" y1="50" x2="120" y2="58"/>
      <line x1="120" y1="50" x2="120" y2="56" transform="rotate(10 120 120)"/>
      <line x1="120" y1="50" x2="120" y2="56" transform="rotate(20 120 120)"/>
      <line x1="120" y1="50" x2="120" y2="58" transform="rotate(30 120 120)"/>
      <line x1="120" y1="50" x2="120" y2="56" transform="rotate(40 120 120)"/>
      <line x1="120" y1="50" x2="120" y2="56" transform="rotate(50 120 120)"/>
      <line x1="120" y1="50" x2="120" y2="58" transform="rotate(60 120 120)"/>
      <line x1="120" y1="50" x2="120" y2="56" transform="rotate(70 120 120)"/>
      <line x1="120" y1="50" x2="120" y2="56" transform="rotate(80 120 120)"/>
    </g>
    <use href="#t10" transform="rotate(90 120 120)"/>
    <use href="#t10" transform="rotate(180 120 120)"/>
    <use href="#t10" transform="rotate(270 120 120)"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">
    <text x="120" y="16" font-size="16" font-weight="700" fill="#c62828">N</text>
    <text x="224" y="120" font-size="15" font-weight="600" fill="#8a8a8a">E</text>
    <text x="120" y="226" font-size="15" font-weight="600" fill="#8a8a8a">S</text>
    <text x="16" y="120" font-size="15" font-weight="600" fill="#8a8a8a">W</text>
    <!-- 30° numerals sit in the gap between ring (r=72) and NESW -->
    <g font-size="15" font-weight="700" fill="#1565c0" stroke="#f5f5f5" stroke-width="3" paint-order="stroke">
      <text x="164" y="44">30</text>
      <text x="196" y="72">60</text>
      <text x="196" y="168">120</text>
      <text x="164" y="196">150</text>
      <text x="76" y="196">210</text>
      <text x="44" y="168">240</text>
      <text x="44" y="72">300</text>
      <text x="76" y="44">330</text>
    </g>
  </g>
