<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Compass, north up">
  <!-- Ring inset so N/E/S/W and 30° labels sit outside it -->
  <circle cx="120" cy="120" r="78" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="120" cy="120" r="62" fill="none" stroke="#8a8a8a" stroke-width="0.7" opacity="0.45"/>
  <g stroke="#8a8a8a" stroke-width="1.2">
    <g id="t10">
      <line x1="120" y1="44" x2="120" y2="52"/>
      <line x1="120" y1="44" x2="120" y2="50" transform="rotate(10 120 120)"/>
      <line x1="120" y1="44" x2="120" y2="50" transform="rotate(20 120 120)"/>
      <line x1="120" y1="44" x2="120" y2="52" transform="rotate(30 120 120)"/>
      <line x1="120" y1="44" x2="120" y2="50" transform="rotate(40 120 120)"/>
      <line x1="120" y1="44" x2="120" y2="50" transform="rotate(50 120 120)"/>
      <line x1="120" y1="44" x2="120" y2="52" transform="rotate(60 120 120)"/>
      <line x1="120" y1="44" x2="120" y2="50" transform="rotate(70 120 120)"/>
      <line x1="120" y1="44" x2="120" y2="50" transform="rotate(80 120 120)"/>
    </g>
    <use href="#t10" transform="rotate(90 120 120)"/>
    <use href="#t10" transform="rotate(180 120 120)"/>
    <use href="#t10" transform="rotate(270 120 120)"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle">
    <text x="120" y="18" font-size="15" font-weight="700" fill="#c62828">N</text>
    <text x="226" y="125" font-size="14" font-weight="600" fill="#8a8a8a">E</text>
    <text x="120" y="234" font-size="14" font-weight="600" fill="#8a8a8a">S</text>
    <text x="14" y="125" font-size="14" font-weight="600" fill="#8a8a8a">W</text>
    <g font-size="11" font-weight="500" fill="#8a8a8a">
      <text x="168" y="41">30</text>
      <text x="203" y="76">60</text>
      <text x="203" y="172">120</text>
      <text x="168" y="207">150</text>
      <text x="72" y="207">210</text>
      <text x="37" y="172">240</text>
      <text x="37" y="76">300</text>
      <text x="72" y="41">330</text>
    </g>
  </g>
</svg>
