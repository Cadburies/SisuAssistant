# F8 target shape (TerraMaster F8, #6) — Signal K + InfluxDB + Grafana.
# Kernel Mosquitto + NMEA ingest stay on HA Green permanently (#51): official
# Supervisor add-on core_mosquitto with logins: for SK / ingest. Do not add a
# second broker here. HA + ESPHome also stay on Green (Supervisor-managed).
#
# Paths are relative to this file so this works on the F8 without a
# hardcoded absolute host path. Rollback compose (not live): docker-compose.mac.yml.
services:
  signalk:
    container_name: signalk-server
    image: "signalk/signalk-server@sha256:da3b8570af1632fe5efbb12abbd53c9892f53360a2bb17df2f7700ac926187d9" # v2.32.0
    volumes:
      - ./signalk:/home/node/.signalk
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/Tortola
    # ports (network_mode: host publishes these on the F8 host directly):
    #   3000   Signal K web interface / KIP (bundled, no separate container)
    #   55555  optional NMEA0183/NMEA2000 data port
  mqtt-explorer:
    container_name: mqtt-explorer
    image: "smeagolworms4/mqtt-explorer@sha256:8c8a92b9727af767d840f484e22499e852203f2987f750ad384c3fc630c8b80b" # build of 2026-09-16
    volumes:
      - ./mqtt-explorer/config:/mqtt-explorer/config
      - ./mqtt-explorer/data:/mqtt-explorer/data
      - ./mqtt-explorer/log:/mqtt-explorer/log
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    network_mode: host
    # Point the saved connection at HA Green 192.168.0.20:1883 (core_mosquitto).
  influxdb:
    container_name: influxdb
    image: "influxdb@sha256:f75e48af0598e8aec7986e991a848d19a119101a7d563a2e5db1dfaac9c45daa" # v2.9.1
    volumes:
      - ./influxdb:/var/lib/influxdb2
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/Tortola
      # First-run auto-setup only — a no-op once the volume already has an
      # org/bucket/token (true today; this just makes a from-scratch F8
      # deploy reproducible instead of a manual UI wizard). Values from
      # homeassistant/.env (gitignored — generate with
      # scripts/gen-docker-env.sh from secrets.yaml).
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    # port (network_mode: host): 8086
  grafana:
    container_name: grafana
    image: "grafana/grafana@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0" # 13.2.2
    volumes:
      - ./grafana:/var/lib/grafana
      - ./grafana-provisioning:/etc/grafana/provisioning:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/Tortola
      - GF_SERVER_HTTP_PORT=3001 # signalk already owns :3000 under host networking
      # First-run admin bootstrap only — a no-op once grafana.db already has
      # an admin account (true today). Same .env as influxdb above.
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      # InfluxDB datasource provisioning (grafana-provisioning/datasources/influxdb.yaml)
      # reads these via Grafana's native $VAR env interpolation. Host uses
      # localhost:8086 here because both containers share the host network
      # (network_mode: host, F8). Rollback Mac compose uses the Docker
      # bridge hostname `influxdb` instead of localhost.
      - INFLUXDB_URL=http://localhost:8086
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      # Org-wide home dashboard (WeatherTWD).
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/sisu-weather-twd.json
    depends_on:
      - influxdb
  # NMEA ingest is sisu-nmea-ingest on HA Green (ha-kernel-mqtt.sh), not F8.
  # Sisu Nav (#76) — host net. tiles volume is read-write (not :ro): #80's
  # dated tile harvester writes into it from inside this same container.
  sisu-nav-api:
    container_name: sisu-nav-api
    build:
      context: ../sisu-nav
      dockerfile: api/Dockerfile
    volumes:
      - ../sisu-nav/tiles:/data/tiles
      # Chart inbox (#108). Override with the USB/NAS circumnavigation folder:
      #   - /share/charts:/data/import:ro
      - ../sisu-nav/tiles/inbox:/data/import
      # Settings panel local key store (#123). Gitignored keys.local.json.
      - ../sisu-nav/api/data:/data/keys
      # Anchor-spot wind roses store (#187) — box runtime state; f8-deploy
      # and stack-drift exclude sisu-nav/state/ (Mac never pushes over it).
      - ../sisu-nav/state:/data/state
      - ./secrets.yaml:/data/boat-secrets/secrets.yaml
      - ./.env:/data/boat-secrets/.env
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/Tortola
      - SISU_TILES_DIR=/data/tiles
      - SISU_NAV_PORT=8088
      - SISU_IMPORT_DIR=/data/import
      - SISU_NAV_HOST=f8
      - SISU_IMPORT_WARN_BYTES=0
      - SISU_SECRETS_YAML=/data/boat-secrets/secrets.yaml
      - SISU_SECRETS_ENV=/data/boat-secrets/.env
      - SISU_KEYS_FILE=/data/keys/keys.local.json
      # Secret-gated harvest providers (#80) — optional, unset by default.
      # Values from homeassistant/.env (gitignored — generate with
      # scripts/gen-docker-env.sh from secrets.yaml). Each provider refuses
      # to run while its key is unset/CHANGE_ME.
      - MAPTILER_API_KEY=${MAPTILER_API_KEY:-}
      - MAXAR_API_KEY=${MAXAR_API_KEY:-}
      - PLANET_API_KEY=${PLANET_API_KEY:-}
      - MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN:-}
      # Live basemap toggles (#116/#126) — Google Map Tiles session + Azure Maps.
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - AZURE_MAPS_SUBSCRIPTION_KEY=${AZURE_MAPS_SUBSCRIPTION_KEY:-}
      # Global AIS overlay (#115) — free signup at aisstream.io
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
      # Wind roses (#86) — read Sisu_1m. Host-net: Influx is localhost:8086.
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-}
      - INFLUXDB_URL=http://127.0.0.1:8086
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      # Signs in as the boat's own SisuMate user (#187) — no service role.
      - SUPABASE_EMAIL=${SUPABASE_EMAIL:-}
      - SUPABASE_PASSWORD=${SUPABASE_PASSWORD:-}
      # Optional boats."supabaseId" when that login reaches several boats.
      - SISU_BOAT_ID=${SISU_BOAT_ID:-}
      - SISU_STATE_DIR=/data/state
    # port (network_mode: host): 8088
  tileserver-gl:
    container_name: tileserver-gl
    image: "maptiler/tileserver-gl@sha256:3a9ccdb24820b6814c8119bcc8a4376c39867cb0ffe69d62919ef898b90c2427" # 5.6.0
    volumes:
      - ../sisu-nav/tiles:/data
      - ../sisu-nav/tileserver/entrypoint.sh:/sisu-entrypoint.sh:ro
      - /etc/localtime:/etc/localtime:ro
    entrypoint: ["/bin/bash", "/sisu-entrypoint.sh"]
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/Tortola
      - TILESERVER_PORT=8087
      - SISU_TILES_DIR=/data
    # port (network_mode: host): 8087
    # Image's baked-in healthcheck (/usr/src/app/src/healthcheck.js) hardcodes
    # localhost:8080/health, not TILESERVER_PORT — always reports unhealthy
    # here despite the service working fine. Override with the real port; the
    # image has no curl/wget, only node, so use its http module directly.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:' + (process.env.TILESERVER_PORT||8080) + '/health', r => process.exit(r.statusCode===200?0:1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
