# Platform: LilyGo S3 AMOLED — freezer DISPLAY only (#221).
# Controller: freezer_marineboard.yaml, name "freezer", .44. This board has no
# probe, relay, or thermostat. It draws the screen from ESP-NOW and, only while
# the HA API is up and ESP-NOW is quiet, from HA. Taps go back over ESP-NOW.
# Plan: MarineBoard/Documentation/Freezer-Replacement-Plan.md
# Full speed or stop. There is no Turbo control.
# HA: "Allow the device to perform Home Assistant actions" is only the fallback.
# Naming: .ai_context/naming.md. Pins: QSPI AMOLED + CST816 I2C 3/2 IRQ 21.
substitutions:
  ctrl: aft_cockpit_sisu_freezer
  climate_id: climate.aft_cockpit_sisu_freezer_freezer_thermostat
  # Same number as freezer_marineboard.yaml. Used only after wifi.disable.
  espnow_channel: "6"

esphome:
  name: "freezer_display"
  friendly_name: Sisu Freezer Display
  comment: Aft Cockpit Freezer display (LilyGo S3 AMOLED)
  area: Aft Cockpit

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

packages:
  diag: !include packages/esp_diag.yaml

api:
  encryption:
    key: !secret freezer_display_api_encryption_key

ota:
  - platform: esphome
    password: !secret freezer_display_ota_password

# WiFi — Sisu-IoT · 192.168.10.47 (keep in sync with secrets esp_ip_freezer_display)
wifi:
  id: wifi_freezer_display
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: "192.168.10.47"
    gateway: "192.168.10.1"
    subnet: "255.255.255.0"
  ap:
    ssid: "Freezer Display Fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  local: true

espnow:
  id: espnow_link
  peers:
    - !secret freezer_peer_mac

packet_transport:
  - platform: espnow
    id: freezer_link
    espnow_id: espnow_link
    peer_address: !secret freezer_peer_mac
    update_interval: 5s
    rolling_code_enable: true
    encryption:
      key: !secret freezer_espnow_key
    providers:
      - name: freezer
        encryption:
          key: !secret freezer_espnow_key
    # req_seq is last so the controller sees the other values first.
    sensors:
      - id: req_target
        broadcast_id: req_target
      - id: req_mode
        broadcast_id: req_mode
      - id: req_level
        broadcast_id: req_level
      - id: req_seq
        broadcast_id: req_seq

spi:
  id: quad_spi
  type: quad
  clk_pin: 47
  data_pins: [18, 7, 48, 5]

i2c:
  sda: 3
  scl: 2

psram:
  mode: octal
  speed: 80MHz

# Landscape 536×240 after rotation:90. CST816T already reports that space.
# Right strip = + / −. Title pill = COOL/OFF. SET line left = freeze/fridge.
# SET line right = protection Low/Med/High. First tap after dim only wakes.
globals:
  - id: tap_x
    type: int16_t
    initial_value: "0"
  - id: tap_y
    type: int16_t
    initial_value: "0"
  - id: last_touch_ms
    type: uint32_t
    initial_value: "0"
  - id: ui_dimmed
    type: bool
    initial_value: "false"
  - id: ignore_next_release
    type: bool
    initial_value: "false"
  - id: pending_target
    type: float
    initial_value: "NAN"
  - id: pending_ms
    type: uint32_t
    initial_value: "0"
  - id: last_espnow_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: req_target_n
    type: float
    initial_value: "NAN"
  - id: req_mode_n
    type: float
    initial_value: "0"
  - id: req_level_n
    type: float
    initial_value: "0"
  - id: wifi_down_s
    type: int
    restore_value: false
    initial_value: "0"
  - id: radio_parked
    type: bool
    restore_value: false
    initial_value: "false"
  - id: radio_busy
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: push_request
    mode: restart
    then:
      - lambda: |-
          id(req_target).publish_state(id(req_target_n));
          id(req_mode).publish_state(id(req_mode_n));
          id(req_level).publish_state(id(req_level_n));
          uint32_t r = (random_uint32() % 999999u) + 1u;
          id(req_seq).publish_state((float) r);
  - id: send_target
    mode: restart
    parameters:
      t: float
    then:
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: ${climate_id}
            hvac_mode: cool
          data_template:
            temperature: "{{ t }}"
          variables:
            t: !lambda "return t;"
  - id: send_mode
    parameters:
      mode: string
    then:
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: ${climate_id}
          data_template:
            hvac_mode: "{{ m }}"
          variables:
            m: !lambda "return mode;"
  - id: send_preset
    parameters:
      preset: string
    then:
      - homeassistant.action:
          action: climate.set_preset_mode
          data:
            entity_id: ${climate_id}
          data_template:
            preset_mode: "{{ p }}"
          variables:
            p: !lambda "return preset;"
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: ${climate_id}
            hvac_mode: cool
  - id: send_protect
    parameters:
      opt: string
    then:
      - homeassistant.action:
          action: select.select_option
          data:
            entity_id: select.${ctrl}_protection
          data_template:
            option: "{{ o }}"
          variables:
            o: !lambda "return opt;"
  - id: park_radio
    mode: single
    then:
      - lambda: "id(radio_busy) = true;"
      - wifi.disable:
      - delay: 500ms
      - espnow.set_channel: ${espnow_channel}
      - lambda: |-
          id(radio_parked) = true;
          id(radio_busy) = false;
      - logger.log: "ESP-NOW on fixed channel, Wi-Fi off"
  - id: try_wifi
    mode: single
    then:
      - lambda: "id(radio_busy) = true;"
      - wifi.enable:
      - delay: 25s
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: |-
                id(radio_parked) = false;
                id(wifi_down_s) = 0;
                id(radio_busy) = false;
          else:
            - wifi.disable:
            - delay: 500ms
            - espnow.set_channel: ${espnow_channel}
            - lambda: |-
                id(radio_parked) = true;
                id(wifi_down_s) = 30;
                id(radio_busy) = false;

touchscreen:
  - platform: cst816
    id: my_touchscreen
    interrupt_pin:
      number: 21
    on_touch:
      then:
        - lambda: |-
            id(tap_x) = touch.x;
            id(tap_y) = touch.y;
            id(last_touch_ms) = millis();
            if (id(ui_dimmed)) {
              id(ui_dimmed) = false;
              id(ignore_next_release) = true;
              id(main_lcd).set_brightness(0xD0);
            }
    on_release:
      then:
        - lambda: |-
            if (id(ignore_next_release)) {
              id(ignore_next_release) = false;
              return;
            }
            const bool now_up = id(last_espnow_ms) != 0 && millis() - id(last_espnow_ms) < 10000;
            const bool ha_up = api::global_api_server != nullptr && api::global_api_server->is_connected();
            const bool ha_ctrl = ha_up && id(ctrl_online).has_state() && id(ctrl_online).state;
            if (!now_up && !ha_ctrl) return;
            const int16_t x = id(tap_x);
            const int16_t y = id(tap_y);
            const bool pending = !isnan(id(pending_target)) && millis() - id(pending_ms) < 5000;
            float cur = NAN;
            if (pending) cur = id(pending_target);
            else if (now_up && id(rx_target).has_state()) cur = id(rx_target).state;
            else if (id(ha_target).has_state()) cur = id(ha_target).state;
            bool mode_cool = true;
            if (now_up && id(rx_mode).has_state() && !isnan(id(rx_mode).state))
              mode_cool = id(rx_mode).state > 0.5f;
            else if (!now_up)
              mode_cool = id(ha_mode).state != "off";
            int level = 0;
            if (now_up && id(rx_level).has_state() && !isnan(id(rx_level).state))
              level = (int) id(rx_level).state;
            else if (id(ha_protect).has_state()) {
              if (id(ha_protect).state == "High") level = 2;
              else if (id(ha_protect).state == "Med") level = 1;
            }
            bool send = false;
            if (x >= 400) {
              if (isnan(cur)) return;
              cur += (y < 120) ? 1.0f : -1.0f;
              if (cur < -30.0f) cur = -30.0f;
              if (cur > 20.0f) cur = 20.0f;
              mode_cool = true;
              id(pending_target) = cur;
              id(pending_ms) = millis();
              send = true;
            } else if (x >= 250 && y < 40) {
              mode_cool = !mode_cool;
              send = true;
            } else if (x >= 250 && y >= 145 && y < 195) {
              level = (level + 1) % 3;
              send = true;
            } else if (x < 250 && y >= 145 && y < 195) {
              cur = (isnan(cur) || cur > 0.0f) ? -5.0f : 4.0f;
              mode_cool = true;
              id(pending_target) = cur;
              id(pending_ms) = millis();
              send = true;
            }
            if (!send) return;
            id(req_target_n) = cur;
            id(req_mode_n) = mode_cool ? 1.0f : 0.0f;
            id(req_level_n) = level;
            id(push_request).execute();
            if (!now_up) {
              const char *opt = level >= 2 ? "High" : level == 1 ? "Med" : "Low";
              if (mode_cool && !isnan(cur)) id(send_target).execute(cur);
              else id(send_mode).execute(std::string("off"));
              id(send_protect).execute(std::string(opt));
            }
            id(main_lcd).update();

display:
  - platform: mipi_spi
    model: t-display-s3-amoled
    id: main_lcd
    cs_pin: 6
    reset_pin: 17
    enable_pin: 38
    rotation: 90
    brightness: 0xD0
    update_interval: 1s
    lambda: |-
      const Color col_fg(0xE8E8E8);
      const Color col_cool(0x05C9F5);
      const Color col_ok(0x8AC926);
      const Color col_warn(0xF5A005);
      const Color col_alarm(0xF51905);
      const Color col_mute(0x6A6A6A);
      const bool now_up = id(last_espnow_ms) != 0 && millis() - id(last_espnow_ms) < 10000;
      const bool ha_up = api::global_api_server != nullptr && api::global_api_server->is_connected();
      const bool ha_ctrl = ha_up && id(ctrl_online).has_state() && id(ctrl_online).state;
      const bool linked = now_up || ha_ctrl;
      const float temp = now_up ? id(rx_temp).state : id(ha_temp).state;
      const bool probe_fail = now_up ? id(rx_probe).state : id(ha_probe_fail).state;
      const bool probe_ok = linked && !probe_fail && !isnan(temp);
      const bool cooling = now_up ? id(rx_run).state : id(ha_compressor).state;
      const bool clim_off = now_up ? (id(rx_mode).has_state() && id(rx_mode).state < 0.5f)
                                   : (id(ha_mode).state == "off");
      const bool pending = !isnan(id(pending_target)) && millis() - id(pending_ms) < 5000;
      float tgt = NAN;
      if (pending) tgt = id(pending_target);
      else if (now_up && id(rx_target).has_state()) tgt = id(rx_target).state;
      else if (id(ha_target).has_state()) tgt = id(ha_target).state;
      const bool fridge = !isnan(tgt) && tgt > 0.0f;
      int level = 0;
      if (now_up && id(rx_level).has_state() && !isnan(id(rx_level).state))
        level = (int) id(rx_level).state;
      else if (ha_ctrl && id(ha_protect).has_state()) {
        if (id(ha_protect).state == "High") level = 2;
        else if (id(ha_protect).state == "Med") level = 1;
      }
      const char *level_s = level >= 2 ? "HIGH" : level == 1 ? "MED" : "LOW";
      int fault = 0;
      if (now_up && id(rx_fault).has_state() && !isnan(id(rx_fault).state))
        fault = (int) id(rx_fault).state;
      else if (ha_ctrl && id(ha_fault).has_state() && !isnan(id(ha_fault).state))
        fault = (int) id(ha_fault).state;
      const char *fault_s = "OK";
      if (fault == 1) fault_s = "BATT";
      else if (fault == 2) fault_s = "FAN";
      else if (fault == 3) fault_s = "START";
      else if (fault == 4) fault_s = "SPEED";
      else if (fault == 5) fault_s = "HOT";
      const bool batt_cut = now_up ? id(rx_batt).state : (ha_ctrl && id(ha_battery_low).state);
      const float volts = now_up ? id(rx_volts).state : id(ha_battery_v).state;

      it.printf(8, 6, id(font_label), col_mute, TextAlign::TOP_LEFT, "FREEZER");
      if (now_up)
        it.printf(130, 6, id(font_label), col_ok, TextAlign::TOP_LEFT, "NOW");
      else if (ha_ctrl)
        it.printf(130, 6, id(font_label), col_cool, TextAlign::TOP_LEFT, "HA");
      else
        it.printf(130, 6, id(font_label), col_alarm, TextAlign::TOP_LEFT, "NO LINK");
      if (!linked)
        it.printf(250, 6, id(font_label), col_mute, TextAlign::TOP_LEFT, "--");
      else if (clim_off)
        it.printf(250, 6, id(font_label), col_mute, TextAlign::TOP_LEFT, "OFF");
      else
        it.printf(250, 6, id(font_label), col_cool, TextAlign::TOP_LEFT, "COOL");

      if (!linked)
        it.printf(12, 130, id(font_temp), col_mute, TextAlign::BASELINE_LEFT, "--");
      else if (!probe_ok)
        it.printf(12, 120, id(font_temp), col_warn, TextAlign::BASELINE_LEFT, "NO PROBE");
      else {
        it.printf(12, 130, id(font_temp), col_fg, TextAlign::BASELINE_LEFT, "%.1f", temp);
        it.printf(210, 130, id(font_unit), col_mute, TextAlign::BASELINE_LEFT, "C");
      }

      const char *preset = fridge ? "FRIDGE" : "FREEZE";
      if (!linked || isnan(tgt))
        it.printf(12, 168, id(font_mid), col_mute, TextAlign::BASELINE_LEFT, "SET --");
      else
        it.printf(12, 168, id(font_mid), pending ? col_cool : col_fg, TextAlign::BASELINE_LEFT,
                  "SET %.0f  %s", tgt, preset);
      if (linked)
        it.printf(300, 168, id(font_label), col_fg, TextAlign::BASELINE_LEFT, "%s", level_s);

      if (!linked)
        it.printf(12, 214, id(font_mid), col_mute, TextAlign::BASELINE_LEFT, "NO CTRL");
      else if (fault >= 1 && fault <= 5)
        it.printf(12, 214, id(font_mid), col_alarm, TextAlign::BASELINE_LEFT, "FAULT %d %s", fault, fault_s);
      else if (batt_cut)
        it.printf(12, 214, id(font_mid), col_alarm, TextAlign::BASELINE_LEFT, "BAT HOLD");
      else if (cooling)
        it.printf(12, 214, id(font_mid), col_cool, TextAlign::BASELINE_LEFT, probe_ok ? "COOLING" : "MANUAL");
      else if (clim_off)
        it.printf(12, 214, id(font_mid), col_mute, TextAlign::BASELINE_LEFT, "OFF");
      else if (!probe_ok)
        it.printf(12, 214, id(font_mid), col_warn, TextAlign::BASELINE_LEFT, "WAITING");
      else
        it.printf(12, 214, id(font_mid), col_ok, TextAlign::BASELINE_LEFT, "IDLE");
      if (linked && !isnan(volts)) {
        const Color bv = batt_cut ? col_alarm : col_mute;
        it.printf(250, 214, id(font_label), bv, TextAlign::BASELINE_LEFT, "%.1fV", volts);
      }

      it.filled_rectangle(400, 0, 136, 240, Color(0x141414));
      it.line(400, 120, 535, 120, Color(0x2A2A2A));
      it.printf(468, 70, id(font_btn), col_ok, TextAlign::CENTER, "+");
      it.printf(468, 190, id(font_btn), col_warn, TextAlign::CENTER, "-");

font:
  - file: "gfonts://Roboto"
    id: font_temp
    size: 72
  - file: "gfonts://Roboto"
    id: font_unit
    size: 36
  - file: "gfonts://Roboto"
    id: font_mid
    size: 28
  - file: "gfonts://Roboto"
    id: font_label
    size: 22
  - file: "gfonts://Roboto"
    id: font_btn
    size: 56

sensor:
  - platform: template
    id: req_target
    internal: true
    update_interval: never
    lambda: "return id(req_target_n);"
  - platform: template
    id: req_mode
    internal: true
    update_interval: never
    lambda: "return id(req_mode_n);"
  - platform: template
    id: req_level
    internal: true
    update_interval: never
    lambda: "return id(req_level_n);"
  - platform: template
    id: req_seq
    internal: true
    update_interval: never
    lambda: "return 0.0f;"
  - platform: packet_transport
    provider: freezer
    remote_id: cabinet_c
    id: rx_temp
    internal: true
    unit_of_measurement: "°C"
  - platform: packet_transport
    provider: freezer
    remote_id: target_c
    id: rx_target
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!isnan(id(pending_target)) && fabsf(x - id(pending_target)) < 0.05f)
              id(pending_target) = NAN;
  - platform: packet_transport
    provider: freezer
    remote_id: mode_n
    id: rx_mode
    internal: true
  - platform: packet_transport
    provider: freezer
    remote_id: volts
    id: rx_volts
    internal: true
  - platform: packet_transport
    provider: freezer
    remote_id: level_n
    id: rx_level
    internal: true
  - platform: packet_transport
    provider: freezer
    remote_id: fault_n
    id: rx_fault
    internal: true
  - platform: packet_transport
    provider: freezer
    remote_id: hb
    id: rx_hb
    internal: true
    on_value:
      then:
        - lambda: "id(last_espnow_ms) = millis();"
  - platform: homeassistant
    id: ha_temp
    entity_id: sensor.${ctrl}_freezer_temperature
    internal: true
  - platform: homeassistant
    id: ha_target
    entity_id: ${climate_id}
    attribute: temperature
    internal: true
    on_value:
      then:
        - lambda: |-
            if (!isnan(id(pending_target)) && fabsf(x - id(pending_target)) < 0.05f)
              id(pending_target) = NAN;
  - platform: homeassistant
    id: ha_battery_v
    entity_id: sensor.${ctrl}_battery_voltage
    internal: true
  - platform: homeassistant
    id: ha_fault
    entity_id: sensor.${ctrl}_fault_code
    internal: true

text_sensor:
  - platform: homeassistant
    id: ha_mode
    entity_id: ${climate_id}
    internal: true
  - platform: homeassistant
    id: ha_protect
    entity_id: select.${ctrl}_protection
    internal: true

binary_sensor:
  - platform: packet_transport
    provider: freezer
    remote_id: run
    id: rx_run
    internal: true
  - platform: packet_transport
    provider: freezer
    remote_id: probe_fail
    id: rx_probe
    internal: true
  - platform: packet_transport
    provider: freezer
    remote_id: batt_cut
    id: rx_batt
    internal: true
  - platform: homeassistant
    id: ha_compressor
    entity_id: switch.${ctrl}_freezer_compressor
    internal: true
  - platform: homeassistant
    id: ha_probe_fail
    entity_id: binary_sensor.${ctrl}_ds18b20_status
    internal: true
  - platform: homeassistant
    id: ha_battery_low
    entity_id: binary_sensor.${ctrl}_battery_low
    internal: true
  - platform: homeassistant
    id: ctrl_online
    entity_id: binary_sensor.source_freezer
    internal: true

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!id(ui_dimmed) && (millis() - id(last_touch_ms) > 60000)) {
            id(ui_dimmed) = true;
            id(main_lcd).set_brightness(0x18);
          }
  - interval: 5s
    then:
      - lambda: |-
          if (id(radio_busy)) return;
          if (id(wifi_freezer_display).is_connected()) {
            id(wifi_down_s) = 0;
            id(radio_parked) = false;
            return;
          }
          id(wifi_down_s) += 5;
          if (!id(radio_parked) && id(wifi_down_s) >= 30) id(park_radio).execute();
          else if (id(radio_parked) && id(wifi_down_s) >= 180) id(try_wifi).execute();
