esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: ${alternator_side} Alternator Controller
  area: ${area_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

logger:
  level: INFO

api:
  encryption:
    key: ${api_encryption_key}

ota:
  - platform: esphome
    password: ${ota_password}

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: "${friendly_name} Fallback"
    password: ${ap_password}

captive_portal:

web_server:
  port: 80
  local: true

i2c:
  sda: GPIO08
  scl: GPIO05
  scan: true
  id: bus_a
ads1115:
  - address: 0x48
    continuous_mode: on

one_wire:
  - platform: gpio
    pin: GPIO15
    id: onew_alt_temp

sensor:
  - platform: dallas_temp
    one_wire_id: onew_alt_temp
    name: "Alt Temperature ${alternator_side}"
    id: alt_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 2s
    filters:
      - offset: 0.0
      - multiply: 1.0
  - platform: ads1115
    name: "BattV ${alternator_side}"
    id: battery_voltage
    multiplexer: "A0_GND"
    gain: 6.144
    filters:
      - multiply: 6
    unit_of_measurement: "V"
  - platform: ads1115
    name: "ShuntV ${alternator_side}"
    id: shunt_voltage
    multiplexer: "A1_GND"
    gain: 0.256
    update_interval: 2s
    unit_of_measurement: "V"
  - platform: template
    name: "Alternator Current ${alternator_side}"
    id: alt_current
    lambda: |-
      if (${test_mode} == "true") {
        return 0.037 * 5333.33;  // Test mode: ~197A
      } else {
        return id(shunt_voltage).state * 5333.33;  // Production: 75mV / 400A
      }
    update_interval: 2s
    unit_of_measurement: A
    accuracy_decimals: 1
  - platform: template
    name: "PWM Duty Cycle ${alternator_side}"
    id: pwm_duty_cycle
    lambda: |-
      if (std::isnan(id(last_pwm))) {
        return 0.0;
      }
      return id(last_pwm) * 100.0;
    update_interval: 2000ms
    unit_of_measurement: "%"
    accuracy_decimals: 2
  - platform: template
    name: "Temp Limit ${alternator_side}"
    id: temp_limit
    lambda: |-
      return id(temp_hysteresis_active) ? 1.0 : 0.0;
    update_interval: 2s
    unit_of_measurement: ""
    accuracy_decimals: 2

text_sensor:
  - platform: template
    name: "Alternator Error Message ${alternator_side}"
    id: error_message
    update_interval: 2s
    lambda: |-
      return id(error_message).state;

switch:
  - platform: output
    name: "Status LED ${alternator_side}"
    output: status_led_pin
    id: status_led
    restore_mode: RESTORE_DEFAULT_OFF

output:
  - platform: gpio
    pin: GPIO17
    id: status_led_pin
    inverted: false
  - platform: ledc
    pin: GPIO14
    id: field_pwm
    frequency: 16000 Hz
    max_power: 1.0

number:
  - platform: template
    name: "Current Setpoint ${alternator_side}"
    id: current_setpoint
    min_value: 0
    max_value: 250
    step: 1
    unit_of_measurement: A
    optimistic: true
    restore_value: true
    initial_value: 150
  - platform: template
    name: "Temperature Setpoint ${alternator_side}"
    id: temp_setpoint
    min_value: 0
    max_value: 110
    step: 1
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    initial_value: 80

globals:
  - id: pid_integral
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: pid_last_error
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: last_pwm
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: temp_hysteresis_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: is_error
    type: bool
    restore_value: false
    initial_value: "false"
  - id: is_warning
    type: bool
    restore_value: false
    initial_value: "false"
  - id: led_mode
    type: int
    restore_value: false
    initial_value: "0" # 0: heartbeat, 1: long blink, 2: two short blinks, 3: three short blinks
  - id: led_state
    type: bool
    restore_value: false
    initial_value: "false"
  - id: led_last_toggle
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: blink_step
    type: int
    restore_value: false
    initial_value: "0"

interval:
  - interval: 50ms
    then:
      lambda: |-
        uint32_t now = millis();
        uint32_t elapsed = now - id(led_last_toggle);

        if (id(led_mode) == 0) { // Heartbeat: 50ms on, 950ms off
          if (id(led_state) && elapsed >= 50) {
            id(led_state) = false;
            id(status_led).turn_off();
            id(led_last_toggle) = now;
          } else if (!id(led_state) && elapsed >= 950) {
            id(led_state) = true;
            id(status_led).turn_on();
            id(led_last_toggle) = now;
          }
        } else if (id(led_mode) == 1) { // Long blink: 500ms on, 500ms off
          if (elapsed >= 500) {
            id(led_state) = !id(led_state);
            if (id(led_state)) {
              id(status_led).turn_on();
            } else {
              id(status_led).turn_off();
            }
            id(led_last_toggle) = now;
          }
        } else if (id(led_mode) == 2) { // Two short blinks: 100ms on, 100ms off, 100ms on, 700ms off
          if (id(blink_step) == 0 && elapsed >= 100 && id(led_state)) { // End first on
            id(led_state) = false;
            id(status_led).turn_off();
            id(blink_step) = 1;
            id(led_last_toggle) = now;
          } else if (id(blink_step) == 1 && elapsed >= 100 && !id(led_state)) { // Start second on
            id(led_state) = true;
            id(status_led).turn_on();
            id(blink_step) = 2;
            id(led_last_toggle) = now;
          } else if (id(blink_step) == 2 && elapsed >= 100 && id(led_state)) { // End second on
            id(led_state) = false;
            id(status_led).turn_off();
            id(blink_step) = 3;
            id(led_last_toggle) = now;
          } else if (id(blink_step) == 3 && elapsed >= 700 && !id(led_state)) { // Start cycle again
            id(led_state) = true;
            id(status_led).turn_on();
            id(blink_step) = 0;
            id(led_last_toggle) = now;
          }
        } else if (id(led_mode) == 3) { // Three short blinks: 100ms on, 100ms off, 100ms on, 100ms off, 100ms on, 600ms off
          if (id(blink_step) == 0 && elapsed >= 100 && id(led_state)) { // End first on
            id(led_state) = false;
            id(status_led).turn_off();
            id(blink_step) = 1;
            id(led_last_toggle) = now;
          } else if (id(blink_step) == 1 && elapsed >= 100 && !id(led_state)) { // Start second on
            id(led_state) = true;
            id(status_led).turn_on();
            id(blink_step) = 2;
            id(led_last_toggle) = now;
          } else if (id(blink_step) == 2 && elapsed >= 100 && id(led_state)) { // End second on
            id(led_state) = false;
            id(status_led).turn_off();
            id(blink_step) = 3;
            id(led_last_toggle) = now;
          } else if (id(blink_step) == 3 && elapsed >= 100 && !id(led_state)) { // Start third on
            id(led_state) = true;
            id(status_led).turn_on();
            id(blink_step) = 4;
            id(led_last_toggle) = now;
          } else if (id(blink_step) == 4 && elapsed >= 100 && id(led_state)) { // End third on
            id(led_state) = false;
            id(status_led).turn_off();
            id(blink_step) = 5;
            id(led_last_toggle) = now;
          } else if (id(blink_step) == 5 && elapsed >= 600 && !id(led_state)) { // Start cycle again
            id(led_state) = true;
            id(status_led).turn_on();
            id(blink_step) = 0;
            id(led_last_toggle) = now;
          }
        }
  - interval: 2000ms
    then:
      lambda: |-
        constexpr float Kp = 0.01f, Ki = 0.001f, Kd = 0.005f;
        constexpr float hysteresis_band = 2.0f;

        float current = id(alt_current).state;
        float target_current = id(current_setpoint).state;
        float temp = id(alt_temp).state;
        float temp_setpoint_val = id(temp_setpoint).state;
        float pwm_duty = id(last_pwm);
        char buffer[64] = "Stopped";

        id(is_error) = false;
        id(is_warning) = false;

        // Invalid sensors
        if (std::isnan(current) || std::isnan(temp) || std::isnan(target_current) || std::isnan(temp_setpoint_val)) {
          id(field_pwm).set_level(0.0f);
          id(last_pwm) = 0.0f;
          id(pid_integral) = 0.0f;
          id(temp_hysteresis_active) = false;
          id(is_error) = true;
          id(led_mode) = 3; // Three short blinks
          snprintf(buffer, sizeof(buffer), "Invalid sensor data: current=%.1f, temp=%.1f", current, temp);
          id(error_message).publish_state(buffer);
          ESP_LOGW("alternator_${alternator_side}", "%s", buffer);
          return;
        }

        // Safety conditions
        if (current > 250.0f || temp > 110.0f) {
          id(field_pwm).set_level(0.0f);
          id(last_pwm) = 0.0f;
          id(pid_integral) = 0.0f;
          id(temp_hysteresis_active) = false;
          id(is_error) = true;
          id(led_mode) = 3; // Three short blinks
          snprintf(buffer, sizeof(buffer), "Safety triggered: current=%.1f A, temp=%.1f C", current, temp);
          id(error_message).publish_state(buffer);
          ESP_LOGW("alternator_${alternator_side}", "%s", buffer);
          return;
        }

        // Temperature warning
        if (temp > temp_setpoint_val && temp <= temp_setpoint_val + hysteresis_band) {
          id(is_warning) = true;
          id(led_mode) = 2; // Two short blinks
          snprintf(buffer, sizeof(buffer), "Temperature warning: temp=%.1f C, setpoint=%.1f C", temp, temp_setpoint_val);
          id(error_message).publish_state(buffer);
          ESP_LOGW("alternator_${alternator_side}", "%s", buffer);
        }

        // Hysteresis
        if (temp > temp_setpoint_val + hysteresis_band) {
          pwm_duty = std::max(0.0f, pwm_duty - 0.05f);
          if (pwm_duty != id(last_pwm)) {
            id(field_pwm).set_level(pwm_duty);
            id(last_pwm) = pwm_duty;
          }
          id(temp_hysteresis_active) = true;
          id(pid_integral) = 0.0f;
          id(is_warning) = true;
          id(led_mode) = 2; // Two short blinks
          snprintf(buffer, sizeof(buffer), "Hysteresis active: temp=%.1f C, setpoint=%.1f C, PWM: %.2f%%", temp, temp_setpoint_val, pwm_duty * 100.0f);
          id(error_message).publish_state(buffer);
          ESP_LOGW("alternator_${alternator_side}", "%s", buffer);
          return;
        }

        // Clear hysteresis
        if (temp < temp_setpoint_val - hysteresis_band && id(temp_hysteresis_active)) {
          id(temp_hysteresis_active) = false;
          snprintf(buffer, sizeof(buffer), "Hysteresis cleared: temp=%.1f C, setpoint=%.1f C, PWM: %.2f%%", temp, temp_setpoint_val, pwm_duty * 100.0f);
          id(error_message).publish_state(buffer);
          ESP_LOGI("alternator_${alternator_side}", "%s", buffer);
        }

        // PID control
        if (!id(temp_hysteresis_active)) {
          float error = target_current - current;
          id(pid_integral) = esphome::clamp(id(pid_integral) + error * 0.1f, -100.0f, 100.0f);
          float derivative = (error - id(pid_last_error)) * 10.0f;
          id(pid_last_error) = error;
          pwm_duty = esphome::clamp(pwm_duty + (Kp * error + Ki * id(pid_integral) + Kd * derivative), 0.0f, 1.0f);
          if (pwm_duty != id(last_pwm)) {
            id(field_pwm).set_level(pwm_duty);
            id(last_pwm) = pwm_duty;
          }
        }

        // Normal operation
        if (!id(is_error) && !id(is_warning)) {
          if (pwm_duty > 0.0f) {
            id(led_mode) = 1; // Long blink
            snprintf(buffer, sizeof(buffer), "Running Normal: current=%.1f A, temp=%.1f C, PWM: %.2f%%", current, temp, pwm_duty * 100.0f);
          } else {
            id(led_mode) = 0; // Heartbeat
            snprintf(buffer, sizeof(buffer), "Stopped: current=%.1f A, temp=%.1f C", current, temp);
          }
          id(error_message).publish_state(buffer);
        }

        ESP_LOGI("alternator_${alternator_side}", "ShuntV: %.3f V, Current: %.1f A, Temp: %.1f C, PWM: %.2f%%, Setpoint: %.1f A, Hysteresis: %d, Error: %d, Warning: %d, Message: %s, LED Mode: %d",
                 id(shunt_voltage).state, current, temp, pwm_duty * 100.0f, target_current, id(temp_hysteresis_active), id(is_error), id(is_warning), buffer, id(led_mode));
