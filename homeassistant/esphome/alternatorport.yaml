# Port alternator entrypoint — 192.168.10.41
# packages: board base + alternator role
substitutions:
  device_name: alternatorport
  friendly_name: Alternator Port
  area_name: Engine Port
  side_label: Port
  loc_label: Engine Port
  sk_side: port
  static_ip: "192.168.10.41"
  # Issue #16: other side's HA entities (telemetry pipe for the share cap).
  peer_current_entity: sensor.alternatorstarboard_alternator_current_starboard
  peer_online_entity: binary_sensor.sisu_alternatorstarboard_online

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Alternator Port (Marine Board)
  area: ${area_name}
  on_boot:
    priority: 600
    then:
      - output.turn_off: alt_field_out
      - output.turn_off: sys_buzz_out

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    # Hung loop (I2C/PID stall) trips the task WDT → panic reset.
    # GPIO38 field is forced off on boot (on_boot below); a reset therefore
    # returns to field=0 rather than a stuck PWM. Brownout detector is the
    # ESP32 default — reset_reason text_sensor makes BROWN-OUT visible in HA.
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_EN: y
      CONFIG_ESP_TASK_WDT_INIT: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "8"
      CONFIG_ESP_TASK_WDT_PANIC: y
      CONFIG_ESP_BROWNOUT_DET: y

packages:
  board: !include packages/marine_board_base.yaml
  diag: !include packages/esp_diag.yaml
  alt: !include packages/marine_alternator.yaml
