# =============================================================================
# Shared Sisu Marine Board base (ESP32-S3-WROOM-2-N32R16V)
# Used by alternators + levels via packages: — NOT by LilyGo freezer.
#
# Required substitutions:
#   device_name, friendly_name, static_ip, loc_label
#
# Does NOT define U2 INA226 — each role package owns 0x40 (alt needs alt_i
# on the same chip; levels need house diagnostics). Both use id: house_v.
# =============================================================================

logger:
  level: INFO

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: ${static_ip}
    gateway: "192.168.10.1"
    subnet: "255.255.255.0"
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

binary_sensor:
  - platform: status
    name: "Status · ${loc_label}"

web_server:
  port: 80
  local: true

i2c:
  sda: GPIO40
  scl: GPIO41
  scan: true
  id: i2c_bus
  frequency: 100kHz

output:
  - platform: gpio
    pin: GPIO1
    id: sys_led_out
    inverted: false
  - platform: gpio
    pin: GPIO2
    id: sys_buzz_out
    inverted: false

switch:
  - platform: output
    name: "Status LED · ${loc_label}"
    output: sys_led_out
    id: sys_led
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: output
    name: "Buzzer · ${loc_label}"
    output: sys_buzz_out
    id: sys_buzz
    restore_mode: ALWAYS_OFF

sensor:
  - platform: wifi_signal
    name: "WiFi Signal · ${loc_label}"
    id: wifi_rssi
    update_interval: 60s
    entity_category: diagnostic
