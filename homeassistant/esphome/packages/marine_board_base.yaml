# =============================================================================
# Shared Sisu Marine Board base (ESP32-S3-WROOM-2-N32R16V)
# Used by alternators + levels via packages: — NOT by LilyGo freezer.
#
# Required substitutions:
#   device_name, friendly_name, static_ip, loc_label
#
# Does NOT define U2 INA226 — each role package owns 0x40 (alt needs alt_i
# on the same chip; levels need house diagnostics). Both use id: house_v.
# =============================================================================

logger:
  level: INFO

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: ${static_ip}
    gateway: "192.168.10.1"
    subnet: "255.255.255.0"
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

binary_sensor:
  - platform: status
    name: "Status · ${loc_label}"

web_server:
  port: 80
  local: true

i2c:
  sda: GPIO40
  scl: GPIO41
  scan: true
  id: i2c_bus
  frequency: 100kHz

output:
  - platform: gpio
    pin: GPIO1
    id: sys_led_out
    inverted: false
  # GPIO2 buzzer: PWM, not a static high. How to use:
  #   YAML/HA — switch "Buzzer" on/off; number "Buzzer tone Hz" to pick pitch
  #   lambda   — id(sys_buzz_out).update_frequency(hz); id(sys_buzz).turn_on/off();
  #   scripts  — id(buzz_on).execute(hz);  id(buzz_off).execute();
  # Distinct pitches = distinct alerts (see marine_alternator.yaml warn vs fault).
  - platform: ledc
    pin: GPIO2
    id: sys_buzz_out
    frequency: 4000 Hz

switch:
  - platform: output
    name: "Status LED · ${loc_label}"
    output: sys_led_out
    id: sys_led
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Buzzer · ${loc_label}"
    id: sys_buzz
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - output.set_level:
          id: sys_buzz_out
          level: 0.5
    turn_off_action:
      - output.set_level:
          id: sys_buzz_out
          level: 0.0

number:
  - platform: template
    name: "Buzzer tone Hz · ${loc_label}"
    id: sys_buzz_hz
    min_value: 500
    max_value: 8000
    step: 100
    initial_value: 4000
    optimistic: true
    restore_value: false
    unit_of_measurement: "Hz"
    mode: box
    entity_category: diagnostic
    set_action:
      - output.ledc.set_frequency:
          id: sys_buzz_out
          frequency: !lambda "return x;"

script:
  - id: buzz_on
    parameters:
      freq: float
    then:
      - output.ledc.set_frequency:
          id: sys_buzz_out
          frequency: !lambda "return freq;"
      - output.set_level:
          id: sys_buzz_out
          level: 0.5
  - id: buzz_off
    then:
      - output.set_level:
          id: sys_buzz_out
          level: 0.0

sensor:
  - platform: wifi_signal
    name: "WiFi Signal · ${loc_label}"
    id: wifi_rssi
    update_interval: 60s
    entity_category: diagnostic
