# =============================================================================
# Shared Sisu Marine Board base (ESP32-S3-WROOM-2-N32R16V)
# Used by alternators, levels and freezer_marineboard via packages:
# (NOT by the LilyGo freezer.yaml).
#
# Required substitutions:
#   device_name, friendly_name, static_ip, loc_label
#
# Does NOT define U2 INA226 — each role package owns 0x40 (alt needs alt_i
# on the same chip; levels need house diagnostics). Both use id: house_v.
# =============================================================================

# Logger/debug live in packages/esp_diag.yaml (included next to this file
# from each device YAML) — UART off + runtime 0–3 + reset reason (#134/#133).

api:

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: ${static_ip}
    gateway: "192.168.10.1"
    subnet: "255.255.255.0"
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

captive_portal:

binary_sensor:
  - platform: status
    name: "Status · ${loc_label}"

web_server:
  port: 80
  local: true

i2c:
  sda: GPIO40
  scl: GPIO41
  scan: true
  id: i2c_bus
  frequency: 100kHz

# GPIO1 status LED = WS2812B-2020-V6 (D5, board v1.9+). Roles drive it through
# the "Status LED" switch below after setting id(sys_led_color) (0xRRGGBB) and
# id(sys_led_owner) = true; unowned boards get the heartbeat in interval:.
# v1.8 boards (plain LED on GPIO1) just show a dim flicker — no harm.
light:
  - platform: esp32_rmt_led_strip
    id: sys_rgb
    internal: true
    pin: GPIO1
    num_leds: 1
    rgb_order: GRB
    # D5 datasheet window is tighter than the ws2812 preset: T0H 220–380 ns,
    # T0L/T1H/T1L 580–1000 ns, cycle ≥ 1.25 µs, reset ≥ 280 µs.
    bit0_high: 300ns
    bit0_low: 950ns
    bit1_high: 750ns
    bit1_low: 700ns
    reset_low: 300us
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

globals:
  - id: sys_led_color
    type: uint32_t
    restore_value: false
    initial_value: "0x00FF00"
  - id: sys_led_owner
    type: bool
    restore_value: false
    initial_value: "false"

output:
  # GPIO2 buzzer: PWM, not a static high. How to use:
  #   YAML/HA — switch "Buzzer" on/off; number "Buzzer tone Hz" to pick pitch
  #   lambda   — id(sys_buzz_out).update_frequency(hz); id(sys_buzz).turn_on/off();
  #   scripts  — id(buzz_on).execute(hz);  id(buzz_off).execute();
  # Distinct pitches = distinct alerts (see marine_alternator.yaml warn vs fault).
  - platform: ledc
    pin: GPIO2
    id: sys_buzz_out
    frequency: 4000 Hz

switch:
  # On = light D5 in id(sys_led_color) at the "Status LED brightness" level.
  - platform: template
    name: "Status LED · ${loc_label}"
    id: sys_led
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - light.turn_on:
          id: sys_rgb
          transition_length: 0s
          brightness: !lambda "return id(sys_led_bri).state / 100.0f;"
          red: !lambda "return ((id(sys_led_color) >> 16) & 0xFF) / 255.0f;"
          green: !lambda "return ((id(sys_led_color) >> 8) & 0xFF) / 255.0f;"
          blue: !lambda "return (id(sys_led_color) & 0xFF) / 255.0f;"
    turn_off_action:
      - light.turn_off:
          id: sys_rgb
          transition_length: 0s
  - platform: template
    name: "Buzzer · ${loc_label}"
    id: sys_buzz
    restore_mode: ALWAYS_OFF
    optimistic: true
    turn_on_action:
      - output.set_level:
          id: sys_buzz_out
          level: 0.5
    turn_off_action:
      - output.set_level:
          id: sys_buzz_out
          level: 0.0

number:
  - platform: template
    name: "Status LED brightness · ${loc_label}"
    id: sys_led_bri
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 35
    optimistic: true
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
    entity_category: config
  - platform: template
    name: "Buzzer tone Hz · ${loc_label}"
    id: sys_buzz_hz
    min_value: 500
    max_value: 8000
    step: 100
    initial_value: 4000
    optimistic: true
    restore_value: false
    unit_of_measurement: "Hz"
    mode: box
    entity_category: diagnostic
    set_action:
      - output.ledc.set_frequency:
          id: sys_buzz_out
          frequency: !lambda "return x;"

script:
  - id: buzz_on
    parameters:
      freq: float
    then:
      - output.ledc.set_frequency:
          id: sys_buzz_out
          frequency: !lambda "return freq;"
      - output.set_level:
          id: sys_buzz_out
          level: 0.5
  - id: buzz_off
    then:
      - output.set_level:
          id: sys_buzz_out
          level: 0.0

# Default status heartbeat for boards whose role does not own the LED
# (sys_led_owner false): red blink = component error, blue flash = HA API not
# connected, short green flash every 2 s = running.
interval:
  - interval: 50ms
    then:
      - lambda: |-
          if (id(sys_led_owner)) return;
          const uint32_t now = millis();
          uint32_t color, on_ms, period_ms;
          if (App.get_app_state() & STATUS_LED_ERROR) {
            color = 0xFF0000; on_ms = 250; period_ms = 500;
          } else if (api::global_api_server == nullptr || !api::global_api_server->is_connected()) {
            color = 0x0000FF; on_ms = 100; period_ms = 1000;
          } else {
            color = 0x00FF00; on_ms = 60; period_ms = 2000;
          }
          const bool on = (now % period_ms) < on_ms;
          if (color != id(sys_led_color) || on != id(sys_led).state) {
            id(sys_led_color) = color;
            if (on) id(sys_led).turn_on(); else id(sys_led).turn_off();
          }

sensor:
  - platform: wifi_signal
    name: "WiFi Signal · ${loc_label}"
    id: wifi_rssi
    update_interval: 60s
    entity_category: diagnostic
