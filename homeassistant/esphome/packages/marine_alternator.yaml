# =============================================================================
# Alternator role — Sisu Marine Board
# Requires packages: marine_board_base.yaml
# Required substitutions: sk_side, side_label, loc_label,
#   peer_current_entity, peer_online_entity  (issue #16 — other side's HA ids)
#
# Shadow (measure-only): switch `shadow_sw` defaults ON. Field PWM is forced
# to 0 so the existing eMax (or other regulator) can keep driving the alt
# while this board publishes I/V/T for calibration. Turn Shadow OFF only
# after sensors check out and the field wire is moved to this board.
#
# IDs are device-scoped (alt_i, house_v) — HA devices + SK paths distinguish sides.
# Display names include side_label so Port/Stbd show side-by-side in entity pickers.
#
# Architecture (rewritten 2026-08, issue #22): cascaded outer-voltage / inner-
# current PI, not a single PID trying to regulate current, voltage and
# temperature at once. Modeled on how commercial regulators (Wakespeed WS500,
# Balmar) separate bulk/absorption/float staging from continuous thermal
# derating and treat hard ceilings as a supervisory layer outside the control
# loop, not an integral part of it.
#
# Verified 2026-08 against Victron Lithium NG + Lynx/VE.Bus Smart BMS NG docs:
#   - BMS NG SoC-to-100% sync = Charged Voltage AND Tail Current %-of-bank
#     continuously for Charged Detection Time (Victron's own algorithm —
#     professional.victronenergy.com/news, community.victronenergy.com).
#   - Victron factory LFP defaults: absorption 14.2 V, float 13.5 V, absorption
#     time 2 h (victronenergy.com Lithium_Battery_Smart operation guide).
#   - High-cell protect ~3.6 V/cell -> 14.4 V pack: matches our existing hard
#     ceiling: never configurable.
#   - Tail current is a PROXY ONLY: the alternator shunt is not the BMS's own
#     battery-current measurement, and house loads (air-con, etc.) can hold
#     alt_i high while the batteries themselves are nearly full. This YAML
#     does NOT emulate the BMS SoC algorithm; it only uses the same shape of
#     condition to decide when THIS controller can relax from absorption to
#     float, so the real BMS gets a quiet, stable voltage/current window in
#     which to see its own charged conditions.
#   - Because the BMS's Charged Voltage / Tail Current % / Detection Time are
#     operator-configured on the physical BMS NG (not a fixed spec), the
#     matching values here are HA `number` setpoints the operator sets to
#     mirror the real BMS NG config — NOT firmware constants. Only the vessel
#     safety ceilings (250 A / 125 °C / 14.4 V) are hardcoded; see
#     docs/ALTERNATOR_LIMITS.md.
#   - Absorption is additionally capped by a max-time backstop (default 2 h,
#     configurable): a sustained house load can keep tail current above
#     threshold indefinitely, and Victron guidance is not to hold LFP at
#     absorption voltage forever.
#   - RPM gate (issue #13): field is not driven with zero alternator RPM
#     (belt off / stalled), threshold configurable via `rpm_gate_sp`. This is
#     a non-latching warning (transient at engine start) -- it self-clears
#     once RPM returns. Stale/missing RPM data (the counting subsystem
#     itself not reporting, not just a disconnected tap reading zero) fails
#     the same direction -- field held off, not silently disarmed (HIL
#     finding, issue #28, fixed 2026-08-10).
#   - Fault latch (issue #14): hard faults (stale/invalid sensor, current /
#     temp / voltage hard ceiling) hold field at 0 even after the tripping
#     condition clears on its own -- only an ENBL false->true cycle or the
#     "Clear Alternator Fault" HA button releases the latch. Trip count and
#     last reason are exposed for the operator (fault_trip_count_sensor,
#     fault_latched_sensor, alt_msg).
#   - Dual-alt shared house current budget (issue #16): each board clamps
#     its requested current to house_i_budget/2 while the peer board is
#     present (default budget 300 A → 150 A/side, max 300 A —
#     docs/ALTERNATOR_LIMITS.md).
#     Peer-online arrives via the HA API (telemetry only, not a control
#     authority). HA down → same half-budget (conservative); peer
#     explicitly offline → this side takes the full per-alt ceiling.
#     Combined cap is a request clamp, not a new hard field-cut;
#     ALT_I_CEIL is unchanged.
#   - Fast overcurrent path (issue #15): the control tick is already 250ms
#     (not the 1 Hz older designs assumed), but `alt_i`'s filter chain
#     stacks a 5-sample median with a 5-sample moving average on top, and
#     the moving average alone takes up to ~1.25 s to settle after a
#     genuine step change. The hard-trip check reads `alt_i_fast` (captured
#     post-median, pre-moving-average) instead, so a real overcurrent trips
#     in about one control tick while single-sample ADC noise is still
#     rejected by the median stage. Normal PI control keeps using the fully
#     smoothed value for stability.
# =============================================================================

one_wire:
  - platform: gpio
    pin: GPIO15
    id: onew_alt_t

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO8
      mode:
        input: true
    name: "Alternator Enable · ${side_label}"
    id: enbl
    filters:
      - delayed_on: 50ms
      - delayed_off: 100ms
  - platform: template
    name: "Alternator Fault Latched · ${side_label}"
    id: fault_latched_sensor
    lambda: |-
      return id(fault_latched);
    device_class: problem
  # Issue #16: peer board liveness from HA (sisu_*_online helpers).
  # Unavailable/unknown (HA API down) is NOT the same as off.
  - platform: homeassistant
    id: peer_online
    entity_id: ${peer_online_entity}
    internal: true

sensor:
  - platform: pulse_counter
    pin:
      number: GPIO4
      mode:
        input: true
    name: "Alternator RPM Count · ${side_label}"
    id: rpm_count
    unit_of_measurement: "pulses/min"
    update_interval: 2s
    internal: true
    on_value:
      - lambda: id(rpm_last_update_ms) = millis();

  # U2 @ 0x40 — house VBus + alternator shunt current (same chip)
  - platform: ina226
    address: 0x40
    shunt_resistance: 0.0001875
    max_current: 400.0
    adc_time: 1100us
    adc_averaging: 16
    update_interval: 250ms
    bus_voltage:
      name: "House Voltage · ${loc_label}"
      id: house_v
      unit_of_measurement: "V"
      accuracy_decimals: 2
      device_class: voltage
      state_class: measurement
      filters:
        - median:
            window_size: 3
            send_every: 1
      on_value:
        - lambda: id(house_v_last_update_ms) = millis();
    shunt_voltage:
      name: "Alternator Shunt Voltage · ${side_label}"
      id: alt_shunt_mv
      unit_of_measurement: "mV"
      accuracy_decimals: 3
      entity_category: diagnostic
      filters:
        - multiply: 1000
    current:
      name: "Alternator Current · ${side_label}"
      id: alt_i
      unit_of_measurement: "A"
      accuracy_decimals: 1
      device_class: current
      state_class: measurement
      filters:
        - median:
            window_size: 5
            send_every: 1
        # Issue #15: capture the post-median, pre-moving-average value for
        # the hard-trip check. The median already despikes single-sample
        # noise; the moving average below adds real settling lag (up to
        # ~1.25 s) on top of that before a genuine sustained overcurrent
        # step is fully reflected in `alt_i`. Normal PI control keeps using
        # the fully-smoothed value (stability); the hard-safety check in the
        # control interval reads `alt_i_fast` instead (speed).
        - lambda: |-
            id(alt_i_fast) = x;
            return x;
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
      on_value:
        - lambda: id(alt_i_last_update_ms) = millis();
    power:
      name: "Alternator Power · ${side_label}"
      id: alt_p
      unit_of_measurement: "W"
      accuracy_decimals: 0
      device_class: power
      state_class: measurement

  - platform: dallas_temp
    one_wire_id: onew_alt_t
    name: "Alternator Temperature · ${side_label}"
    id: alt_t
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: 2s
    on_value:
      - lambda: id(alt_t_last_update_ms) = millis();

  - platform: template
    name: "Alternator Field Duty · ${side_label}"
    id: alt_field
    lambda: |-
      if (std::isnan(id(last_pwm))) {
        return 0.0;
      }
      return id(last_pwm) * 100.0;
    update_interval: 2s
    unit_of_measurement: "%"
    accuracy_decimals: 2
    state_class: measurement

  - platform: template
    name: "Shadow Field Command · ${side_label}"
    id: alt_shadow_field
    lambda: |-
      return id(shadow_wanted_pwm) * 100.0;
    update_interval: 2s
    unit_of_measurement: "%"
    accuracy_decimals: 2
    entity_category: diagnostic

  - platform: template
    name: "Alternator Temp Limit Active · ${side_label}"
    id: alt_t_limit
    lambda: |-
      return (id(alt_t).state >= id(alt_t_sp).state) ? 1.0 : 0.0;
    update_interval: 2s
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    name: "Alternator Fault Trip Count · ${side_label}"
    id: fault_trip_count_sensor
    lambda: |-
      return (float) id(fault_trip_count);
    update_interval: 2s
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:counter

  # Issue #16: other side's measured current, HA API telemetry only.
  - platform: homeassistant
    id: peer_alt_i
    entity_id: ${peer_current_entity}
    internal: true

  - platform: template
    name: "Alternator Share Cap · ${side_label}"
    id: alt_share_cap_sensor
    lambda: |-
      return id(alt_share_cap);
    update_interval: 2s
    unit_of_measurement: "A"
    device_class: current
    accuracy_decimals: 1
    entity_category: diagnostic
    icon: mdi:current-dc

text_sensor:
  - platform: template
    name: "Alternator Status · ${side_label}"
    id: alt_msg
    update_interval: 2s
    lambda: |-
      return id(alt_msg).state;
  - platform: template
    name: "Alternator Charge Stage · ${side_label}"
    id: alt_stage
    update_interval: 2s
    lambda: |-
      if (id(charge_stage_id) == 1) return std::string("bulk");
      if (id(charge_stage_id) == 2) return std::string("absorption");
      if (id(charge_stage_id) == 3) return std::string("float");
      return std::string("off");
  - platform: template
    name: "Alternator Share Mode · ${side_label}"
    id: alt_share_mode_sensor
    entity_category: diagnostic
    icon: mdi:swap-horizontal
    update_interval: 2s
    lambda: |-
      return id(alt_share_mode);

output:
  - platform: ledc
    pin: GPIO38
    id: alt_field_out
    frequency: 4000 Hz
    max_power: 1.0

button:
  # Issue #14: explicit clear alongside the ENBL-cycle clear. Safe by
  # construction — this only releases the latch; if the underlying hard
  # condition is still true, the very next 250ms tick re-trips and
  # re-latches on its own (see interval below), so there is no way to
  # "clear" past a real ongoing fault.
  - platform: template
    name: "Clear Alternator Fault · ${side_label}"
    id: clear_fault_btn
    on_press:
      - lambda: |-
          id(fault_latched) = false;
          ESP_LOGI("alt_${sk_side}", "Fault latch cleared via HA button");

switch:
  # Commissioning: measure I/V/T while eMax (or another regulator) still
  # owns the field. Default ON so a first flash cannot excite the field.
  # Turn OFF only after shadow calibration and the field wire is on this board.
  - platform: template
    name: "Shadow measure-only · ${side_label}"
    id: shadow_sw
    icon: mdi:eye-outline
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - lambda: |-
          id(alt_field_out).set_level(0.0f);
          id(last_pwm) = 0.0f;
          ESP_LOGI("alt_${sk_side}", "Shadow ON — field forced off");

number:
  # Adjustable in HA — Port and Stbd each have their own (per device)
  - platform: template
    name: "House Float Voltage · ${side_label}"
    id: house_v_float
    # Hard max 14.4 V — docs/ALTERNATOR_LIMITS.md. Default 13.5 V matches
    # Victron's factory LFP float recommendation.
    min_value: 12.0
    max_value: 14.4
    step: 0.05
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 13.5
    mode: box
  - platform: template
    name: "House Absorption Voltage · ${side_label}"
    id: house_v_abs
    # Default 14.3 V so it lines up with this vessel's BMS NG Charged Voltage
    # (see house_v_charged below) — Victron's generic factory default is
    # 14.2 V; raise/lower to match your own BMS NG setting.
    min_value: 12.0
    max_value: 14.4
    step: 0.05
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 14.3
    mode: box
  - platform: template
    name: "Alternator Current Setpoint · ${side_label}"
    id: alt_i_sp
    # Hard max 250 A (scale display 320 A rated)
    min_value: 0
    max_value: 250
    step: 1
    unit_of_measurement: "A"
    optimistic: true
    restore_value: true
    initial_value: 150
    mode: box
  - platform: template
    name: "Alternator Temperature Setpoint · ${side_label}"
    id: alt_t_sp
    # Hard max 125 °C (scale display 150 °C)
    min_value: 0
    max_value: 125
    step: 1
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    initial_value: 95
    mode: box
  - platform: template
    name: "House Charged Voltage · ${side_label}"
    id: house_v_charged
    # Mirror this vessel's real Victron BMS NG "Charged voltage" setting.
    # Hard max 14.4 V — docs/ALTERNATOR_LIMITS.md. This is a setpoint, not a
    # firmware constant, because it is the operator's own BMS NG config.
    min_value: 12.0
    max_value: 14.4
    step: 0.05
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 14.3
    mode: box
  - platform: template
    name: "BMS Bank Capacity · ${side_label}"
    id: bms_bank_ah
    # Mirror the Victron BMS NG battery bank size used to compute the tail
    # current threshold below (Sisu house bank: 5x300 Ah = 1500 Ah).
    min_value: 100
    max_value: 3000
    step: 25
    unit_of_measurement: "Ah"
    optimistic: true
    restore_value: true
    initial_value: 1500
    mode: box
  - platform: template
    name: "BMS Tail Current · ${side_label}"
    id: bms_tail_i_pct
    # Mirror the Victron BMS NG "Tail current" setting (% of bank capacity).
    # Must match the real BMS NG value so this controller's charged-detection
    # proxy lines up with when the BMS itself will sync SoC to 100%.
    min_value: 1.0
    max_value: 20.0
    step: 0.5
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    initial_value: 5.0
    mode: box
  - platform: template
    name: "BMS Charged Detection Time · ${side_label}"
    id: bms_charged_detect_s
    # Mirror the Victron BMS NG "Charged detection time" — how long Charged
    # Voltage + Tail Current must hold before the BMS syncs SoC. Victron
    # default is 3 min (180 s).
    min_value: 30
    max_value: 900
    step: 10
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true
    initial_value: 180
    mode: box
  - platform: template
    name: "Absorption Max Time · ${side_label}"
    id: abs_max_min
    # Safety/battery-longevity backstop: a sustained house load (air-con,
    # etc.) can keep alternator current above the tail-current threshold
    # indefinitely. Do not hold LFP at absorption voltage forever — fall
    # back to float on a timer even without a confirmed tail-current read.
    # Victron's own charger default absorption time is 2 h.
    min_value: 15
    max_value: 240
    step: 5
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    initial_value: 120
    mode: box
  - platform: template
    name: "House Current Budget · ${side_label}"
    id: house_i_budget
    # Combined Port+Stbd current target (issues #16/#62). Not a hard field-cut.
    # Default 300 A / max 300 A → 150 A per side when both run.
    # docs/ALTERNATOR_LIMITS.md. Set the same value on both boards.
    # Single-alt (peer offline) ignores this and uses the per-alt user
    # SP / ALT_I_CEIL path.
    min_value: 50
    max_value: 300
    step: 5
    unit_of_measurement: "A"
    optimistic: true
    restore_value: true
    initial_value: 300
    mode: box
  - platform: template
    name: "Alternator RPM Gate · ${side_label}"
    id: rpm_gate_sp
    # Issue #13: field is not driven when measured RPM is at/below this
    # threshold (belt off / stalled / engine not running). Default 0 keeps
    # the previous "any measured spin" behavior; raise if the pulse pickup
    # reads noise at standstill.
    min_value: 0
    max_value: 500
    step: 5
    unit_of_measurement: "pulses/min"
    optimistic: true
    restore_value: true
    initial_value: 0
    mode: box

globals:
  - id: voltage_integral
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: current_integral
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: last_pwm
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: last_voltage_error
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: last_current_error
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: is_error
    type: bool
    restore_value: false
    initial_value: "false"
  - id: is_warning
    type: bool
    restore_value: false
    initial_value: "false"
  - id: shadow_wanted_pwm
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: led_mode
    type: int
    restore_value: false
    initial_value: "0"
  - id: led_state
    type: bool
    restore_value: false
    initial_value: "false"
  - id: led_last_toggle
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: blink_step
    type: int
    restore_value: false
    initial_value: "0"
  - id: last_led_mode
    type: int
    restore_value: false
    initial_value: "-1"
  - id: charge_stage_id
    type: int
    restore_value: false
    initial_value: "0"
  - id: absorption_elapsed_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: house_v_last_update_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: alt_i_last_update_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: alt_t_last_update_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: rpm_last_update_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: charged_elapsed_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: charged_timer_started
    type: bool
    restore_value: false
    initial_value: "false"
  - id: fault_latched
    type: bool
    restore_value: false
    initial_value: "false"
  - id: fault_trip_count
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: fault_reason
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: prev_enabled
    type: bool
    restore_value: false
    initial_value: "false"
  - id: alt_i_fast
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: alt_share_cap
    type: float
    restore_value: false
    initial_value: "150.0"
  - id: alt_share_mode
    type: std::string
    restore_value: false
    initial_value: '"single"'

interval:
  - interval: 50ms
    then:
      lambda: |-
        uint32_t now = millis();
        uint32_t elapsed = now - id(led_last_toggle);

        if (id(led_mode) != id(last_led_mode)) {
          id(last_led_mode) = id(led_mode);
          id(blink_step) = 0;
          id(led_state) = true;
          id(sys_led).turn_on();
          id(led_last_toggle) = now;
        }

        if (id(led_mode) == 0) {
          if (id(led_state) && elapsed >= 50) {
            id(led_state) = false;
            id(sys_led).turn_off();
            id(led_last_toggle) = now;
          } else if (!id(led_state) && elapsed >= 950) {
            id(led_state) = true;
            id(sys_led).turn_on();
            id(led_last_toggle) = now;
          }
        } else if (id(led_mode) == 1) {
          if (elapsed >= 950) {
            id(led_state) = !id(led_state);
            if (id(led_state)) id(sys_led).turn_on();
            else id(sys_led).turn_off();
            id(led_last_toggle) = now;
          }
        } else if (id(led_mode) == 2) {
          if (id(blink_step) == 0 && elapsed >= 100 && id(led_state)) {
            id(led_state) = false; id(sys_led).turn_off();
            id(blink_step) = 1; id(led_last_toggle) = now;
          } else if (id(blink_step) == 1 && elapsed >= 100 && !id(led_state)) {
            id(led_state) = true; id(sys_led).turn_on();
            id(blink_step) = 2; id(led_last_toggle) = now;
          } else if (id(blink_step) == 2 && elapsed >= 100 && id(led_state)) {
            id(led_state) = false; id(sys_led).turn_off();
            id(blink_step) = 3; id(led_last_toggle) = now;
          } else if (id(blink_step) == 3 && elapsed >= 700 && !id(led_state)) {
            id(led_state) = true; id(sys_led).turn_on();
            id(blink_step) = 0; id(led_last_toggle) = now;
          }
        } else if (id(led_mode) == 3) {
          if (id(blink_step) == 0 && elapsed >= 100 && id(led_state)) {
            id(led_state) = false; id(sys_led).turn_off();
            id(sys_buzz).turn_on();
            id(blink_step) = 1; id(led_last_toggle) = now;
          } else if (id(blink_step) == 1 && elapsed >= 100 && !id(led_state)) {
            id(sys_buzz).turn_off();
            id(led_state) = true; id(sys_led).turn_on();
            id(blink_step) = 2; id(led_last_toggle) = now;
          } else if (id(blink_step) == 2 && elapsed >= 100 && id(led_state)) {
            id(led_state) = false; id(sys_led).turn_off();
            id(blink_step) = 3; id(led_last_toggle) = now;
          } else if (id(blink_step) == 3 && elapsed >= 100 && !id(led_state)) {
            id(led_state) = true; id(sys_led).turn_on();
            id(blink_step) = 4; id(led_last_toggle) = now;
          } else if (id(blink_step) == 4 && elapsed >= 100 && id(led_state)) {
            id(led_state) = false; id(sys_led).turn_off();
            id(blink_step) = 5; id(led_last_toggle) = now;
          } else if (id(blink_step) == 5 && elapsed >= 600 && !id(led_state)) {
            id(led_state) = true; id(sys_led).turn_on();
            id(blink_step) = 0; id(led_last_toggle) = now;
          }
        }

  # Control loop: intentionally slower than the PWM carrier, but fast enough to
  # catch a battery/BMS load-dump event. The INA226 is updated at 250 ms.
  - interval: 250ms
    then:
      lambda: |-
        // ------------------------------------------------------------------
        // HARD LIMITS: vessel safety ceilings only. Never make these
        // configurable in Home Assistant — docs/ALTERNATOR_LIMITS.md.
        // ------------------------------------------------------------------
        constexpr float ALT_I_CEIL = 250.0f;
        constexpr float ALT_T_CEIL = 125.0f;
        constexpr float HOUSE_V_CEIL = 14.4f;

        constexpr float REBULK_HYST = 0.10f;
        constexpr float V_BAND = 0.03f;

        // Thermal derating: full requested current below Tsp-5C, then
        // linearly reduce to zero at the hard ceiling. Deliberately gradual;
        // a hard step at Tsp causes unnecessary cycling and thermal
        // overshoot (cf. Wakespeed WS500 active-regulation-to-temperature
        // vs a simple cutoff).
        constexpr float TEMP_DERATE_START_OFFSET = 5.0f;

        // Current-loop starting gains. Intentionally conservative — no
        // logged step-response data yet for this alternator/field combo.
        // See issue #17 (sea-trial diagnostics) for the follow-up tuning
        // pass. Kp is duty/A; Ki is duty/(A*s).
        constexpr float I_KP = 0.0030f;
        constexpr float I_KI = 0.0008f;
        constexpr float I_I_MAX = 0.50f;

        // Outer voltage-loop gains. Output is a requested current in amps.
        // Only active in absorption/float.
        constexpr float V_KP = 140.0f;     // A/V
        constexpr float V_KI = 8.0f;       // A/(V*s)
        constexpr float V_I_MAX = 120.0f;

        // Field slew rate. Prevents large instantaneous field changes.
        constexpr float FIELD_UP_PER_S = 0.10f;
        constexpr float FIELD_DOWN_PER_S = 0.20f;

        // Sensor freshness limits. A stale value is a safety fault, not a
        // valid measurement.
        constexpr uint32_t SENSOR_TIMEOUT_MS = 3000UL;
        constexpr uint32_t TEMP_TIMEOUT_MS = 5000UL;
        constexpr uint32_t RPM_TIMEOUT_MS = 5000UL;

        const uint32_t now = millis();
        char buffer[160];

        auto set_field = [&](float duty) {
          duty = esphome::clamp(duty, 0.0f, 1.0f);
          id(shadow_wanted_pwm) = duty;
          if (id(shadow_sw).state) duty = 0.0f;
          id(alt_field_out).set_level(duty);
          id(last_pwm) = duty;
        };

        auto reset_controller = [&]() {
          id(current_integral) = 0.0f;
          id(voltage_integral) = 0.0f;
          id(last_current_error) = 0.0f;
          id(last_voltage_error) = 0.0f;
          id(absorption_elapsed_ms) = 0;
          id(charged_elapsed_ms) = 0;
          id(charged_timer_started) = false;
        };

        float current = id(alt_i).state;
        float current_fast = id(alt_i_fast);  // issue #15: for the hard-trip check only
        float temp = id(alt_t).state;
        float battery_v = id(house_v).state;
        float user_i_max = id(alt_i_sp).state;
        float temp_sp = id(alt_t_sp).state;
        float float_v = id(house_v_float).state;
        float absorption_v = id(house_v_abs).state;
        float rpm = id(rpm_count).state;
        float rpm_gate = id(rpm_gate_sp).state;

        // Victron BMS NG mirror setpoints (operator-configured to match the
        // real BMS NG, not firmware constants). Local names deliberately
        // differ from the `number` ids above — `id(x)` expands to the literal
        // global identifier `x`, so a same-named local would shadow it.
        float charged_v_sp = id(house_v_charged).state;
        float bank_ah_sp = id(bms_bank_ah).state;
        float bms_tail_pct = id(bms_tail_i_pct).state;
        float charged_detect_s_sp = id(bms_charged_detect_s).state;
        float abs_max_min_sp = id(abs_max_min).state;

        id(is_error) = false;
        id(is_warning) = false;

        const bool enabled = id(enbl).state;

        // Issue #14: a hard fault latches until cleared by an ENBL cycle
        // (false->true transition) or the explicit "Clear Alternator Fault"
        // button — it does NOT self-clear just because the tripping
        // condition went away on its own. Track the edge every tick,
        // disabled or not, so a fault set while running clears correctly
        // the next time the operator cycles ENBL.
        const bool enbl_rising_edge = enabled && !id(prev_enabled);
        id(prev_enabled) = enabled;
        if (enbl_rising_edge && id(fault_latched)) {
          id(fault_latched) = false;
          ESP_LOGI("alt_${sk_side}", "Fault latch cleared by ENBL cycle");
        }

        if (!enabled) {
          set_field(0.0f);
          reset_controller();
          id(charge_stage_id) = 0;
          id(led_mode) = 0;
          id(sys_buzz).turn_off();
          snprintf(buffer, sizeof(buffer),
                   "%sDisabled: A=%.1f V=%.2f T=%.1f",
                   id(shadow_sw).state ? "SHADOW " : "",
                   current, battery_v, temp);
          id(alt_msg).publish_state(buffer);
          return;
        }

        // A latched fault holds field at 0 regardless of current readings —
        // checked before re-evaluating sensors/hard limits so a fault that
        // has physically cleared (e.g. current back under 250 A) does not
        // silently re-enable the field on its own.
        if (id(fault_latched)) {
          set_field(0.0f);
          reset_controller();
          id(charge_stage_id) = 0;
          id(is_error) = true;
          id(led_mode) = 3;
          snprintf(buffer, sizeof(buffer),
                   "LATCHED FAULT (trip #%u): %s -- clear via ENBL cycle or Clear Fault button",
                   (unsigned) id(fault_trip_count), id(fault_reason).c_str());
          id(alt_msg).publish_state(buffer);
          return;
        }

        // ------------------------------------------------------------------
        // FAIL SAFE: missing/stale measurements or bad setpoints.
        // ------------------------------------------------------------------
        const bool sensor_bad =
            std::isnan(current) || std::isnan(current_fast) ||
            std::isnan(temp) || std::isnan(battery_v) ||
            std::isnan(user_i_max) || std::isnan(temp_sp) ||
            std::isnan(float_v) || std::isnan(absorption_v) ||
            std::isnan(rpm_gate) || std::isnan(charged_v_sp) ||
            std::isnan(bank_ah_sp) || std::isnan(bms_tail_pct) ||
            std::isnan(charged_detect_s_sp) || std::isnan(abs_max_min_sp);

        const bool sensor_stale =
            id(house_v_last_update_ms) == 0 ||
            id(alt_i_last_update_ms) == 0 ||
            id(alt_t_last_update_ms) == 0 ||
            (now - id(house_v_last_update_ms) > SENSOR_TIMEOUT_MS) ||
            (now - id(alt_i_last_update_ms) > SENSOR_TIMEOUT_MS) ||
            (now - id(alt_t_last_update_ms) > TEMP_TIMEOUT_MS);

        if (sensor_bad || sensor_stale) {
          set_field(0.0f);
          reset_controller();
          id(charge_stage_id) = 0;
          id(is_error) = true;
          id(led_mode) = 3;
          snprintf(buffer, sizeof(buffer),
                   "FAULT: stale/invalid sensor V=%.2f A=%.1f T=%.1f",
                   battery_v, current, temp);
          id(alt_msg).publish_state(buffer);
          ESP_LOGW("alt_${sk_side}", "%s", buffer);
          if (!id(fault_latched)) {
            id(fault_latched) = true;
            id(fault_trip_count)++;
            id(fault_reason) = std::string(buffer);
          }
          return;
        }

        // ------------------------------------------------------------------
        // HARD SAFETY OVERRIDES.
        //
        // Current uses `current_fast` (issue #15) -- post-median but
        // pre-moving-average, so a genuine sustained overcurrent step trips
        // in ~1 control tick instead of waiting out the moving-average's
        // settling time, while the median stage still rejects single-sample
        // ADC noise (no bare-raw-sample trip). Whichever of the two current
        // readings is higher governs the trip decision.
        // ------------------------------------------------------------------
        if (current > ALT_I_CEIL || current_fast > ALT_I_CEIL ||
            temp > ALT_T_CEIL ||
            battery_v > HOUSE_V_CEIL ||
            current < -5.0f) {
          set_field(0.0f);
          reset_controller();
          id(charge_stage_id) = 0;
          id(is_error) = true;
          id(led_mode) = 3;
          snprintf(buffer, sizeof(buffer),
                   "HARD SAFETY: A=%.1f/fast=%.1f/%g T=%.1f/%g V=%.2f/%g",
                   current, current_fast, ALT_I_CEIL, temp, ALT_T_CEIL,
                   battery_v, HOUSE_V_CEIL);
          id(alt_msg).publish_state(buffer);
          ESP_LOGW("alt_${sk_side}", "%s", buffer);
          if (!id(fault_latched)) {
            id(fault_latched) = true;
            id(fault_trip_count)++;
            id(fault_reason) = std::string(buffer);
          }
          return;
        }

        // Issue #13: a running alternator with RPM at/below the configured
        // gate should not receive field.
        //
        // HIL finding (issue #28, 2026-08-10): the freshness guard that used
        // to gate this whole check also silently DISARMED it once RPM data
        // went stale -- field resumed full output because the code could no
        // longer tell whether the engine was still running, not because it
        // confirmed the engine had restarted. A disconnected/unterminated
        // RPM tap does not itself cause staleness -- pulse_counter still
        // publishes "0 pulses/min" every update_interval regardless of
        // whether real pulses arrive, which the rpm<=rpm_gate branch below
        // already catches. Genuine staleness means the counting subsystem
        // itself stopped reporting -- a more serious failure, not a lighter
        // one, so it now fails the same direction: assume stalled, hold
        // field off. Still a self-clearing warning (not a latched fault,
        // per safety.md) -- it clears the instant fresh RPM data resumes,
        // same as before; it just can no longer go quiet while genuinely
        // unable to confirm the engine is turning.
        {
          const bool rpm_stale =
              id(rpm_last_update_ms) == 0 ||
              (now - id(rpm_last_update_ms) > RPM_TIMEOUT_MS);
          const bool rpm_low = !rpm_stale && !std::isnan(rpm) && rpm <= rpm_gate;

          if (rpm_stale || rpm_low) {
            set_field(0.0f);
            reset_controller();
            id(charge_stage_id) = 0;
            id(is_warning) = true;
            id(led_mode) = 2;
            if (rpm_stale) {
              snprintf(buffer, sizeof(buffer),
                       "No alternator RPM data (stale/missing): field off");
            } else {
              snprintf(buffer, sizeof(buffer),
                       "No alternator RPM (%.0f<=%.0f): field off", rpm, rpm_gate);
            }
            id(alt_msg).publish_state(buffer);
            return;
          }
        }

        // Sanitize user setpoints. The hardware-independent safety ceilings
        // are applied again here even though the HA number entities also
        // enforce them.
        user_i_max = esphome::clamp(user_i_max, 0.0f, ALT_I_CEIL);
        temp_sp = esphome::clamp(temp_sp, 0.0f, ALT_T_CEIL);

        // ------------------------------------------------------------------
        // SHARED HOUSE CURRENT BUDGET (issue #16)
        //
        // Combined Port+Stbd *request* is held to house_i_budget via a
        // static 50/50 split while the peer board is present. This is a
        // request clamp (same layer as the user SP), not a new hard
        // field-cut. ALT_I_CEIL is unchanged.
        //
        // Static half (not "budget − peer") so both sides ramping from 0 A
        // cannot each take the full leftover and overshoot the bank during
        // the first seconds.
        //
        //   peer explicitly offline → single-alt (full per-alt SP / CEIL)
        //   peer online or unknown  → budget / 2  (unknown = HA API down)
        // ------------------------------------------------------------------
        constexpr float HOUSE_I_BUDGET_DEFAULT = 300.0f;
        constexpr float HOUSE_I_BUDGET_MIN = 50.0f;
        constexpr float HOUSE_I_BUDGET_MAX = 300.0f;
        float house_budget = id(house_i_budget).state;
        if (std::isnan(house_budget)) house_budget = HOUSE_I_BUDGET_DEFAULT;
        house_budget = esphome::clamp(house_budget, HOUSE_I_BUDGET_MIN, HOUSE_I_BUDGET_MAX);

        const bool peer_online_known = id(peer_online).has_state();
        const bool peer_is_online = peer_online_known && id(peer_online).state;
        const bool peer_i_ok =
            id(peer_alt_i).has_state() && !std::isnan(id(peer_alt_i).state);

        float share_cap = ALT_I_CEIL;
        const char *share_mode = "single";
        if (peer_online_known && !peer_is_online && !peer_i_ok) {
          share_cap = ALT_I_CEIL;
          share_mode = "single";
        } else {
          share_cap = house_budget * 0.5f;
          share_mode = (peer_online_known && peer_is_online) ? "split"
                                                            : "conservative";
        }
        share_cap = esphome::clamp(share_cap, 0.0f, ALT_I_CEIL);
        id(alt_share_cap) = share_cap;
        id(alt_share_mode) = std::string(share_mode);
        if (user_i_max > share_cap) {
          user_i_max = share_cap;
          id(is_warning) = true;
        }
        float_v = esphome::clamp(float_v, 12.0f, HOUSE_V_CEIL);
        absorption_v = esphome::clamp(absorption_v, 12.0f, HOUSE_V_CEIL);
        if (absorption_v < float_v) absorption_v = float_v;
        charged_v_sp = esphome::clamp(charged_v_sp, 12.0f, HOUSE_V_CEIL);
        bank_ah_sp = esphome::clamp(bank_ah_sp, 50.0f, 5000.0f);
        bms_tail_pct = esphome::clamp(bms_tail_pct, 0.5f, 100.0f);
        const uint32_t bms_charged_detect_ms =
            (uint32_t)(esphome::clamp(charged_detect_s_sp, 5.0f, 3600.0f) * 1000.0f);
        const uint32_t absorption_max_ms =
            (uint32_t)(esphome::clamp(abs_max_min_sp, 1.0f, 600.0f) * 60000.0f);
        const float bms_tail_current_a = bank_ah_sp * bms_tail_pct / 100.0f;

        // ------------------------------------------------------------------
        // CHARGE STATE MACHINE
        //
        // Bulk:
        //   current-limited CC operation up to the user current setpoint,
        //   subject to the thermal derating ceiling.
        //
        // Absorption:
        //   CV regulation at the configured absorption voltage (default
        //   14.3 V, matched to this vessel's BMS NG Charged Voltage).
        //   The internal "charged" test is a conservative proxy only:
        //     V >= min(house_v_charged, absorption_v) AND alt current <=
        //     bank_capacity * tail% continuously for the configured
        //     detection time. This does NOT replace the real BMS SoC sync
        //     (which uses battery current, not alternator current). It only
        //     decides when this controller can drop to float.
        //   A max-time backstop (abs_max_min) forces the same transition if
        //   a house load keeps current above the tail threshold indefinitely
        //   — LFP should not be held at absorption voltage forever.
        //
        // Float:
        //   CV regulation at the configured float voltage (default 13.5 V).
        //   Rebulk occurs 0.10 V below float.
        // ------------------------------------------------------------------
        if (id(charge_stage_id) == 0) id(charge_stage_id) = 1;

        if (id(charge_stage_id) == 1) {
          id(charged_elapsed_ms) = 0;
          id(charged_timer_started) = false;
          id(absorption_elapsed_ms) = 0;

          if (battery_v >= absorption_v - V_BAND) {
            id(charge_stage_id) = 2;
            id(voltage_integral) = 0.0f;
          }
        } else if (id(charge_stage_id) == 2) {
          id(absorption_elapsed_ms) += 250;

          // Conservative proxy for "batteries are accepting little current
          // while voltage is at/near the BMS charged target". Real BMS uses
          // its own battery current; this only affects the alternator stage.
          const float charged_v_thresh = std::min(charged_v_sp, absorption_v);
          if (battery_v >= charged_v_thresh &&
              current <= bms_tail_current_a) {
            if (!id(charged_timer_started)) {
              id(charged_timer_started) = true;
              id(charged_elapsed_ms) = 0;
            }
            id(charged_elapsed_ms) += 250;
          } else {
            id(charged_timer_started) = false;
            id(charged_elapsed_ms) = 0;
          }

          const bool charged_by_tail =
              id(charged_elapsed_ms) >= bms_charged_detect_ms;
          const bool charged_by_timeout =
              id(absorption_elapsed_ms) >= absorption_max_ms;

          if (charged_by_tail || charged_by_timeout) {
            id(charge_stage_id) = 3;
            id(voltage_integral) = 0.0f;
            id(charged_timer_started) = false;
            id(charged_elapsed_ms) = 0;
            id(absorption_elapsed_ms) = 0;
            if (charged_by_timeout && !charged_by_tail) {
              ESP_LOGI("alt_${sk_side}",
                       "Absorption max time (%.0f min) reached before "
                       "tail-current confirm -> forcing float",
                       abs_max_min_sp);
            }
          }
        } else if (id(charge_stage_id) == 3) {
          if (battery_v < float_v - REBULK_HYST) {
            id(charge_stage_id) = 1;
            id(voltage_integral) = 0.0f;
            id(charged_timer_started) = false;
            id(charged_elapsed_ms) = 0;
            id(absorption_elapsed_ms) = 0;
          }
        }

        const int stage = id(charge_stage_id);
        const char *stage_str =
            (stage == 1) ? "bulk" :
            (stage == 2) ? "absorption" :
            (stage == 3) ? "float" : "off";

        // ------------------------------------------------------------------
        // THERMAL CURRENT CEILING
        // ------------------------------------------------------------------
        float thermal_current_limit = user_i_max;
        const float temp_derate_start = std::max(0.0f, temp_sp - TEMP_DERATE_START_OFFSET);

        if (temp >= temp_derate_start) {
          const float span = std::max(1.0f, ALT_T_CEIL - temp_derate_start);
          const float remaining = esphome::clamp(
              (ALT_T_CEIL - temp) / span, 0.0f, 1.0f);
          thermal_current_limit = user_i_max * remaining;
          id(is_warning) = true;
        }

        // Current should also never exceed the absolute hard limit.
        thermal_current_limit = esphome::clamp(
            thermal_current_limit, 0.0f, ALT_I_CEIL);

        // ------------------------------------------------------------------
        // OUTER LOOP: battery voltage -> allowable charge current.
        // ------------------------------------------------------------------
        float target_current = 0.0f;

        if (stage == 1) {
          target_current = thermal_current_limit;
        } else {
          const float voltage_target = (stage == 2) ? absorption_v : float_v;
          const float v_error = voltage_target - battery_v;

          // Integrate only when the requested current is not already being
          // limited by thermal protection. This prevents the voltage loop
          // from winding up while temperature is the active constraint.
          const bool thermal_limited =
              thermal_current_limit < user_i_max - 0.1f;

          float v_integral = id(voltage_integral);
          if (!thermal_limited) {
            v_integral += v_error * 0.25f;
            v_integral = esphome::clamp(v_integral, -V_I_MAX, V_I_MAX);
          }

          float requested_current =
              V_KP * v_error + V_KI * v_integral;

          // Keep some proportional response at the instant a stage changes,
          // but never request negative charging current.
          target_current = esphome::clamp(
              requested_current, 0.0f, thermal_current_limit);

          // Back-calculation/conditional anti-windup for the outer loop.
          if (requested_current != target_current) {
            if ((requested_current > target_current && v_error > 0.0f) ||
                (requested_current < target_current && v_error < 0.0f)) {
              v_integral -= v_error * 0.25f;
            }
          }
          id(voltage_integral) = v_integral;
          id(last_voltage_error) = v_error;

          if (std::fabs(v_error) > 0.08f) {
            id(is_warning) = true;
          }
        }

        // ------------------------------------------------------------------
        // INNER LOOP: desired current -> alternator field.
        //
        // PI, not PID. The current signal is already filtered and only
        // updates every 250 ms. Differentiating it would amplify shunt noise
        // and create field chatter. This is a deliberate "PID-like" industrial
        // implementation: PI + anti-windup + slew limiting + supervisory
        // constraints.
        // ------------------------------------------------------------------
        const float current_error = target_current - current;
        float i_integral = id(current_integral);

        const bool field_at_top = id(last_pwm) >= 0.999f;
        const bool field_at_bottom = id(last_pwm) <= 0.001f;

        // Conditional integration (anti-windup).
        if (!((field_at_top && current_error > 0.0f) ||
              (field_at_bottom && current_error < 0.0f))) {
          i_integral += current_error * 0.25f;
          i_integral = esphome::clamp(i_integral, -I_I_MAX, I_I_MAX);
        }

        float raw_field =
            id(last_pwm) + I_KP * current_error + I_KI * i_integral;

        // Slew-rate limit: fast enough to protect the system, slow enough to
        // avoid exciting alternator/belt transients.
        const float max_up = FIELD_UP_PER_S * 0.25f;
        const float max_down = FIELD_DOWN_PER_S * 0.25f;
        raw_field = esphome::clamp(
            raw_field,
            id(last_pwm) - max_down,
            id(last_pwm) + max_up);

        const float commanded_field =
            esphome::clamp(raw_field, 0.0f, 1.0f);

        // Back-calculation: if the actuator slew/saturation prevented the
        // controller from applying its requested output, pull the integral
        // back toward the realizable field command.
        const float field_unsat =
            id(last_pwm) + I_KP * current_error + I_KI * i_integral;
        const float field_tracking_error = commanded_field - field_unsat;
        i_integral += 0.5f * field_tracking_error;
        i_integral = esphome::clamp(i_integral, -I_I_MAX, I_I_MAX);

        id(current_integral) = i_integral;
        id(last_current_error) = current_error;

        set_field(commanded_field);

        // ------------------------------------------------------------------
        // STATUS / DIAGNOSTICS
        // ------------------------------------------------------------------
        if (temp >= temp_sp) {
          id(is_warning) = true;
        }

        if (!id(is_error) && !id(is_warning)) {
          id(sys_buzz).turn_off();
        }

        if (id(is_warning)) {
          id(led_mode) = 2;
        } else {
          id(led_mode) = (stage == 3 && commanded_field <= 0.001f) ? 0 : 1;
        }

        snprintf(buffer, sizeof(buffer),
                 "%s%s: want=%.1f%% out=%.1f%% A=%.1f/tgt %.1f lim %.1f V=%.2f/%0.2f T=%.1f",
                 id(shadow_sw).state ? "SHADOW " : "",
                 stage_str, commanded_field * 100.0f, id(last_pwm) * 100.0f,
                 current, target_current, thermal_current_limit,
                 battery_v, (stage == 1) ? absorption_v :
                            (stage == 2) ? absorption_v : float_v,
                 temp);
        id(alt_msg).publish_state(buffer);

        ESP_LOGI("alt_${sk_side}",
                 "%s field=%.1f%% A=%.1f tgt=%.1f lim=%.1f V=%.2f F=%.2f Abs=%.2f "
                 "T=%.1f RPM=%.0f Iint=%.3f Vint=%.3f tailA=%.1f share=%.0f/%s",
                 stage_str, commanded_field * 100.0f, current,
                 target_current, thermal_current_limit, battery_v,
                 float_v, absorption_v, temp, rpm,
                 id(current_integral), id(voltage_integral), bms_tail_current_a,
                 share_cap, share_mode);
