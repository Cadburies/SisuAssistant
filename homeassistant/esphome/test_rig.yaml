number:
  # ---- Injected raw sensor values — Port ----
  - platform: template
    name: "House Voltage (Injected) · Port"
    id: p_inj_house_v
    min_value: 10.0
    max_value: 15.0
    step: 0.01
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 13.0
    mode: box
  - platform: template
    name: "Alternator Current (Injected) · Port"
    id: p_inj_alt_i
    min_value: -20
    max_value: 260
    step: 1
    unit_of_measurement: "A"
    optimistic: true
    restore_value: true
    initial_value: 80
    mode: box
  - platform: template
    name: "Alternator Temperature (Injected) · Port"
    id: p_inj_alt_t
    min_value: 0
    max_value: 140
    step: 1
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    initial_value: 45
    mode: box
  - platform: template
