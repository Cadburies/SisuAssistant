    max_value: 14.4
    step: 0.05
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
    initial_value: 13.5
    mode: box
  - platform: template
    name: "House Absorption Voltage · Starboard"
    id: s_house_v_abs
    min_value: 12.0
    max_value: 14.4
    step: 0.05
    unit_of_measurement: "V"
    optimistic: true
    restore_value: true
