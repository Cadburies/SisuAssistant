# =============================================================================
# LAB TEST RIG — LilyGo T8-S3 — hardware-in-the-loop for the real control code
#
# NOT a plant simulator (see bench_alts_sim.yaml for that — scripted physics,
# no real controller). This device runs the ACTUAL control logic —
# alternator cascaded PI + charge state machine, freezer climate:thermostat,
# tank-level mA->% conversion — against MANUALLY INJECTED static values, so
# you can watch the real controller react: set house_v below setpoint with
# low current and see the field/duty request rise; set house_v = 14.3 V and
# see it back off; flip a "Fail ..." switch and watch the real stale-sensor
# fail-safe trip a few seconds later.
#
# Alternator control block below is a HAND-SYNCED MIRROR of
# packages/marine_alternator.yaml's 250ms control interval (ESPHome has no
# per-instance/parameterized package include on one device, so two sides on
# one board means two copies). It was generated by a scripted find/replace
# from the production file, not retyped by hand — see issue #23. If you
# change the control logic in marine_alternator.yaml, re-run the same
# transform (or re-derive by hand) to keep this rig honest. A drifted rig
# that "looks like" the real controller but silently isn't is worse than no
# rig at all. Last synced: issue #14 (fault latch).
#
# Deliberately NOT ported: issue #15 (fast overcurrent path). Production
# added a second, less-smoothed read (`alt_i_fast`) so the hard-trip check
# doesn't wait out the moving-average filter's ~1.25 s settling time. That
# problem doesn't exist here — injected `number` values have no filter
# chain at all, so the hard-trip check already reacts on the very next
# 250ms tick to whatever you set, with zero settling lag. Porting the
# split would just make `p_alt_i_fast`/`s_alt_i_fast` permanently equal to
# the injected value — a no-op that adds confusion, not fidelity.
#
# Values are STATIC (you move a slider, it holds) — no auto-ramping yet.
#
# IP 192.168.10.48 · flash: esphome run test_rig.yaml --device /dev/cu.usbmodem…
# =============================================================================

substitutions:
  device_name: test-rig
  friendly_name: Test Rig

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Lab hardware-in-the-loop test rig (T8-S3) — real control code, injected values
  area: Lab
  project:
    name: sisu.test_rig
    version: "1.1.0"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
  flash_size: 16MB

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  manual_ip:
    static_ip: "192.168.10.48"
    gateway: "192.168.10.1"
    subnet: "255.255.255.0"
    dns1: "192.168.10.1"
  ap:
    ssid: "Test Rig Fallback"
    password: !secret ap_password

captive_portal:

# NOTE: this board (LilyGo T8-S3 v1.2, 23/8/24) has no firmware-controllable
# LED — confirmed via board photo + LilyGo's own pinout card (no LED/RGB pin
# labeled anywhere) and by testing GPIO21/38/48 live, none of which affected
# the board's onboard light (it's a charge-status LED wired to the battery
# charge IC, not any GPIO). Do not re-add a light: component here without
# new hardware evidence.

