    optimistic: true
    restore_value: true
    initial_value: 0
    mode: box
  # ---- Freezer ----
  - platform: template
    name: "Freezer Temperature (Injected)"
    id: inj_freezer_t
    min_value: -30
    max_value: 30
    step: 0.5
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    initial_value: 4.0
    mode: box
  # ---- Tank levels ----
  - platform: template
    name: "Fresh Water Port · Loop mA (Injected)"
    id: inj_tank_port_ma
    min_value: 2.0
    max_value: 22.0
    step: 0.1
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: 12.0
    mode: box
  - platform: template
    name: "Fresh Water Starboard · Loop mA (Injected)"
    id: inj_tank_stbd_ma
    min_value: 2.0
    max_value: 22.0
    step: 0.1
    unit_of_measurement: "mA"
    optimistic: true
    restore_value: true
    initial_value: 12.0
    mode: box

button:
  # Issue #14: mirrors production's per-side "Clear Alternator Fault" button.
  - platform: template
    name: "Clear Alternator Fault · Port"
    id: p_clear_fault_btn
    on_press:
      - lambda: |-
          id(p_fault_latched) = false;
          ESP_LOGI("test_port", "Fault latch cleared via HA button");
  - platform: template
    name: "Clear Alternator Fault · Starboard"
    id: s_clear_fault_btn
    on_press:
      - lambda: |-
          id(s_fault_latched) = false;
          ESP_LOGI("test_starboard", "Fault latch cleared via HA button");

switch:
  # ---- Enable ----
  - platform: template
    name: "Alternator Enable · Port"
    id: p_enbl
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  - platform: template
    name: "Alternator Enable · Starboard"
    id: s_enbl
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  # ---- Fail switches: freeze that channel's freshness timestamp so the
  #      real stale-sensor fail-safe trips after ~3 s (SENSOR_TIMEOUT_MS) ----
  - platform: template
    name: "Fail House Voltage Sensor · Port"
    id: p_fail_house_v
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Fail Alternator Current Sensor · Port"
    id: p_fail_alt_i
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Fail Alternator Temperature Sensor · Port"
    id: p_fail_alt_t
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Fail Alternator RPM Sensor · Port"
    id: p_fail_rpm
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Fail House Voltage Sensor · Starboard"
    id: s_fail_house_v
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Fail Alternator Current Sensor · Starboard"
    id: s_fail_alt_i
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Fail Alternator Temperature Sensor · Starboard"
    id: s_fail_alt_t
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Fail Alternator RPM Sensor · Starboard"
    id: s_fail_rpm
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Fail Freezer Temperature Sensor"
    id: fail_freezer_t
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Fail Fresh Water Port Sensor"
    id: fail_tank_port
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Fail Fresh Water Starboard Sensor"
    id: fail_tank_stbd
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  # Virtual compressor output — no real GPIO wired on this rig.
  - platform: template
    name: "Freezer Compressor (Sim)"
    id: compressor_switch
    optimistic: true
    restore_mode: ALWAYS_OFF

sensor:
  - platform: wifi_signal
    name: "WiFi Signal · Lab Test Rig"
    update_interval: 60s
    entity_category: diagnostic

  # ---- Alternator field-duty readback + fault trip counters ----
  - platform: template
    name: "Alternator Field Duty · Port"
    id: p_alt_field
    unit_of_measurement: "%"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 1s
    lambda: "return id(p_last_pwm) * 100.0f;"
  - platform: template
    name: "Alternator Fault Trip Count · Port"
    id: p_fault_trip_count_sensor
    lambda: "return (float) id(p_fault_trip_count);"
    update_interval: 2s
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:counter
  - platform: template
    name: "Alternator Field Duty · Starboard"
    id: s_alt_field
    unit_of_measurement: "%"
    accuracy_decimals: 2
    state_class: measurement
    update_interval: 1s
    lambda: "return id(s_last_pwm) * 100.0f;"
  - platform: template
    name: "Alternator Fault Trip Count · Starboard"
    id: s_fault_trip_count_sensor
    lambda: "return (float) id(s_fault_trip_count);"
    update_interval: 2s
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:counter

  # ---- Freezer: real sensor id `freezer_t` (matches climate: sensor:) fed
  #      from the injected number, NaN when its fail switch is on ----
  - platform: template
    name: "Freezer Temperature"
    id: freezer_t
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: 1s
    lambda: |-
      if (id(fail_freezer_t).state) return NAN;
      return id(inj_freezer_t).state;

  # ---- Tank levels: same 4-20 mA -> 0-100% conversion as waterlevels.yaml ----
  - platform: template
    name: "Fresh Water · Port (Test)"
    id: tank_port_level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: water
    state_class: measurement
    update_interval: 1s
    lambda: |-
      if (id(fail_tank_port).state) return {};
      float ma = id(inj_tank_port_ma).state;
      float pct = (ma - 4.0f) / 16.0f * 100.0f;
      if (pct < 0.0f) pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;
      return pct;
  - platform: template
    name: "Fresh Water · Starboard (Test)"
    id: tank_stbd_level
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: water
    state_class: measurement
    update_interval: 1s
    lambda: |-
      if (id(fail_tank_stbd).state) return {};
      float ma = id(inj_tank_stbd_ma).state;
      float pct = (ma - 4.0f) / 16.0f * 100.0f;
      if (pct < 0.0f) pct = 0.0f;
      if (pct > 100.0f) pct = 100.0f;
      return pct;

text_sensor:
  - platform: template
    name: "Alternator Status · Port"
    id: p_alt_msg
    update_interval: never
  - platform: template
    name: "Alternator Charge Stage · Port"
    id: p_alt_stage
    update_interval: 1s
    lambda: |-
      if (id(p_stage) == 1) return std::string("bulk");
      if (id(p_stage) == 2) return std::string("absorption");
      if (id(p_stage) == 3) return std::string("float");
      return std::string("off");
  - platform: template
    name: "Alternator Status · Starboard"
    id: s_alt_msg
    update_interval: never
  - platform: template
    name: "Alternator Charge Stage · Starboard"
    id: s_alt_stage
    update_interval: 1s
    lambda: |-
      if (id(s_stage) == 1) return std::string("bulk");
      if (id(s_stage) == 2) return std::string("absorption");
      if (id(s_stage) == 3) return std::string("float");
      return std::string("off");
