    ip_address:
      name: "IP Address · Lab Test Rig"
      entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Alarm Active · Port"
    id: p_alarm
    device_class: problem
  - platform: template
    name: "Warning Active · Port"
    id: p_warn
  - platform: template
    name: "Alternator Fault Latched · Port"
    id: p_fault_latched_sensor
    device_class: problem
    lambda: "return id(p_fault_latched);"
  - platform: template
    name: "Alarm Active · Starboard"
    id: s_alarm
    device_class: problem
  - platform: template
    name: "Warning Active · Starboard"
    id: s_warn
