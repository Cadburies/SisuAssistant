# Platform: Waveshare ESP32-S3-Touch-LCD-4.3B (800x480 RGB LCD, GT911 touch,
# CH422G IO expander). Wall-mounted guest display in the saloon — issue #63.
# Naming: .ai_context/naming.md §16 rule 7 (display_ prefix, own device,
# no existing domain fit). Standalone, no packages: — not a Marine Board
# (packages/marine_board_base.yaml is PCB-specific, wrong pinout for this board).
# All values shown are read-only imports of existing HA entities — this
# device produces no new sensor data of its own.
esphome:
  name: sisu_saloon_display
  friendly_name: Sisu Saloon Display
  comment: Saloon guest display (Waveshare ESP32-S3-Touch-LCD-4.3B)
  area: Saloon
  # Backlight (#65): mipi_rgb's model preset writes its enable_pin (CH422G
  # EXIO2 - the real backlight line, confirmed against Waveshare's own docs)
  # HIGH once at boot and never touches it again, so it starts lit. Kick off
  # the same 1-minute-then-off cycle a touch would, rather than a separate
  # explicit turn_off, so boot and touch share one path.
  on_boot:
    - script.execute: backlight_timeout_script

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API (device-specific key in secrets.yaml)
api:
  encryption:
    key: !secret saloon_display_api_encryption_key

# Enable OTA updates (device-specific password in secrets.yaml)
ota:
  - platform: esphome
    password: !secret saloon_display_ota_password

# WiFi — Sisu-IoT · 192.168.10.45 (keep in sync with secrets esp_ip_saloon_display)
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  manual_ip:
    static_ip: "192.168.10.45"
    gateway: "192.168.10.1"
    subnet: "255.255.255.0"
  ap:
    ssid: "Saloon Display Fallback"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  local: true

psram:
  mode: octal
  speed: 80MHz

i2c:
  sda: GPIO8
  scl: GPIO9

# LCD reset/enable and touch reset are routed through the board's onboard
# CH422G IO expander, not raw GPIOs (confirmed via docs.waveshare.com/ESP32-S3-Touch-LCD-4.3B).
ch422g:
  - id: ch422g_hub

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-4.3
    id: main_lcd

touchscreen:
  - platform: gt911
    id: main_touch
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: ch422g_hub
      number: 1
    # on_touch is global (whole touchscreen, every page) — not a per-widget
    # LVGL event, so this doesn't need wiring on every button/label.
    on_touch:
      - output.turn_on: backlight_output
      - script.execute: backlight_timeout_script

# Backlight control (#65) — separate from mipi_rgb's own internal enable_pin
# handling (which only ever writes this same physical CH422G EXIO2 pin once,
# at boot — confirmed in esphome's mipi_rgb.cpp setup_enables_(), never
# touched again after that). This output takes over ongoing control of the
# same pin without conflicting, since the display component never writes to
# it again post-boot.
output:
  - platform: gpio
    id: backlight_output
    pin:
      ch422g: ch422g_hub
      number: 2

# Any touch (above) restarts this; mode: restart cancels/re-times any
# already-running instance rather than stacking. CH422G is a plain digital
# GPIO through the IO expander (not PWM-capable per the board's docs), so
# this is a hard on/off, not a graduated dim/fade.
script:
  - id: backlight_timeout_script
    mode: restart
    then:
      - delay: 60s
      - output.turn_off: backlight_output

font:
  # Bold, large — readable from across the saloon, not up close.
  - file: "gfonts://Roboto@bold"
    id: font_large
    size: 60

# Guest WiFi QR code (page_wifi below) — full color/no dithering so the
# dot-style modules and logo overlay stay crisp; resize keeps aspect ratio
# (source 1350x1600) and caps it to the panel's 480px height.
image:
  - id: wifi_qr
    file: images/sisu_guest_wifi.jpg
    resize: 480x480
    type: RGB565

# Last-known depth: sensor.nmea_depth has expire_after: 30 in HA
# (packages/source_health.yaml) and goes unavailable when instruments are
# switched off. Latch the last real reading here so the display doesn't
# blank on every instrument power-cycle. restore_value: true so a device
# reboot/reflash (this board gets both often) doesn't blank it either.
globals:
  - id: depth_latched
    type: float
    restore_value: true
    initial_value: "0.0"
  # AWS 1h trend (#66): HA owns the rolling window (sensor.nmea_aws already
  # has state_class: measurement -> 5min long-term stats already exist).
  # automations.yaml's sisu_wind_trend_aws_1h pulls the last hour every
  # 5 min and publishes 12 CSV values to sisu/v1/wind/aws_trend; the
  # ha_aws_trend text_sensor below parses the whole set into these globals
  # every time (not a local shift-in-one-sample-at-a-time buffer anymore —
  # avoids mixing HA's 5min means with locally-sampled instantaneous values
  # on the same line). restore_value: true survives a brief reboot between
  # MQTT pushes; a real outage still needs the next push to catch up.
  # Plain scalar globals, not an array — GlobalsComponent<T> takes T by
  # value in its constructor, which is ambiguous/broken for both raw C
  # arrays (decay to a pointer) and std::array (collides with the
  # component's own array-specialized ctor).
  - id: aws_ring_0
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: aws_ring_1
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: aws_ring_2
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: aws_ring_3
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: aws_ring_4
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: aws_ring_5
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: aws_ring_6
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: aws_ring_7
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: aws_ring_8
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: aws_ring_9
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: aws_ring_10
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: aws_ring_11
    type: float
    restore_value: true
    initial_value: "0.0"
  # Computed alongside the ring each time ha_aws_trend updates — drives the
  # "Max(1h)" header, guaranteed to match what's actually plotted since
  # it's the max of that same parsed set, not a second independently
  # sourced statistic.
  - id: aws_max_1h
    type: float
    restore_value: true
    initial_value: "0.0"

lvgl:
  # Plain invisible layout containers — an `obj` has a visible panel
  # background/border by default, which we don't want around each row.
  style_definitions:
    - id: row_container
      bg_opa: TRANSP
      border_width: 0
      pad_all: 0
  displays:
    - main_lcd
  touchscreens:
    - main_touch
  pages:
    - id: page_home
      # ESPHome's lvgl `pages:` list has no built-in swipe-to-navigate —
      # has to be wired explicitly, same on_swipe_left/right on every page.
      on_swipe_left:
        - lvgl.page.next:
      on_swipe_right:
        - lvgl.page.previous:
      layout:
        type: flex
        flex_flow: column
        # start + a small fixed pad_row instead of space_evenly — with
        # Water Temp now sometimes wrapping to its own line (2 items ->
        # sometimes 5 rendered lines total), distributing leftover space
        # evenly left large gaps between groups; a fixed gap stays tight
        # regardless of how many lines any one row wraps into.
        flex_align_main: start
        flex_align_cross: center
        pad_row: 10
      widgets:
        - obj:
            width: 100%
            height: SIZE_CONTENT
            scrollable: false
            scrollbar_mode: "off"
            styles: [row_container]
            layout:
              type: flex
              flex_flow: row_wrap
              flex_align_main: space_evenly
            widgets:
              - label:
                  id: lbl_air_temp
                  text_font: font_large
                  text: "Air --.-°C"
              - label:
                  id: lbl_water_temp
                  text_font: font_large
                  text: "Water --.-°C / --.-°F"
        - obj:
            width: 100%
            height: SIZE_CONTENT
            scrollable: false
            scrollbar_mode: "off"
            styles: [row_container]
            layout:
              type: flex
              flex_flow: row_wrap
              flex_align_main: space_evenly
            widgets:
              - label:
                  id: lbl_depth
                  text_font: font_large
                  text: "Depth --.-m"
              - label:
                  id: lbl_aws_max_home
                  text_font: font_large
                  text: "AWS max --.- kn"
        - obj:
            width: 100%
            height: SIZE_CONTENT
            scrollable: false
            scrollbar_mode: "off"
            styles: [row_container]
            layout:
              type: flex
              flex_flow: row_wrap
              flex_align_main: space_evenly
            widgets:
              - label:
                  id: lbl_sunrise
                  text_font: font_large
                  text: "Sunrise --:--"
              - label:
                  id: lbl_sunset
                  text_font: font_large
                  text: "Sunset --:--"
    - id: page_wind
      on_swipe_left:
        - lvgl.page.next:
      on_swipe_right:
        - lvgl.page.previous:
      layout:
        type: flex
        flex_flow: column
        flex_align_cross: center
      widgets:
        - obj:
            width: 100%
            height: SIZE_CONTENT
            scrollable: false
            scrollbar_mode: "off"
            styles: [row_container]
            layout:
              type: flex
              flex_flow: row_wrap
              flex_align_main: space_evenly
            widgets:
              - label:
                  id: lbl_aws_now
                  text_font: font_large
                  text: "AWS --.- kn"
              - label:
                  id: lbl_aws_max_wind
                  text_font: font_large
                  text: "Max(1h) --.- kn"
        # 12-point rolling AWS trend, one point every 5 min = last hour.
        # ESPHome's lvgl component (2026.7.1) has no chart widget, so the
        # trend is a `line` whose points are redrawn from a ring buffer
        # (see `globals: aws_ring` + the 5min interval below).
        - line:
            id: aws_line
            line_width: 4
            line_rounded: true
            points:
              - {x: 0, y: 300}
              - {x: 69, y: 300}
              - {x: 138, y: 300}
              - {x: 207, y: 300}
              - {x: 276, y: 300}
              - {x: 345, y: 300}
              - {x: 414, y: 300}
              - {x: 483, y: 300}
              - {x: 552, y: 300}
              - {x: 621, y: 300}
              - {x: 690, y: 300}
              - {x: 759, y: 300}
    # Guest WiFi: QR code on the left, network name + password spelled out
    # on the right for anyone who'd rather type it in by hand.
    - id: page_wifi
      on_swipe_left:
        - lvgl.page.next:
      on_swipe_right:
        - lvgl.page.previous:
      layout:
        type: flex
        flex_flow: row
        # start packs both items flush against the left edge, one right
        # after the other, with only pad_column between them — no
        # distributed/leftover-space margins pushing anything around.
        flex_align_main: start
        flex_align_cross: center
        pad_column: 16
      widgets:
        - image:
            src: wifi_qr
        - obj:
            # No explicit width defaults to LVGL's small stock object size,
            # which was clipping "***REMOVED***" at that fixed edge — size to
            # the labels' actual content instead.
            width: SIZE_CONTENT
            height: SIZE_CONTENT
            scrollable: false
            scrollbar_mode: "off"
            styles: [row_container]
            layout:
              type: flex
              flex_flow: column
              flex_align_main: center
              flex_align_cross: center
              pad_row: 16
            widgets:
              - label:
                  text_font: font_large
                  text: "Password:"
              - label:
                  text_font: font_large
                  text: !secret guest_wifi_password

text_sensor:
  - platform: homeassistant
    id: ha_sunrise
    entity_id: sensor.sisu_sunrise
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_sunrise
            text: !lambda 'return "Sunrise " + x;'
  - platform: homeassistant
    id: ha_sunset
    entity_id: sensor.sisu_sunset
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_sunset
            text: !lambda 'return "Sunset " + x;'
  # AWS 1h trend (#66): sisu_wind_trend_aws_1h (automations.yaml) publishes
  # 12 CSV values (oldest->newest) to sisu/v1/wind/aws_trend every 5 min,
  # pulled from sensor.nmea_aws's existing 5min long-term stats — HA owns
  # the whole rolling window, this just parses and redraws each push
  # rather than locally shifting/sampling (see globals: comment above for
  # why not doing that anymore).
  - platform: homeassistant
    id: ha_aws_trend
    entity_id: sensor.nmea_aws_trend_1h
    on_value:
      then:
        - lambda: |-
            std::string csv = x;
            float vals[12] = {0};
            size_t pos = 0;
            size_t idx = 0;
            while (idx < 12) {
              size_t comma = csv.find(',', pos);
              std::string token = (comma == std::string::npos) ? csv.substr(pos) : csv.substr(pos, comma - pos);
              vals[idx] = atof(token.c_str());
              idx++;
              if (comma == std::string::npos) break;
              pos = comma + 1;
            }
            id(aws_ring_0) = vals[0];
            id(aws_ring_1) = vals[1];
            id(aws_ring_2) = vals[2];
            id(aws_ring_3) = vals[3];
            id(aws_ring_4) = vals[4];
            id(aws_ring_5) = vals[5];
            id(aws_ring_6) = vals[6];
            id(aws_ring_7) = vals[7];
            id(aws_ring_8) = vals[8];
            id(aws_ring_9) = vals[9];
            id(aws_ring_10) = vals[10];
            id(aws_ring_11) = vals[11];
            float mx = vals[0];
            for (int i = 1; i < 12; i++) {
              if (vals[i] > mx) mx = vals[i];
            }
            id(aws_max_1h) = mx;
        - lvgl.label.update:
            id: lbl_aws_max_wind
            text: !lambda 'return str_sprintf("Max(1h) %.1f kn", id(aws_max_1h));'
        - lvgl.line.update:
            id: aws_line
            points:
              - {x: 0,   y: !lambda 'return (int) (300 - std::min(std::max(id(aws_ring_0), 0.0f), 30.0f) * 10);'}
              - {x: 69,  y: !lambda 'return (int) (300 - std::min(std::max(id(aws_ring_1), 0.0f), 30.0f) * 10);'}
              - {x: 138, y: !lambda 'return (int) (300 - std::min(std::max(id(aws_ring_2), 0.0f), 30.0f) * 10);'}
              - {x: 207, y: !lambda 'return (int) (300 - std::min(std::max(id(aws_ring_3), 0.0f), 30.0f) * 10);'}
              - {x: 276, y: !lambda 'return (int) (300 - std::min(std::max(id(aws_ring_4), 0.0f), 30.0f) * 10);'}
              - {x: 345, y: !lambda 'return (int) (300 - std::min(std::max(id(aws_ring_5), 0.0f), 30.0f) * 10);'}
              - {x: 414, y: !lambda 'return (int) (300 - std::min(std::max(id(aws_ring_6), 0.0f), 30.0f) * 10);'}
              - {x: 483, y: !lambda 'return (int) (300 - std::min(std::max(id(aws_ring_7), 0.0f), 30.0f) * 10);'}
              - {x: 552, y: !lambda 'return (int) (300 - std::min(std::max(id(aws_ring_8), 0.0f), 30.0f) * 10);'}
              - {x: 621, y: !lambda 'return (int) (300 - std::min(std::max(id(aws_ring_9), 0.0f), 30.0f) * 10);'}
              - {x: 690, y: !lambda 'return (int) (300 - std::min(std::max(id(aws_ring_10), 0.0f), 30.0f) * 10);'}
              - {x: 759, y: !lambda 'return (int) (300 - std::min(std::max(id(aws_ring_11), 0.0f), 30.0f) * 10);'}

sensor:
  - platform: homeassistant
    id: ha_air_temp
    entity_id: sensor.sisu_air_temp
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_air_temp
            text: !lambda 'return str_sprintf("Air %.1f°C", x);'
  - platform: homeassistant
    id: ha_water_temp
    entity_id: sensor.sisu_water_temp
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_water_temp
            # + °F for American guests — Air stays °C-only, only Water was asked for.
            text: !lambda 'return str_sprintf("Water %.1f°C / %.1f°F", x, x * 9.0f / 5.0f + 32.0f);'
  - platform: homeassistant
    id: ha_depth
    entity_id: sensor.nmea_depth
    on_value:
      then:
        - lambda: |-
            if (!isnan(x)) {
              id(depth_latched) = x;
            }
        - lvgl.label.update:
            id: lbl_depth
            text: !lambda 'return str_sprintf("Depth %.1fm", id(depth_latched));'
  - platform: homeassistant
    id: ha_aws_max_6h
    entity_id: sensor.apparent_wind_speed_max_6h
    on_value:
      then:
        # page_home's headline "worst gust today" stat only — the genuine
        # 6h rolling ceiling. page_wind's own header is Max(1h), driven by
        # ha_aws_trend below (#66), not this sensor.
        - lvgl.label.update:
            id: lbl_aws_max_home
            text: !lambda 'return str_sprintf("AWS max %.1f kn", x);'
  - platform: homeassistant
    id: ha_aws
    entity_id: sensor.nmea_aws
    on_value:
      then:
        - lvgl.label.update:
            id: lbl_aws_now
            text: !lambda 'return str_sprintf("AWS %.1f kn", x);'
