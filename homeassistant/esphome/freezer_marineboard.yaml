# Freezer CONTROLLER on a Marine Board — 192.168.10.44 (Sisu-IoT)
# v1.9.1 board, not fitted yet (#218). Full-speed Weekender firmware (#221).
# Plan: MarineBoard/Documentation/Freezer-Replacement-Plan.md
#
# Danfoss 101N0500 C-T loop is on U12 NC, through 1,523 ohm (3,500 rpm).
# GPIO7 high energises the coil and opens NC, which stops the compressor.
# GPIO7 low, or a dead ESP that never drives the pin, leaves NC closed.
# Eco / low speed is not in this file. One contact, full speed or stop.
# Do not wire C-T to NO. That was the previous build.
#
# The LilyGo (freezer_display.yaml, .47) is a client over ESP-NOW.
# This board does not read it to decide whether to cool.
# Wiring (Marine Board, top-side connectors):
#   DS18B20 -> U13 pin 3 TMP1 (GPIO15)
#   Danfoss C -> 1,523 ohm -> U12 NC. Danfoss T -> U12 COM (F4 is in that leg)
#   Danfoss C to P jumper, 0 ohm (module floor 9.6 / 10.9 V)
#   Danfoss D flashes -> ENBL opto, GPIO8 (active low, internal pull-up)
#   U4 SH+ and SH- both to the same 12 V feed as the module + and -
#   CN1 12 V for the board. CN2 PWM is not used.
substitutions:
  device_name: freezer
  friendly_name: Sisu Freezer
  area_name: Aft Cockpit
  loc_label: Aft Cockpit
  static_ip: "192.168.10.44"
  # Used only after wifi.disable, when there is no AP. Same number in freezer_display.yaml.
  espnow_channel: "6"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Aft Cockpit Freezer (Marine Board)
  area: ${area_name}

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 32MB
  flash_mode: opi
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_OCT_FLASH: y
      CONFIG_ESP_TASK_WDT_EN: y
      CONFIG_ESP_TASK_WDT_INIT: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "8"
      CONFIG_ESP_TASK_WDT_PANIC: y
      CONFIG_ESP_BROWNOUT_DET: y
    advanced:
      enable_idf_experimental_features: true

psram:
  mode: octal
  speed: 80MHz

packages:
  board: !include packages/marine_board_base.yaml
  diag: !include packages/esp_diag.yaml

api:
  encryption:
    key: !secret freezer_api_encryption_key

espnow:
  id: espnow_link
  peers:
    - !secret freezer_display_peer_mac

# Outgoing key encrypts what we send. The provider key decrypts the display.
# Peer MAC is filled at commission (INSTALLATION.md §8). A placeholder MAC
# will not pass traffic.
packet_transport:
  - platform: espnow
    id: freezer_link
    espnow_id: espnow_link
    peer_address: !secret freezer_display_peer_mac
    update_interval: 5s
    rolling_code_enable: true
    encryption:
      key: !secret freezer_espnow_key
    providers:
      - name: freezer_display
        encryption:
          key: !secret freezer_espnow_key
    sensors:
      - id: freezer_t
        broadcast_id: cabinet_c
      - id: link_target
        broadcast_id: target_c
      - id: link_mode
        broadcast_id: mode_n
      - id: battery_voltage
        broadcast_id: volts
      - id: link_level
        broadcast_id: level_n
      - id: fault_code
        broadcast_id: fault_n
      - id: link_heartbeat
        broadcast_id: hb
    binary_sensors:
      - id: compressor_run
        broadcast_id: run
      - id: ds18b20_fail
        broadcast_id: probe_fail
      - id: battery_low
        broadcast_id: batt_cut

output:
  # High = coil on = NC open = stopped. Low = full speed.
  - platform: gpio
    pin: GPIO7
    id: coil_pin

globals:
  - id: run_cmd
    type: bool
    restore_value: false
    initial_value: "true"
  - id: first_decision
    type: bool
    restore_value: false
    initial_value: "true"
  - id: run_changed_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: probe_ever_ok
    type: bool
    restore_value: false
    initial_value: "false"
  - id: probe_missing
    type: bool
    restore_value: false
    initial_value: "false"
  - id: battery_hold
    type: bool
    restore_value: false
    initial_value: "false"
  - id: seen_cut_in
    type: bool
    restore_value: false
    initial_value: "false"
  - id: protect_idx
    type: int
    restore_value: false
    initial_value: "-1"
  - id: fault_edges
    type: int
    restore_value: false
    initial_value: "0"
  - id: fault_last_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"
  - id: fault_code_n
    type: int
    restore_value: false
    initial_value: "0"
  - id: last_alert
    type: int
    restore_value: false
    initial_value: "0"
  - id: last_seq
    type: int
    restore_value: true
    initial_value: "0"
  - id: heartbeat_n
    type: int
    restore_value: false
    initial_value: "0"
  - id: wifi_down_s
    type: int
    restore_value: false
    initial_value: "0"
  - id: radio_parked
    type: bool
    restore_value: false
    initial_value: "false"
  - id: radio_busy
    type: bool
    restore_value: false
    initial_value: "false"

script:
  # Owns the coil. Climate timers stay at 1 s so they do not block the
  # exceptions below. 180 s min run / min off lives here.
  - id: apply_run
    mode: single
    then:
      - lambda: |-
          const uint32_t now = millis();
          const bool mode_off = id(freezer_climate).mode != climate::CLIMATE_MODE_COOL;
          const bool probe_ok = id(freezer_t).has_state() && !isnan(id(freezer_t).state);
          if (probe_ok) id(probe_ever_ok) = true;
          id(probe_missing) = !probe_ok && (id(probe_ever_ok) || now > 20000);

          auto opt = id(protection).current_option();
          float cut_out = 9.6f;
          float cut_in = 10.9f;
          int pidx = 0;
          if (opt == "Med") { cut_out = 10.4f; cut_in = 11.7f; pidx = 1; }
          else if (opt == "High") { cut_out = 11.3f; cut_in = 12.5f; pidx = 2; }
          if (pidx != id(protect_idx)) {
            id(protect_idx) = pidx;
            id(seen_cut_in) = false;
          }

          const bool v_known = id(battery_voltage).has_state() && !isnan(id(battery_voltage).state);
          if (v_known) {
            const float v = id(battery_voltage).state;
            if (v >= cut_in) {
              id(seen_cut_in) = true;
              id(battery_hold) = false;
            } else if (!id(seen_cut_in) || v < cut_out) {
              id(battery_hold) = true;
            }
          }

          bool wants = false;
          if (!mode_off && probe_ok && !isnan(id(freezer_climate).target_temperature)) {
            const float t = id(freezer_t).state;
            const float sp = id(freezer_climate).target_temperature;
            if (t >= sp + 0.8f) wants = true;
            else if (t <= sp - 1.5f) wants = false;
            else wants = id(run_cmd);
          }
          bool should = wants && !mode_off && !id(probe_missing) && !id(battery_hold);
          // No probe yet, and nothing else has stopped us: keep the boot run.
          if (!probe_ok && !id(probe_missing) && !mode_off && !id(battery_hold))
            should = true;

          const bool skip_min = id(first_decision) || id(probe_missing);
          if (!skip_min && id(run_changed_ms) != 0) {
            const uint32_t elapsed = now - id(run_changed_ms);
            // Cut-out stops now. The 180 s minimum still blocks the next start.
            if (id(run_cmd) && !should && !id(battery_hold) && elapsed < 180000) should = true;
            if (!id(run_cmd) && should && elapsed < 180000) should = false;
          }

          if (should != id(run_cmd)) {
            id(run_cmd) = should;
            id(run_changed_ms) = now;
          }
          if (should) {
            id(coil_pin).turn_off();
            if (!id(compressor_switch).state) id(compressor_switch).publish_state(true);
          } else {
            id(coil_pin).turn_on();
            if (id(compressor_switch).state) id(compressor_switch).publish_state(false);
          }

          const bool can_decide = probe_ok || id(probe_missing) || mode_off || id(battery_hold);
          if (id(first_decision) && can_decide) {
            id(first_decision) = false;
            if (id(run_changed_ms) == 0) id(run_changed_ms) = now;
          }
          id(battery_low).publish_state(id(battery_hold));
          id(ds18b20_fail).publish_state(id(probe_missing));
          id(compressor_run).publish_state(should);

  - id: apply_remote
    mode: single
    then:
      - lambda: |-
          if (!id(rx_seq).has_state() || isnan(id(rx_seq).state)) return;
          const int seq = (int) id(rx_seq).state;
          if (seq < 1 || seq == id(last_seq)) return;
          id(last_seq) = seq;
          auto call = id(freezer_climate).make_call();
          if (id(rx_mode).has_state() && !isnan(id(rx_mode).state)) {
            call.set_mode(id(rx_mode).state > 0.5f ? climate::CLIMATE_MODE_COOL
                                                    : climate::CLIMATE_MODE_OFF);
          }
          if (id(rx_target).has_state() && !isnan(id(rx_target).state)) {
            float t = id(rx_target).state;
            if (t < -30.0f) t = -30.0f;
            if (t > 20.0f) t = 20.0f;
            call.set_target_temperature(t);
          }
          call.perform();
          if (id(rx_level).has_state() && !isnan(id(rx_level).state)) {
            const int lv = (int) id(rx_level).state;
            const char *name = lv >= 2 ? "High" : lv == 1 ? "Med" : "Low";
            auto sel = id(protection).make_call();
            sel.set_option(name);
            sel.perform();
          }
          id(apply_run).execute();

  - id: beep_alert
    mode: restart
    parameters:
      freq: int
    then:
      - output.ledc.set_frequency:
          id: sys_buzz_out
          frequency: !lambda "return freq;"
      - output.set_level:
          id: sys_buzz_out
          level: 0.5
      - delay: 120ms
      - output.set_level:
          id: sys_buzz_out
          level: 0.0
      - delay: 90ms
      - output.set_level:
          id: sys_buzz_out
          level: 0.5
      - delay: 120ms
      - output.set_level:
          id: sys_buzz_out
          level: 0.0

  - id: park_radio
    mode: single
    then:
      - lambda: "id(radio_busy) = true;"
      - wifi.disable:
      - delay: 500ms
      - espnow.set_channel: ${espnow_channel}
      - lambda: |-
          id(radio_parked) = true;
          id(radio_busy) = false;
      - logger.log: "ESP-NOW on fixed channel, Wi-Fi off"

  - id: try_wifi
    mode: single
    then:
      - lambda: "id(radio_busy) = true;"
      - wifi.enable:
      - delay: 25s
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: |-
                id(radio_parked) = false;
                id(wifi_down_s) = 0;
                id(radio_busy) = false;
          else:
            - wifi.disable:
            - delay: 500ms
            - espnow.set_channel: ${espnow_channel}
            - lambda: |-
                id(radio_parked) = true;
                id(wifi_down_s) = 30;
                id(radio_busy) = false;

switch:
  # Status only. ON means the compressor is running. apply_run owns GPIO7.
  # A tap here must not pulse the coil during a battery cut-out.
  - platform: template
    name: "Freezer Compressor"
    id: compressor_switch
    optimistic: true
    restore_mode: ALWAYS_ON

one_wire:
  - platform: gpio
    pin: GPIO15
    id: temp_freezer

binary_sensor:
  - platform: template
    name: "Battery Low"
    id: battery_low
    device_class: battery
    lambda: "return id(battery_hold);"
  - platform: template
    name: "DS18B20 Status"
    id: ds18b20_fail
    device_class: problem
    lambda: "return id(probe_missing);"
  - platform: template
    id: compressor_run
    internal: true
    lambda: "return id(run_cmd);"
  # ENBL opto. Unconnected pull-up reads as no flash. A low pulse is one flash.
  - platform: gpio
    id: danfoss_d
    internal: true
    pin:
      number: GPIO8
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      then:
        - lambda: |-
            const uint32_t now = millis();
            if (id(fault_last_ms) != 0 && now - id(fault_last_ms) > 1000)
              id(fault_edges) = 0;
            id(fault_edges) += 1;
            id(fault_last_ms) = now;
  - platform: gpio
    id: flash_btn
    internal: true
    pin:
      number: GPIO0
      inverted: true
      ignore_strapping_warning: true
    on_multi_click:
      - timing:
          - ON for at most 0.5s
          - OFF for at least 0.4s
        then:
          - lambda: |-
              auto call = id(freezer_climate).make_call();
              call.set_mode(id(freezer_climate).mode == climate::CLIMATE_MODE_OFF
                            ? climate::CLIMATE_MODE_COOL : climate::CLIMATE_MODE_OFF);
              call.perform();
              id(apply_run).execute();
      - timing:
          - ON for at most 0.5s
          - OFF for at most 0.4s
          - ON for at most 0.5s
          - OFF for at least 0.2s
        then:
          - lambda: |-
              auto call = id(freezer_climate).make_call();
              const float t = id(freezer_climate).target_temperature;
              call.set_preset((isnan(t) || t > 0.0f) ? "freeze" : "fridge");
              call.set_mode(climate::CLIMATE_MODE_COOL);
              call.perform();
              id(apply_run).execute();

sensor:
  - platform: dallas_temp
    one_wire_id: temp_freezer
    name: "Freezer Temperature"
    id: freezer_t
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    update_interval: 15s
    filters:
      - offset: 0.0
      - multiply: 1.0
    on_value:
      then:
        - script.execute: apply_run
  - platform: ina226
    address: 0x40
    shunt_resistance: 0.0001875
    max_current: 400.0
    update_interval: 10s
    bus_voltage:
      name: "Battery Voltage"
      id: battery_voltage
      unit_of_measurement: "V"
      accuracy_decimals: 1
      device_class: voltage
      filters:
        # A sag under 9.5 V is real. It has to latch the cut-out. Only a
        # reading above 16.5 V is ignored, so a glitch cannot look like a
        # recovered battery.
        - lambda: |-
            if (x > 16.5f) return NAN;
            return x;
      on_value:
        then:
          - script.execute: apply_run
  - platform: template
    id: link_target
    internal: true
    update_interval: 2s
    lambda: "return id(freezer_climate).target_temperature;"
  - platform: template
    id: link_mode
    internal: true
    update_interval: 2s
    lambda: |-
      return id(freezer_climate).mode == climate::CLIMATE_MODE_COOL ? 1.0f : 0.0f;
  - platform: template
    id: link_level
    internal: true
    update_interval: 2s
    lambda: |-
      auto opt = id(protection).current_option();
      if (opt == "High") return 2.0f;
      if (opt == "Med") return 1.0f;
      return 0.0f;
  - platform: template
    name: "Fault Code"
    id: fault_code
    accuracy_decimals: 0
    icon: mdi:alert
    update_interval: 1s
    lambda: "return id(fault_code_n);"
  - platform: template
    id: link_heartbeat
    internal: true
    update_interval: 2s
    lambda: |-
      id(heartbeat_n) += 1;
      if (id(heartbeat_n) > 1000000) id(heartbeat_n) = 1;
      return id(heartbeat_n);
  - platform: packet_transport
    provider: freezer_display
    remote_id: req_seq
    id: rx_seq
    internal: true
    on_value:
      then:
        - script.execute: apply_remote
  - platform: packet_transport
    provider: freezer_display
    remote_id: req_target
    id: rx_target
    internal: true
  - platform: packet_transport
    provider: freezer_display
    remote_id: req_mode
    id: rx_mode
    internal: true
  - platform: packet_transport
    provider: freezer_display
    remote_id: req_level
    id: rx_level
    internal: true

select:
  - platform: template
    name: "Protection"
    id: protection
    optimistic: true
    restore_value: true
    initial_option: Low
    options:
      - Low
      - Med
      - High
    set_action:
      - script.execute: apply_run

climate:
  - platform: thermostat
    id: freezer_climate
    name: "Freezer Thermostat"
    sensor: freezer_t
    # Real 180 s gate is in apply_run. These stay at 1 s so a missing probe
    # and the first decision after boot are not held for three minutes.
    min_idle_time: 1s
    min_cooling_off_time: 1s
    min_cooling_run_time: 1s
    startup_delay: false
    cool_action:
      - script.execute: apply_run
    idle_action:
      - script.execute: apply_run
    cool_overrun: 1.5
    cool_deadband: 0.8
    visual:
      min_temperature: -30
      max_temperature: 20
      temperature_step: 1
    default_preset: freeze
    on_boot_restore_from: memory
    preset:
      - name: freeze
        default_target_temperature_high: -5 °C
        mode: COOL
      - name: fridge
        default_target_temperature_high: 4 °C
        mode: COOL

interval:
  - interval: 1s
    then:
      - script.execute: apply_run
  - interval: 200ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (id(fault_edges) > 0 && id(fault_last_ms) != 0 && now - id(fault_last_ms) > 1000) {
            const int n = id(fault_edges);
            id(fault_edges) = 0;
            if (n >= 1 && n <= 5) id(fault_code_n) = n;
          } else if (id(fault_code_n) != 0 && id(fault_last_ms) != 0 && now - id(fault_last_ms) > 6000) {
            id(fault_code_n) = 0;
          }
  - interval: 5s
    then:
      - lambda: |-
          if (id(radio_busy)) return;
          if (wifi::global_wifi_component != nullptr && wifi::global_wifi_component->is_connected()) {
            id(wifi_down_s) = 0;
            id(radio_parked) = false;
            return;
          }
          id(wifi_down_s) += 5;
          if (!id(radio_parked) && id(wifi_down_s) >= 30) id(park_radio).execute();
          else if (id(radio_parked) && id(wifi_down_s) >= 180) id(try_wifi).execute();
  # Cyan solid = running. Green short = cooling, cabinet cold. White short = off.
  # Amber = probe missing. Red slow = firmware battery cut-out. Red fast = Danfoss
  # code or a firmware fault. Blue short = Wi-Fi is up but the HA API is not.
  # Off the boat Wi-Fi is parked, so blue stays off and the run state shows.
  - interval: 50ms
    then:
      - lambda: |-
          id(sys_led_owner) = true;
          const uint32_t now = millis();
          const bool wifi_up = id(wifi_down_s) == 0 && !id(radio_parked);
          const bool api_up = api::global_api_server != nullptr && api::global_api_server->is_connected();
          const bool danfoss = id(fault_code_n) >= 1 && id(fault_code_n) <= 5;
          const bool fw_fault = App.get_app_state() & STATUS_LED_ERROR;
          uint32_t color, on_ms, period_ms;
          int alert = 0;
          if (fw_fault || danfoss) {
            color = 0xFF0000; on_ms = 150; period_ms = 300; alert = 1;
          } else if (id(probe_missing)) {
            color = 0xFF8000; on_ms = 500; period_ms = 1000; alert = 2;
          } else if (id(battery_hold)) {
            color = 0xFF0000; on_ms = 500; period_ms = 1500; alert = 3;
          } else if (wifi_up && !api_up) {
            color = 0x0000FF; on_ms = 100; period_ms = 1000;
          } else if (id(run_cmd)) {
            color = 0x00E0FF; on_ms = 1000; period_ms = 1000;
          } else if (id(freezer_climate).mode == climate::CLIMATE_MODE_OFF) {
            color = 0xFFFFFF; on_ms = 60; period_ms = 2000;
          } else {
            color = 0x00FF00; on_ms = 60; period_ms = 2000;
          }
          if (alert != id(last_alert)) {
            id(last_alert) = alert;
            if (alert == 1) id(beep_alert).execute(3200);
            else if (alert == 2) id(beep_alert).execute(2800);
            else if (alert == 3) id(beep_alert).execute(2400);
          }
          const bool on = (now % period_ms) < on_ms;
          if (color != id(sys_led_color) || on != id(sys_led).state) {
            id(sys_led_color) = color;
            if (on) id(sys_led).turn_on(); else id(sys_led).turn_off();
          }
