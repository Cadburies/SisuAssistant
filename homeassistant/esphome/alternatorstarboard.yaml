# Starboard alternator entrypoint — 192.168.10.42
substitutions:
  device_name: alternatorstarboard
  friendly_name: Alternator Starboard
  area_name: Engine Starboard
  side_label: Starboard
  loc_label: Engine Starboard
  sk_side: starboard
  static_ip: "192.168.10.42"
  test_mode_enabled: "false"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Alternator Starboard (Marine Board)
  area: ${area_name}
  on_boot:
    priority: 600
    then:
      - output.turn_off: alt_field_out
      - output.turn_off: sys_buzz_out

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

packages:
  board: !include packages/marine_board_base.yaml
  alt: !include packages/marine_alternator.yaml
