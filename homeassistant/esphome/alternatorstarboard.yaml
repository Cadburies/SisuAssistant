# Starboard alternator entrypoint — 192.168.10.42
substitutions:
  device_name: alternatorstarboard
  friendly_name: Alternator Starboard
  area_name: Engine Starboard
  side_label: Starboard
  loc_label: Engine Starboard
  sk_side: starboard
  static_ip: "192.168.10.42"
  # Issue #16: other side's HA entities (telemetry pipe for the share cap).
  peer_current_entity: sensor.alternatorport_alternator_current_port
  peer_online_entity: binary_sensor.sisu_alternatorport_online

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: Alternator Starboard (Marine Board)
  area: ${area_name}
  on_boot:
    priority: 600
    then:
      - output.turn_off: alt_field_out
      - output.turn_off: sys_buzz_out

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_EN: y
      CONFIG_ESP_TASK_WDT_INIT: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "8"
      CONFIG_ESP_TASK_WDT_PANIC: y
      CONFIG_ESP_BROWNOUT_DET: y

packages:
  board: !include packages/marine_board_base.yaml
  diag: !include packages/esp_diag.yaml
  alt: !include packages/marine_alternator.yaml
