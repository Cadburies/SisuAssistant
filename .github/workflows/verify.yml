# CI backstop for the agent task loop (#195): the vessel-independent subset of
# scripts/verify.sh over every tracked file. Main stays direct-push, so a red run
# is a signal, not a block. Live probes and the real-value secret scan stay local
# (they need the gitignored secrets.yaml); CI runs on secrets.yaml.example.
name: Verify
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sisu-nav/web/package-lock.json
      - name: Install tools
        run: |
          pip install --quiet esphome pyyaml
          npm ci --prefix sisu-nav/web
      - name: Placeholder secrets
        run: |
          cp homeassistant/secrets.yaml.example homeassistant/secrets.yaml
          ln -sf ../secrets.yaml homeassistant/esphome/secrets.yaml
          ./scripts/gen-docker-env.sh
          git config core.hooksPath .githooks
      - name: verify.sh --all
        # exit 3 = green with a box deploy pending, which is expected for every
        # HAOS/F8 file in --all mode
        run: |
          set +e
          ./scripts/verify.sh --all
          rc=$?
          [ "$rc" -eq 0 ] || [ "$rc" -eq 3 ]
